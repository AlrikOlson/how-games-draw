    bu.uBRes.value.set(rtGi.width, rtGi.height); bu.tIn.value = rtGi.texture; bu.uDir.value.set(1, 0); pass(blurMat, rtGi2); bu.tIn.value = rtGi2.texture; bu.uDir.value.set(0, 1); pass(blurMat, rtGi); gOut = rtGi; }
  reflMat.uniforms.gA.value = rtG.textures[0]; reflMat.uniforms.gB.value = rtG.textures[1]; reflMat.uniforms.gC.value = rtG.textures[2]; pass(reflMat, rtR);
  const cu = compMat.uniforms; cu.gA.value = rtG.textures[0]; cu.gB.value = rtG.textures[1]; cu.gC.value = rtG.textures[2]; cu.gD.value = rtG.textures[3]; cu.tV.value = sOut.texture; cu.tG.value = gOut.texture; cu.tR.value = rtR.texture; cu.tPrev.value = accPrev.texture;
