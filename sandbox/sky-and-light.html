s1.slider('Haze (dust and water in the air)', { min: 1, max: 20, step: 0.5, value: 3 }, v => { atm.turbidity = v; placeSun(); });
s1.slider('Haze strength', { min: 0.001, max: 0.03, step: 0.001, value: 0.006, fmt: v => (+v).toFixed(3) }, v => { atm.mie = v; placeSun(); });
s1.slider('Glow around the sun', { min: 0.5, max: 0.97, step: 0.01, value: 0.8, fmt: v => (+v).toFixed(2) }, v => { atm.g = v; placeSun(); });
s1.slider('Sun size (a bigger sun makes softer shadows)', { min: 0.2, max: 6, step: 0.1, value: 0.54, unit: '°' }, v => { atm.sunDeg = v; placeSun(); });
s1.toggle('a moon at night', true, v => { moonOn = v; placeSun(); });
const sunHRead = s1.readout('sun height'), sunCRead = s1.readout('sun colour and strength, from the sky');

const s2 = sb.panel.section('02 · Light and bounces', 'The sun, the moon, the fire and the lanterns are the only things that make light. Everything else is light that bounced: off the sky, off the ground, off the walls. Turn the sky off and every shadow goes black; turn the bounces off and the underside of everything goes black.');
s2.segment('Light from', [{ value: 'both', label: 'sun and sky' }, { value: 'sun', label: 'the sun only' }, { value: 'sky', label: 'the sky only' }], 'both', v => { lightFrom = v; placeSun(); });
s2.slider('Sun strength', { min: 0, max: 3, step: 0.05, value: 1, fmt: v => '× ' + (+v).toFixed(2) }, v => { sunStrength = v; placeSun(); });
s2.slider('Bounces the light may take', { min: 0, max: 3, step: 1, value: 2, fmt: v => v === 0 ? 'none, direct light only' : v + (v === 1 ? ' bounce' : ' bounces') }, v => { U.uBounces.value = v; dirty(); });
s2.toggle('the campfire', true, v => { fireOn = v; placeSun(); });
s2.toggle('the lanterns', true, v => { lampsOn = v; placeSun(); });
s2.note('Look for the red bounce from the crates on the grass beside them, the green bounce under the trees, and at night the fire lighting the cabin wall from below.');

const s3 = sb.panel.section('03 · Materials', 'The rows on the plinth go from rough to polished, red plastic in front and gold metal behind. Roughness decides how sharp the reflection is; metal decides whether the reflection takes the surface\'s own colour and whether there is any diffuse colour under it at all. Reflections here are real rays, so the balls reflect the trees, the fire and each other.');
s3.slider('Your ball: roughness', { min: 0, max: 1, step: 0.02, value: 0.25, fmt: v => (+v).toFixed(2) }, v => { matA[YOUR * 4 + 3] = v; dirty(); });
s3.slider('Your ball: metal', { min: 0, max: 1, step: 0.02, value: 0, fmt: v => (+v).toFixed(2) }, v => { matB[YOUR * 4] = v; dirty(); });
s3.segment('Your ball: colour', [{ value: 0x2f6fd8, label: 'blue' }, { value: 0xd8402f, label: 'red' }, { value: 0xe8e2d6, label: 'white' }, { value: 0x1b1b1f, label: 'black' }], 0x2f6fd8, v => { const c = lin(+v); matA.set([c.r, c.g, c.b], YOUR * 4); dirty(); });
s3.toggle('show the rows on the plinth', true, v => { rowsOn = v; ballSpots.forEach((c, i) => { spheres[NSPH - 13 + i].c.y = v ? plinthY + 0.67 : -500; }); writeSpheres(); dirty(); });

const s4 = sb.panel.section('04 · Exposure and tone mapping', 'The sun disc is thousands of times brighter than the grass. No screen can show that, so the camera picks an exposure and a curve squashes the rest. The eye does the same at night, but only so far: a moonlit field is still dark.');
s4.segment('Curve', [{ value: 1, label: 'ACES (film)' }, { value: 2, label: 'Reinhard' }, { value: 0, label: 'none, just clip' }], 1, v => { dispU.uCurve.value = +v; });
const autoT = s4.toggle('auto exposure: adapt to the time of day', true, v => { autoExp = v; if (!v) expS.set(exposure, false); placeSun(); });
const expS = s4.slider('Exposure', { min: 0.05, max: 8, step: 0.05, value: 0.42, fmt: v => (+v).toFixed(2) }, v => { exposure = v; autoExp = false; autoT.set(false, false); dispU.uExposure.value = v; });
const expRead = s4.readout('exposure in use');

const s5 = sb.panel.section('05 · Air in the distance', 'Far things fade into the colour of the sky at the horizon, because there is a lot of lit air between you and them. That is aerial perspective, and it is the cheapest depth cue there is: a haze whose colour comes from the same sky.');
s5.toggle('haze in the distance', true, v => { fogOn = v; U.uFogD.value = v ? fogDensity : 0; dirty(); });
s5.slider('How thick', { min: 0, max: 0.02, step: 0.0005, value: 0.0025, fmt: v => (+v).toFixed(4) }, v => { fogDensity = v; if (fogOn) U.uFogD.value = v; dirty(); });

const s6 = sb.panel.section('06 · The renderer', 'Every pixel fires one ray a frame, and the frames blend while nothing moves. While you drag, it draws a small picture so it can keep up, then goes back to full size and settles. This is the same trade every path traced game makes, with a denoiser instead of your patience.');
s6.segment('Picture size while still', [{ value: 1, label: 'full' }, { value: 0.5, label: 'half' }], 1, v => { stillScale = +v; });
s6.segment('Picture size while moving', [{ value: 0.5, label: 'half' }, { value: 0.3, label: 'a third' }, { value: 0.2, label: 'a fifth' }], 0.3, v => { moveScale = +v; });
s6.segment('Rays per pixel each frame', [{ value: 1, label: '1' }, { value: 2, label: '2' }, { value: 4, label: '4' }], 1, v => { U.uSpp.value = +v; });
s6.toggle('blend frames while nothing moves', true, v => { accumulate = v; dirty(); });
const triRead = s6.readout('triangles in the scene'), instRead = s6.readout('placed copies'), boxRead = s6.readout('boxes in the trees'), buildRead = s6.readout('building the trees took'), accRead = s6.readout('frames blended'), msRead = s6.readout('milliseconds per frame');
triRead(totalTris.toLocaleString()); instRead(NI.toLocaleString() + ' (' + treeCount + ' trees, 70,000 blades of grass)'); boxRead(nodeTotal.toLocaleString()); buildRead((genMs + buildMs).toFixed(0) + ' ms');

const sunPos = new THREE.Vector3(); const sunLabel = sb.label('the sun', sunPos, 'amber');
sb.label('the lake: the sky, reflected', new THREE.Vector3(LAKE.x, 0, LAKE.z)).off.set(0, 0.6, 0);
sb.label('rough to polished · plastic in front, metal behind', new THREE.Vector3(13, plinthY, 6)).off.set(0, 1.4, 0);
sb.label('your ball', yourC, 'blue').off.set(0, 1.2, 0);
sb.label('the cabin', new THREE.Vector3(CABIN.x, terrainH(CABIN.x, CABIN.z), CABIN.z)).off.set(0, 5.2, 0);
sb.label('the fire', new THREE.Vector3(FIRE.x, terrainH(FIRE.x, FIRE.z), FIRE.z)).off.set(0, 1.4, 0);
{ const pe = document.querySelector('.sb-panel'); pe.addEventListener('input', dirty); pe.addEventListener('change', dirty); pe.addEventListener('click', dirty); }

// ---- the frame
let msAvg = 0, lastNow = 0, frame = 0; const invPV = new THREE.Matrix4();
placeSun();
sb.onFrame((dt) => {
  if (running) { runT += dt; if (runT > 2) { runT = 0; hour += 0.35; if (hour > 21) hour = 4.5; hourS.set(hour, false); placeSun(); } }
  const now = performance.now(); if (lastNow) msAvg += ((now - lastNow) - msAvg) * 0.08; lastNow = now; msRead(msAvg.toFixed(1) + ' ms');
  expRead(exposure.toFixed(2) + (autoExp ? ', automatic' : ', by hand')); accRead(!accumulate ? 'off, one frame at a time' : accN + (accN === 1 ? ' frame' : ' frames') + (rtScale < 1 ? ', small picture' : ''));
  sb.hud('mode', (hour < 5 || hour > 20 ? 'night: dark except where the fire and the lanterns reach, and a little moon' : hour < 8 || hour > 17.5 ? 'a low sun through a lot of air: orange light, long soft shadows' : 'high sun: white light, blue sky, hills fading into blue haze') + ' · every pixel is a path of rays');
});
sb.onRender((scene, camera, renderer) => {
  camera.updateMatrixWorld(); invPV.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse).invert();
  if (!lastCam.equals(camera.matrixWorld)) { lastCam.copy(camera.matrixWorld); lastMove = performance.now(); dirty(); }
  const moving = performance.now() - lastMove < 350; const scale = moving ? moveScale : stillScale; if (scale !== rtScale) { rtScale = scale; ensureRT(scale); dirty(); } else ensureRT(scale);
  U.uInvPV.value.copy(invPV); U.uCamPos.value.copy(camera.position); U.uFrame.value = frame++;
  const blending = accumulate; if (!blending) accN = 0; U.uBlend.value = blending ? 1 / (accN + 1) : 1; if (blending && accN < 100000) accN++;
  U.tPrev.value = rtPrev.texture; renderer.setRenderTarget(rt); renderer.render(traceScene, quadCam);
  renderer.setRenderTarget(null); dispU.tSrc.value = rt.texture; renderer.render(dispScene, quadCam);
  const sw = rt; rt = rtPrev; rtPrev = sw;
});
sb.start();
</script>
