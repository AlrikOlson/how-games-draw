<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transparency &amp; Sorting · Sandbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="_kit.css">
<script type="importmap">{ "imports": { "three": "../vendor/three.module.js" } }</script>
</head>
<body>
<script type="module">
import { boot, THREE, PAL } from './_kit.js';

const sb = boot({
  slug: 'transparency', title: 'Transparency & Sorting',
  blurb: 'The knight\'s camp at dusk with smoke, a glass window, a stained pane and a lamp inside a smoke bank, mixed by the real blend unit of your graphics card. Change the order the see-through things are drawn in, let them write depth by mistake, cut them out instead of mixing, or add them all up without sorting.',
  camera: { pos: [8.5, 4.6, 10.8], target: [1.2, 1.7, -0.6], near: 0.1, far: 300 }
});
const camp = sb.world.camp();
camp.knight.position.set(-2.0, 0, 2.6);
const scene = sb.scene, camera = sb.camera, renderer = sb.renderer;
// the kit clears with scene.background on every render call, which would wipe the multi-pass work below, so the
// sky colour becomes the plain clear colour instead
scene.background = null; renderer.setClearColor(PAL.sky, 1);
renderer.info.autoReset = false;

// ---------------------------------------------------------------- textures drawn on canvases (no files, no network)
function canvasTex(w, h, draw, opts) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; Object.assign(t, opts || {}); return t;
}
const whiteTex = canvasTex(2, 2, (g, w, h) => { g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); });
const puffTex = canvasTex(128, 128, (g, w, h) => {
  const r = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.35, 'rgba(255,255,255,0.75)'); r.addColorStop(0.7, 'rgba(255,255,255,0.22)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, w, h);
});
const haloTex = canvasTex(128, 128, (g, w, h) => {
  const r = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  r.addColorStop(0, 'rgba(255,225,160,1)'); r.addColorStop(0.25, 'rgba(255,200,110,0.8)'); r.addColorStop(0.6, 'rgba(255,170,70,0.3)'); r.addColorStop(1, 'rgba(255,160,60,0)');
  g.fillStyle = r; g.fillRect(0, 0, w, h);
});
const flameTex = canvasTex(64, 128, (g, w, h) => {
  const blob = (x, y, rad, inner, mid) => { const r = g.createRadialGradient(x, y, 0, x, y, rad); r.addColorStop(0, inner); r.addColorStop(0.5, mid); r.addColorStop(1, 'rgba(242,120,40,0)'); g.fillStyle = r; g.fillRect(0, 0, w, h); };
  blob(32, 92, 34, 'rgba(255,240,170,1)', 'rgba(250,170,60,0.85)'); blob(32, 52, 20, 'rgba(255,210,110,0.95)', 'rgba(245,140,50,0.5)'); blob(30, 22, 10, 'rgba(255,190,90,0.8)', 'rgba(240,120,40,0.3)');
});
const leafTex = canvasTex(128, 128, (g, w, h) => {
  let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  for (let i = 0; i < 46; i++) {
    const x = 10 + rnd() * (w - 20), y = 10 + rnd() * (h - 20), rad = 7 + rnd() * 9, dark = rnd() < 0.5;
    const r = g.createRadialGradient(x, y, 0, x, y, rad); const c = dark ? '63,143,74' : '90,181,98';
    r.addColorStop(0, `rgba(${c},1)`); r.addColorStop(0.72, `rgba(${c},1)`); r.addColorStop(1, `rgba(${c},0)`);
    g.fillStyle = r; g.beginPath(); g.ellipse(x, y, rad, rad * 0.62, rnd() * Math.PI, 0, Math.PI * 2); g.fill();
  }
});
const stainedTex = canvasTex(128, 128, (g, w, h) => {
  const cols = ['#d14a3a', '#3a78d1', '#e0b03a', '#3aa85a', '#8a4ad1', '#d1783a', '#3ab8c8', '#c83a8a'];
  for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) { g.globalAlpha = 0.72; g.fillStyle = cols[(x * 3 + y * 5) % cols.length]; g.fillRect(x * 32, y * 32, 32, 32); }
  g.globalAlpha = 1; g.strokeStyle = '#141416'; g.lineWidth = 5; g.beginPath();
  for (let i = 0; i <= 4; i++) { g.moveTo(i * 32, 0); g.lineTo(i * 32, h); g.moveTo(0, i * 32); g.lineTo(w, i * 32); } g.stroke();
});
// an 8 by 8 coin with black written outside it, as most exporters do: the chapter's dark fringe demo, magnified by the GPU's own filtering
const coinTex = canvasTex(8, 8, (g) => {
  g.clearRect(0, 0, 8, 8); const img = g.createImageData(8, 8);
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) { const i = (y * 8 + x) * 4, dx = x - 3.5, dy = y - 3.5, inside = dx * dx + dy * dy <= 3.4 * 3.4; img.data[i] = inside ? 242 : 0; img.data[i + 1] = inside ? 163 : 0; img.data[i + 2] = inside ? 65 : 0; img.data[i + 3] = inside ? 255 : 0; }
  g.putImageData(img, 0, 0);
}, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, generateMipmaps: false });

// ---------------------------------------------------------------- the see-through shader: one program, three passes
const shared = { uFrame: { value: 0 }, uWeight: { value: 9 }, uSun: { value: new THREE.Vector3() }, uPremul: { value: 0 }, uCutoff: { value: 0.5 } };
const VS = `varying vec3 vN; varying vec2 vUv; varying float vZ; varying vec3 vP;
void main(){ vUv = uv; vN = normalize(normalMatrix * normal); vec4 mv = modelViewMatrix * vec4(position, 1.0); vZ = -mv.z; vP = mv.xyz; gl_Position = projectionMatrix * mv; }`;
const FS = `uniform vec3 uColor; uniform float uOpacity; uniform sampler2D uMap; uniform float uMapPremul; uniform float uFlat; uniform float uCut;
uniform float uPremul; uniform float uCutoff; uniform float uFrame; uniform float uWeight; uniform vec3 uSun; uniform float uSoft;
varying vec3 vN; varying vec2 vUv; varying float vZ; varying vec3 vP;
void main(){
  vec4 t = texture2D(uMap, vUv);
  vec3 n = normalize(vN) * (gl_FrontFacing ? 1.0 : -1.0);
  float a = uOpacity * t.a * mix(1.0, pow(abs(dot(n, normalize(-vP))), 1.4), uSoft);
  float shade = mix(0.42 + 0.58 * max(dot(n, uSun), 0.0), 1.0, uFlat);
  vec3 col = uColor * t.rgb * shade;
  if (uCut > 0.5) {
    float th = uCutoff;
    if (uCut > 1.5) {
      // a 4 by 4 Bayer pattern of thresholds tiled over the screen, rotated by the frame number when frames are averaged
      float px = mod(gl_FragCoord.x, 4.0), py = mod(gl_FragCoord.y, 4.0);
      float x0 = mod(px, 2.0), y0 = mod(py, 2.0), x1 = floor(px / 2.0), y1 = floor(py / 2.0);
      float b = 4.0 * (2.0 * x0 + 3.0 * y0 - 4.0 * x0 * y0) + (2.0 * x1 + 3.0 * y1 - 4.0 * x1 * y1);
      th = fract((b + 0.5) / 16.0 + uFrame / 8.0);
    }
    if (a < th) discard;
    a = 1.0;
  }
  vec3 pm = mix(col * a, col, uMapPremul);
#if PASS == 1
  float w = a * (uWeight < 0.5 ? 1.0 : uWeight < 8.0 ? clamp(10.0 / (1e-5 + pow(vZ / 5.0, 2.0) + pow(vZ / 200.0, 6.0)), 1e-2, 3e3) : clamp(0.03 / (1e-5 + pow(vZ / 200.0, 4.0)), 1e-2, 3e3));
  gl_FragColor = vec4(pm, a) * w;
#elif PASS == 2
  gl_FragColor = vec4(a);
#else
  gl_FragColor = vec4(col, a);
  #include <colorspace_fragment>
  // premultiply after the output encoding, so straight and premultiplied hand the blend unit the same numbers
  if (uPremul > 0.5 && uMapPremul < 0.5) gl_FragColor.rgb *= a;
#endif
}`;
const trans = []; // every see-through mesh
function seeThrough(geom, o) {
  const uniforms = { uColor: { value: new THREE.Color(o.color) }, uOpacity: { value: o.opacity }, uMap: { value: o.map || whiteTex }, uMapPremul: { value: o.mapPremul ? 1 : 0 }, uFlat: { value: o.flat ? 1 : 0 }, uSoft: { value: o.soft ? 1 : 0 }, uCut: { value: 0 }, ...shared };
  const side = o.side || THREE.FrontSide;
  const see = new THREE.ShaderMaterial({ uniforms, vertexShader: VS, fragmentShader: FS, defines: { PASS: 0 }, transparent: true, side, depthWrite: false, blending: THREE.CustomBlending, blendSrc: THREE.SrcAlphaFactor, blendDst: THREE.OneMinusSrcAlphaFactor, blendSrcAlpha: THREE.OneFactor, blendDstAlpha: THREE.OneMinusSrcAlphaFactor });
  const accum = new THREE.ShaderMaterial({ uniforms, vertexShader: VS, fragmentShader: FS, defines: { PASS: 1 }, transparent: true, side, depthWrite: false, blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor, blendSrcAlpha: THREE.OneFactor, blendDstAlpha: THREE.OneFactor });
  const reveal = new THREE.ShaderMaterial({ uniforms, vertexShader: VS, fragmentShader: FS, defines: { PASS: 2 }, transparent: true, side, depthWrite: false, blending: THREE.CustomBlending, blendSrc: THREE.ZeroFactor, blendDst: THREE.OneMinusSrcColorFactor, blendSrcAlpha: THREE.ZeroFactor, blendDstAlpha: THREE.OneMinusSrcAlphaFactor });
  const m = new THREE.Mesh(geom, see); m.userData = { see, accum, reveal, kind: o.kind, u: uniforms, d: 0 }; m.layers.set(1); m.castShadow = false; m.receiveShadow = false;
  if (o.parent) o.parent.add(m); else scene.add(m); trans.push(m); return m;
}
const wood = (w, h, d, x, y, z, parent) => { const m = sb.mesh(new THREE.BoxGeometry(w, h, d), sb.mat(PAL.wood), x, y, z); (parent || scene).add(m); return m; };
const faceCam = 0.55; // the yaw that points a pane at the default camera

// ---- the glass window in the yard, between the camera and the lamp
const winG = new THREE.Group(); winG.position.set(2.4, 0, 2.2); winG.rotation.y = faceCam; scene.add(winG);
wood(0.12, 3.1, 0.12, -0.86, 1.55, 0, winG); wood(0.12, 3.1, 0.12, 0.86, 1.55, 0, winG); wood(1.84, 0.12, 0.12, 0, 3.06, 0, winG); wood(1.84, 0.12, 0.12, 0, 1.34, 0, winG);
const glass = seeThrough(new THREE.PlaneGeometry(1.6, 1.6), { color: 0x9ecfff, opacity: 0.5, side: THREE.DoubleSide, kind: 'glass', parent: winG }); glass.position.y = 2.2;
sb.label('glass window', glass, 'blue').off.set(0, 1.0, 0);

// ---- the stained pane on the left, in front of the smoke bank
const stG = new THREE.Group(); stG.position.set(-2.4, 0, -0.6); stG.rotation.y = faceCam; scene.add(stG);
wood(0.12, 2.7, 0.12, -0.86, 1.35, 0, stG); wood(0.12, 2.7, 0.12, 0.86, 1.35, 0, stG); wood(1.84, 0.12, 0.12, 0, 2.66, 0, stG); wood(1.84, 0.12, 0.12, 0, 0.94, 0, stG);
const stained = seeThrough(new THREE.PlaneGeometry(1.6, 1.6), { color: 0xffffff, opacity: 0.5, map: stainedTex, side: THREE.DoubleSide, kind: 'glass', parent: stG }); stained.position.y = 1.8;

// ---- the lamp inside a long smoke bank: the sort-by-one-number failure the chapter names
const lamp = sb.world.lamp(-0.8, -3.2, 1.5, 14);
const halo = seeThrough(new THREE.PlaneGeometry(3.0, 3.0), { color: 0xffffff, opacity: 0.6, map: haloTex, flat: true, kind: 'glow' }); halo.position.set(-0.8, 1.5, -3.2);
const bank = seeThrough(new THREE.SphereGeometry(1, 20, 14), { color: 0xb4bac6, opacity: 0.5, soft: true, kind: 'smoke' }); bank.position.set(-2.0, 1.6, -3.8); bank.scale.set(2.4, 0.9, 1.0);
sb.label('lamp inside a smoke bank', lamp, 'amber').off.set(0, 2.7, 0);

// ---- the campfire: the kit's cone, or two crossed flame cards
const cone = camp.fire.getObjectByName('flame');
const cards = [0, 1].map(i => { const c = seeThrough(new THREE.PlaneGeometry(0.9, 1.4), { color: 0xffffff, opacity: 0.95, map: flameTex, flat: true, side: THREE.DoubleSide, kind: 'flame' }); c.position.set(1.2, 0.72, 2.2); c.rotation.y = Math.PI / 4 + i * Math.PI / 2; return c; });

// ---- smoke puffs rising from the fire and drifting across the yard
const NP = 16, puffs = [];
for (let i = 0; i < NP; i++) { const p = seeThrough(new THREE.PlaneGeometry(1, 1), { color: 0xc4c8d0, opacity: 0.5, map: puffTex, flat: true, kind: 'puff' }); p.userData.phase = i / NP; p.userData.wob = i * 1.7; p.userData.side = Math.sin(i * 2.3) * 0.5; puffs.push(p); }

// ---- a second lamp with a glass globe: one mesh with an inside and an outside face
const gLamp = sb.world.lamp(6.0, 3.0, 2.4, 10);
const globe = seeThrough(new THREE.SphereGeometry(0.55, 24, 16), { color: 0xbfe0ff, opacity: 0.45, side: THREE.DoubleSide, kind: 'globe' }); globe.position.set(6.0, 2.4, 3.0);
const globeDepth = new THREE.Mesh(globe.geometry, new THREE.MeshBasicMaterial({ colorWrite: false, transparent: true, depthWrite: true })); globeDepth.position.copy(globe.position); globeDepth.layers.set(1); scene.add(globeDepth);
scene.remove(globe); scene.add(globe); // the depth-only copy sits before the globe in the list, so list order still draws it first
sb.label('glass globe', globe).off.set(0, 0.9, 0);

// ---- two bushes of leaf cards for the cutout section
const leaves = [];
function bush(x, z, s) { const g = new THREE.Group(); g.position.set(x, 0, z); scene.add(g); for (let i = 0; i < 3; i++) { const l = seeThrough(new THREE.PlaneGeometry(1.9 * s, 1.5 * s), { color: 0xffffff, opacity: 0.65, map: leafTex, side: THREE.DoubleSide, kind: 'leaf', parent: g }); l.position.y = 0.72 * s; l.rotation.y = i * Math.PI / 3; leaves.push(l); } return g; }
const bushA = bush(-6.2, 0.8, 1.0), bushB = bush(7.6, 0.0, 1.15);
sb.label('leaf cards', bushB).off.set(0, 1.9, 0);

// ---- the coin sign: a straight texture with black outside the coin, blended over a wooden board
const signG = new THREE.Group(); signG.position.set(-2.2, 0, 4.8); signG.rotation.y = faceCam; scene.add(signG);
wood(0.1, 2.1, 0.1, 0, 1.05, -0.06, signG); wood(1.4, 1.4, 0.08, 0, 1.7, -0.02, signG);
const coin = seeThrough(new THREE.PlaneGeometry(1.15, 1.15), { color: 0xffffff, opacity: 1, map: coinTex, flat: true, mapPremul: true, kind: 'coin', parent: signG }); coin.position.set(0, 1.7, 0.03);
sb.label('coin sign: look at its edge', coin).off.set(0, 0.75, 0);

// ---------------------------------------------------------------- state
let alphaGlow = 0.6, alphaGlass = 0.5, alphaSmoke = 0.5, premul = false, layersView = false;
let order = 'far', fireCards = true, bankOn = true;
let leafMode = 'cutout', leafFade = 0.65, cutoff = 0.5;
let combine = 'sorted', weight = 9;
let passOrder = 'solid', depthWrite = false, depthTest = true, globeMode = 'both';

const orderNames = { far: 'sorted, farthest first', list: 'list order, no sort', near: 'nearest first' };
const weightNames = { 9: 'by distance (eq. 9)', 7: 'steeper (eq. 7)', 0: 'no weight' };
function applyMats() {
  const solidLeaves = leafMode !== 'blend';
  for (const o of trans) {
    const s = o.userData, m = s.see, leaf = s.kind === 'leaf', solid = leaf && solidLeaves;
    s.u.uCut.value = leaf ? (leafMode === 'cutout' ? 1 : leafMode === 'blend' ? 0 : 2) : 0;
    if (leaf && m.transparent === solid) { m.transparent = !solid; m.needsUpdate = true; }
    o.layers.set(solid ? 0 : 1);
    m.blending = solid ? THREE.NoBlending : THREE.CustomBlending;
    m.blendSrc = premul ? THREE.OneFactor : THREE.SrcAlphaFactor;
    m.depthWrite = solid ? true : s.kind === 'globe' ? false : depthWrite;
    m.depthTest = solid ? true : depthTest;
    m.depthFunc = s.kind === 'globe' && globeMode === 'prepass' ? THREE.EqualDepth : THREE.LessEqualDepth;
    s.accum.depthTest = s.reveal.depthTest = depthTest;
    if (s.kind === 'glow') s.u.uOpacity.value = alphaGlow;
    else if (s.kind === 'glass') s.u.uOpacity.value = alphaGlass;
    else if (s.kind === 'smoke') s.u.uOpacity.value = alphaSmoke;
    else if (leaf) s.u.uOpacity.value = leafFade;
  }
  shared.uPremul.value = premul ? 1 : 0; shared.uCutoff.value = cutoff; shared.uWeight.value = weight;
  globeDepth.visible = globeMode === 'prepass' && combine !== 'wboit';
  cone.visible = !fireCards; for (const c of cards) c.visible = fireCards;
  bank.visible = bankOn;
  renderer.sortObjects = order !== 'list';
  sb.hud('mode', layersView ? 'layers view: brighter = more see-through layers landed on that pixel'
    : combine === 'wboit' ? 'weighted sum (WBOIT), no sorting · weight ' + weightNames[weight]
    : 'over: ' + orderNames[order] + ' · ' + (premul ? 'premultiplied' : 'straight') + ' · depth write ' + (depthWrite ? 'ON' : 'off') + (depthTest ? '' : ', depth test off') + (passOrder === 'trans' ? ' · see-through drawn first' : ''));
}

// ---------------------------------------------------------------- panel
const s1 = sb.panel.section('01 · Mixing in draw order', 'Glass, smoke and glow each mix into the pixel, and the pixel forgets what was there. Slide how solid each one is. The coin sign shows the dark rim a straight texture gets at its edge, and how premultiplied storage removes it without changing any order.');
s1.slider('Glow, how solid (alpha)', { min: 0, max: 1, step: 0.05, value: 0.6 }, v => { alphaGlow = v; applyMats(); });
s1.slider('Glass, how solid (alpha)', { min: 0, max: 1, step: 0.05, value: 0.5 }, v => { alphaGlass = v; applyMats(); });
s1.slider('Smoke, how solid (alpha)', { min: 0, max: 1, step: 0.05, value: 0.5 }, v => { alphaSmoke = v; applyMats(); });
s1.segment('Colour storage', [{ value: 'straight', label: 'straight' }, { value: 'premul', label: 'premultiplied' }], 'straight', v => { premul = v === 'premul'; applyMats(); });
s1.toggle('count the see-through layers on each pixel (view)', false, v => { layersView = v; applyMats(); });
const callRead = s1.readout('draw calls'), transRead = s1.readout('see-through draws'), msRead = s1.readout('frame time');

const s2 = sb.panel.section('02 · Sorting by one number', 'Each see-through object gets one distance, its centre to the camera, and the engine draws the farthest first. Orbit round the lamp and watch the glow pop over and under the smoke bank. The crossed flame cards share one centre, so one card is always drawn whole on top of the other.');
const orderSeg = s2.segment('Draw order', [{ value: 'far', label: 'farthest first (sorted)' }, { value: 'list', label: 'list order (no sort)' }, { value: 'near', label: 'nearest first' }], 'far', v => { order = v; applyMats(); });
s2.toggle('flames as two crossed cards', true, v => { fireCards = v; applyMats(); });
s2.toggle('lamp inside a long smoke bank', true, v => { bankOn = v; applyMats(); });
const orderRead = s2.readout('drawn this frame, first to last');

const s3 = sb.panel.section('03 · Skip the mixing: cutouts and dither', 'The two bushes are leaf cards. If every pixel is all or nothing, the leaves can write depth and never need sorting. The four ways differ in how they hide the hard edge and whether the bush can still fade.');
const leafSeg = s3.segment('Leaves', [{ value: 'blend', label: 'mix (blend)' }, { value: 'cutout', label: 'cutout (alphaTest)' }, { value: 'dither', label: 'dither' }, { value: 'taa', label: 'dither, 8 frames averaged' }], 'cutout', v => { leafMode = v; taaFirst = true; applyMats(); });
s3.slider('Bushes, how solid (fade)', { min: 0, max: 1, step: 0.05, value: 0.65 }, v => { leafFade = v; applyMats(); });
s3.slider('Cutout threshold (alphaTest)', { min: 0.05, max: 0.95, step: 0.05, value: 0.5 }, v => { cutoff = v; if (leafMode !== 'cutout') { leafMode = 'cutout'; leafSeg.set('cutout', false); } applyMats(); });
s3.note('Drag the fade below the threshold and the cutout bush vanishes whole; dither fades it as a pattern; averaging 8 frames of rotated patterns settles into a smooth fade, and smears while you orbit because nothing here re-projects the last frame.');
const histRead = s3.readout('memory for the averaged frames');

const s4 = sb.panel.section('04 · Right without sorting', 'Instead of sorting, add every see-through colour into one sum with a weight, and in a second target multiply up how much light gets through. One full-screen pass at the end divides the sum. Never wrong in order, often wrong in amount.');
const combSeg = s4.segment('Combine see-through things', [{ value: 'sorted', label: 'sorted by object' }, { value: 'wboit', label: 'weighted sum, never sorted (WBOIT)' }], 'sorted', v => { combine = v; applyMats(); });
s4.segment('Weight in the sum', [{ value: 9, label: 'by distance (eq. 9)' }, { value: 7, label: 'steeper (eq. 7)' }, { value: 0, label: 'no weight' }], 9, v => { weight = +v; if (combine !== 'wboit') { combine = 'wboit'; combSeg.set('wboit', false); } applyMats(); });
s4.note('Watch the smoke bank and the glass: with no weight a solid pane behind thin smoke gets averaged with it, and the glow no longer hides what is behind it. Pass order and depth write do not apply while summing.');
const oitRead = s4.readout('extra memory for the two sum targets');

const s5 = sb.panel.section('05 · When glass claims the pixel', 'Solid things write their distance into the depth buffer; see-through things should only read it. Leave the write on and the first glass at a pixel hides everything drawn after it, solid or not.');
s5.segment('Pass order', [{ value: 'solid', label: 'solid first, then see-through' }, { value: 'trans', label: 'see-through first' }], 'solid', v => { passOrder = v; backToSorted(); });
s5.toggle('see-through things write their distance (depthWrite)', false, v => { depthWrite = v; backToSorted(); });
s5.toggle('see-through things check the distance (depthTest)', true, v => { depthTest = v; applyMats(); });
s5.segment('Glass globe', [{ value: 'both', label: 'one draw, both faces mix' }, { value: 'prepass', label: 'record nearest, then mix only there' }], 'both', v => { globeMode = v; backToSorted(); });
s5.note('Depth write on with see-through drawn first: the smoke and glass claim their pixels and the camp behind them is never drawn. Depth write on with solid first: smoke puffs hide the puffs behind them and the fire loses its glow.');
const triRead = s5.readout('triangles');
function backToSorted() { if (combine === 'wboit') { combine = 'sorted'; combSeg.set('sorted', false); } applyMats(); }
applyMats();

// ---------------------------------------------------------------- render targets and full-screen passes
let rtMain = null, rtAccum = null, rtReveal = null, rtFrame = null, hist = null, histIdx = 0, taaFirst = true;
const size = new THREE.Vector2();
function ensureTargets() {
  renderer.getDrawingBufferSize(size); const w = Math.max(1, size.x | 0), h = Math.max(1, size.y | 0);
  if (rtMain && rtMain.width === w && rtMain.height === h) return;
  for (const r of [rtMain, rtAccum, rtReveal, rtFrame, hist && hist[0], hist && hist[1]]) if (r) r.dispose();
  const depthTex = new THREE.DepthTexture(w, h, THREE.UnsignedIntType);
  rtMain = new THREE.WebGLRenderTarget(w, h, { type: THREE.HalfFloatType, depthBuffer: true, depthTexture: depthTex });
  rtAccum = new THREE.WebGLRenderTarget(w, h, { type: THREE.FloatType, depthBuffer: true, depthTexture: depthTex });
  rtReveal = new THREE.WebGLRenderTarget(w, h, { type: THREE.HalfFloatType, format: THREE.RedFormat, depthBuffer: true, depthTexture: depthTex });

const QVS = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

}`, { uMain: { value: null }, uAccum: { value: null }, uReveal: { value: null } });

void main(){ gl_FragColor = mix(texture2D(uHist, vUv), texture2D(uNew, vUv), uMix); }`, { uHist: { value: null }, uNew: { value: null }, uMix: { value: 1 } });

  #include <colorspace_fragment>
}`, { uTex: { value: null } });

const countMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.14, blending: THREE.AdditiveBlending, depthWrite: false });

// the kit calls renderer.render(scene, camera) once per frame; this wraps it so a frame can be several real passes
const origRender = renderer.render;
renderer.render = function (scn, cam) { if (scn !== scene) return origRender.call(renderer, scn, cam); drawFrame(); };
let transDraws = 0;
function drawFrame() {

    ensureTargets();
    picture(rtFrame);
    const prev = hist[histIdx], next = hist[1 - histIdx]; histIdx = 1 - histIdx;
    mixQ.u.uHist.value = prev.texture; mixQ.u.uNew.value = rtFrame.texture; mixQ.u.uMix.value = taaFirst ? 1 : 0.125; taaFirst = false;

function picture(target) {

// ---------------------------------------------------------------- per frame: puffs, sort keys, readouts
const camPos = new THREE.Vector3(), tmp = new THREE.Vector3(), sunDir = new THREE.Vector3().copy(sb.lights.sun.position).normalize();
const fireBase = new THREE.Vector3(1.2, 0.5, 2.2), drift = new THREE.Vector3(5.0, 2.4, 0.8);
const named = [glass, halo, bank], nameOf = ['glass', 'glow', 'smoke bank'], idx = [0, 1, 2];
const cmpFar = (a, b) => named[b].userData.d - named[a].userData.d, cmpNear = (a, b) => named[a].userData.d - named[b].userData.d;
let lastOrderCode = -1, ms = 16, frames = 0;
sb.onFrame((dt, t) => {
  shared.uSun.value.copy(sunDir).transformDirection(camera.matrixWorldInverse);
  camera.getWorldPosition(camPos);

    const u = p.userData, ph = (t / 7 + u.phase) % 1;
    const rise = Math.sqrt(ph);
    p.position.set(fireBase.x + drift.x * ph + Math.sin(t * 0.8 + u.wob) * 0.35 * ph + u.side * ph, fireBase.y + drift.y * rise + Math.sin(t * 0.5 + u.wob) * 0.2 * ph, fireBase.z + drift.z * ph + Math.cos(t * 0.6 + u.wob) * 0.45 * ph - u.side * ph);

  for (const o of trans) { o.getWorldPosition(tmp); const d = tmp.distanceTo(camPos); o.userData.d = d; o.renderOrder = order === 'near' ? d : -d; }
  globeDepth.renderOrder = globe.renderOrder - 0.001;
  // which of the three named objects was drawn first, second and third
  idx[0] = 0; idx[1] = 1; idx[2] = 2;
  if (order !== 'list') idx.sort(order === 'near' ? cmpNear : cmpFar);
  const code = combine === 'wboit' ? 99 : idx[0] * 9 + idx[1] * 3 + idx[2];
  if (code !== lastOrderCode) { lastOrderCode = code; orderRead(code === 99 ? 'no order: summed' : nameOf[idx[0]] + ' → ' + nameOf[idx[1]] + ' → ' + nameOf[idx[2]]); }

  if (++frames % 10 === 0) { const r = renderer.info.render; callRead(r.calls); triRead(r.triangles.toLocaleString()); transRead(transDraws); msRead(ms.toFixed(1) + ' ms'); }
});
sb.start();
