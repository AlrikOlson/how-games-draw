const msRead = s4.readout('milliseconds per frame'), callRead = s4.readout('draw calls');

const s5 = sb.panel.section('05 · Cubes and cones', 'The room is chopped into a grid of cubes that store colour and how solid they are, plus half-size and quarter-size copies. The knight reads that grid with five fat cones instead of hundreds of rays.');
s5.toggle('show the grid as cubes', false, v => { showVoxels = v; if (vox.mesh) vox.mesh.visible = v; });
s5.segment('Grid', [{ value: 16, label: '16 by 16' }, { value: 32, label: '32 by 32' }, { value: 64, label: '64 by 64' }], 32, v => { gridN = +v; buildVoxels(); });
s5.segment('Cubes shown at', [{ value: 0, label: 'full size' }, { value: 1, label: 'half (mip 1)' }, { value: 2, label: 'quarter (mip 2)' }], 0, v => { voxLevel = +v; buildVoxelCubes(); });
s5.slider('How wide each cone opens', { min: 10, max: 70, step: 2, value: coneDeg, unit: '°' }, v => { coneDeg = v; G.uConeTan.value = Math.tan(v * Math.PI / 360); });
s5.toggle('light the knight with cones instead of probes', false, v => { coneOnKnight = v; for (const m of knightMats) m.uKind.value = v ? 3 : 2; apply(); });
s5.note('Wider cones read the coarser copies sooner: smoother, cheaper, and blurrier. The grid is rebuilt from the lightmap after every bake, so it lags the sun the same way.');
const voxRead = s5.readout('cubes holding a surface');

// ---- state and glue
let knightBlendDirty = true;
function sunMoved() { placeSun(); if (rebakeOnMove) startBake(); else refreshLightNumbers(); }
function apply() {
  G.uDirectMul.value = light === 'bounce' ? 0 : 1; G.uIndirectMul.value = light === 'direct' ? 0 : 1;
  const kn = ssOn ? 'the frame' : coneOnKnight ? 'cones through the cubes' : 'probes';
  sb.hud('mode', light === 'direct' ? 'direct light only: sun, sky and fire, nothing bounced' : (light === 'bounce' ? 'bounce light only' : 'direct and bounce') + ' · walls from ' + (ssOn ? 'the frame' : 'the baked lightmap') + ' · knight from ' + kn);
}
apply();

// dragging the sun: grab the amber ball, the orbit camera stays still while it is held
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(); let dragging = false;
function pointerNdc(e) { const r = renderer.domElement.getBoundingClientRect(); ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); }
renderer.domElement.addEventListener('pointerdown', e => {
  pointerNdc(e); ray.setFromCamera(ndc, camera);
  if (ray.intersectObject(sunHandle, false).length) { dragging = true; sb.controls.enabled = false; e.stopImmediatePropagation(); renderer.domElement.setPointerCapture(e.pointerId); }
}, true);
renderer.domElement.addEventListener('pointermove', e => {
  if (!dragging) return; pointerNdc(e); ray.setFromCamera(ndc, camera);
  const o = ray.ray.origin, d = ray.ray.direction, b = o.dot(d), c = o.lengthSq() - 60 * 60, disc = b * b - c; if (disc < 0) return;
  const p = o.clone().addScaledVector(d, -b + Math.sqrt(disc)).normalize();
  sunEl = Math.max(6, Math.min(80, Math.asin(p.y) * 180 / Math.PI)); sunAz = ((Math.atan2(p.x, p.z) * 180 / Math.PI) + 360) % 360;
  elS.set(Math.round(sunEl), false); azS.set(Math.round(sunAz), false); sunMoved();
});
const endDrag = () => { if (dragging) { dragging = false; sb.controls.enabled = true; } };
renderer.domElement.addEventListener('pointerup', endDrag); renderer.domElement.addEventListener('pointercancel', endDrag);

refreshLightNumbers(); allocLightmaps(); startBake();
let msAvg = 16, frameN = 0;
sb.onFrame(dt => {
  frameN++; msAvg += ((dt * 1000) - msAvg) * 0.1;
  G.uSkyCol.value.copy(skyCol); G.uGroundCol.value.copy(groundCol);
  if (bake.active) { bakeStep(bake.done ? 6 : 24); bakeRead(bake.pass === 0 ? 'direct light, pass 0' : 'bounce pass ' + bake.pass + ' of ' + bouncePasses + ', ' + Math.round(100 * bake.cursor / bake.total) + '%'); }
  else if (frameN % 10 === 0) bakeRead(bake.done ? bake.ms.toFixed(0) + ' ms, ' + bouncePasses + ' bounce' + (bouncePasses > 1 ? 's' : '') : 'not yet');
  if (frameN % 10 === 0) { texRead(bake.total.toLocaleString()); rayRead(bake.rays.toLocaleString()); msRead(msAvg.toFixed(1)); callRead(lastCalls); }
  if (probes.sh && (knightBlendDirty || ddgi)) { blendProbes(knight.position.x, 0.95, knight.position.z, knightSHv, ddgi); knightBlendDirty = false; usedRead(probesUsed + ' of 8'); }
});
sb.start();
</script>
</body>
