  vec3 calcN(vec3 p) { float e = max(0.015, uCell * 0.2); vec2 k = vec2(1.0, -1.0); return normalize(k.xyy * map(p + k.xyy * e) + k.yyx * map(p + k.yyx * e) + k.yxy * map(p + k.yxy * e) + k.xxx * map(p + k.xxx * e)); }
  // the chapter's shadow rule: keep the smallest k * d / t seen on the way to the light
  float shadow(vec3 ro, vec3 rd, float maxt) {
    if (uShadow == 0) return 1.0;
    float res = 1.0, t = 0.06;
    for (int i = 0; i < 80; i++) { if (t >= maxt) break; float h = map(ro + rd * t); if (h < 0.002) return 0.0; if (uShadow == 2) res = min(res, uSoftK * h / t); t += clamp(h, 0.03, 0.6); }

  }
  float ao(vec3 p, vec3 n) { float occ = 0.0, sca = 1.0; for (int i = 1; i <= 5; i++) { float h = 0.04 + 0.11 * float(i); float d = map(p + n * h); occ += (h - d) * sca; sca *= 0.8; } return clamp(1.0 - 2.2 * occ, 0.0, 1.0); }

    vec3 rd = normalize((uCamWorld * vec4(rdV, 0.0)).xyz); vec3 ro = uCamPos;

const ortho = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const marchScene = new THREE.Scene(); marchScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), marchMat));

const PN = 32; const rtP = new THREE.WebGLRenderTarget(PN, PN, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true }); const probeBuf = new Uint8Array(PN * PN * 4);

  uniform sampler2D tCol; uniform sampler2D tDepth; varying vec2 vUv;
  void main(){ vec3 c = max(texture2D(tCol, vUv).rgb, 0.0); c = mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c)); gl_FragColor = vec4(clamp(c, 0.0, 1.0), 1.0); gl_FragDepth = texture2D(tDepth, vUv).r; }` });
const compScene = new THREE.Scene(); compScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), compMat));

// ---- panel
let view = 'march', scale = 0.5, showSlice = true, sliceNearest = false, showBall = true, showBricks = false, boltDeg = 200, kmode = 'circle', speed = 1.6, collide = true, showPush = true;
const s1 = sb.panel.section('01 · The field', 'A grid over the yard. Every cell stores one number: how far to the nearest wall or prop, with a minus sign inside one. The slice paints those numbers wherever it cuts the grid.');
s1.toggle('show the slice', true, v => { showSlice = v; sliceLabel.hide(!v); });
s1.segment('Slice', [{ value: 'flat', label: 'flat' }, { value: 'across', label: 'upright, across' }, { value: 'along', label: 'upright, along' }], 'flat', v => { sliceAxis = v; placeSlice(); posS.set(posS.get(), false); });
const posS = s1.slider('Where the slice cuts', { min: 0, max: 1, step: 0.01, value: 0.03, fmt: v => sliceAxis === 'flat' ? (0.03 + v * 4.9).toFixed(2) + ' m up' : (-9.9 + v * 19.8).toFixed(1) + ' m from the middle' }, v => { slicePos = v; placeSlice(); });
s1.segment('Read the numbers', [{ value: 'blend', label: 'blended between cells (trilinear)' }, { value: 'cell', label: 'one cell at a time' }], 'blend', v => { sliceNearest = v === 'cell'; sliceU.uNearest.value = sliceNearest ? 1 : 0; });
s1.toggle('draw a line at every step of distance (contours)', true, v => { sliceU.uBands.value = v ? 1 : 0; });
s1.slider('Line spacing', { min: 0.25, max: 2, step: 0.25, value: 0.5, unit: ' m' }, v => { sliceU.uSpacing.value = v; });
s1.toggle('safe ball at the knight: nothing solid inside it', true, v => { showBall = v; });
const underRead = s1.readout('number stored under the knight');
s1.key([['#4aa3ff', 'outside, brighter nearer a surface'], ['#f2a341', 'inside a wall or prop'], ['#ffffff', 'the surface, where the number is zero']]);

const s2 = sb.panel.section('02 · Storage', 'The same yard kept three ways: every cell, only bricks that a surface runs through, or those bricks plus a coarse grid so open floor still gets a good answer.');
s2.segment('Cells across the yard', [{ value: 32, label: '32' }, { value: 64, label: '64' }, { value: 96, label: '96' }], 64, v => { buildDense(+v); buildStorage(); });
s2.segment('What is kept', [{ value: 'dense', label: 'every cell' }, { value: 'bricks', label: 'bricks near a surface' }, { value: 'coarse', label: 'bricks plus a coarse grid' }], 'dense', v => { storage = v; buildStorage(); });
s2.segment('Cells per brick side', [{ value: 4, label: '4' }, { value: 8, label: '8' }], 4, v => { brick = +v; buildStorage(); });
s2.slider('Keep bricks within this distance of a surface', { min: 0.25, max: 2, step: 0.25, value: 0.5, unit: ' m' }, v => { band = v; buildStorage(); });
s2.toggle('show the kept bricks', false, v => { showBricks = v; if (bricksMesh) bricksMesh.visible = v; });
const cellRead = s2.readout('cell size'), denseRead = s2.readout('every cell, 2 bytes each'), keptRead = s2.readout('bricks kept'), sparseRead = s2.readout('bricks only'), coarseRead = s2.readout('coarse grid, 16 across'), buildRead = s2.readout('built on the CPU in');
s2.note('With bricks only, a dropped cell can only promise "at least the band away", so the bolt and the marcher crawl across open floor. The coarse grid gives them their big jumps back.');

const s3 = sb.panel.section('03 · Ray marching', 'Read the number, jump exactly that far, repeat: a ray can never overshoot. The marched view draws the field this way for every pixel, with no triangles at all.');
s3.segment('Draw the yard from', [{ value: 'tri', label: 'triangles' }, { value: 'march', label: 'the field, marched' }, { value: 'heat', label: 'steps as heat' }], 'march', v => { view = v; hud(); });
s3.segment('March at', [{ value: 0.25, label: 'quarter size' }, { value: 0.5, label: 'half size' }, { value: 1, label: 'full size' }], 0.5, v => { scale = +v; });
s3.slider('Counts as a hit under (epsilon)', { min: 0.002, max: 0.1, step: 0.002, value: 0.01, unit: ' m' }, v => { MU.uEps.value = v; });
s3.slider('Give up after this many steps', { min: 8, max: 256, step: 8, value: 96 }, v => { MU.uMaxSteps.value = v; });
s3.slider('Draw the surface this far from the walls (an isosurface)', { min: -0.3, max: 1.5, step: 0.05, value: 0, unit: ' m' }, v => { MU.uIso.value = v; });
s3.slider('Bolt direction', { min: 0, max: 360, step: 1, value: 200, unit: ' deg' }, v => { boltDeg = v; });
const jumpRead = s3.readout('bolt: jumps to the hit'), stepRead = s3.readout('steps per pixel, average / most'), callRead = s3.readout('draw calls'), msRead = s3.readout('frame time');
s3.key([['#4aa3ff', 'a few steps'], ['#f2a341', 'many steps'], ['#ffffff', 'gave up, hit nothing']]);

const s4 = sb.panel.section('04 · Soft shadows', 'Every marched pixel walks a second ray to the torch. The nearest miss on the way, and how far along the ray it happened, set how dark the pixel is. Drag the torch around the yard.');
s4.segment('Shadow from the torch', [{ value: 0, label: 'none' }, { value: 1, label: 'hard' }, { value: 2, label: 'soft' }], 2, v => { MU.uShadow.value = +v; });
s4.slider('Edge sharpness (k)', { min: 1, max: 32, step: 1, value: 8 }, v => { MU.uSoftK.value = v; });
s4.slider('Torch height', { min: 0.5, max: 4.5, step: 0.1, value: 2.2, unit: ' m' }, v => { torchH = v; placeTorch(); });
s4.slider('Torch brightness', { min: 0, max: 8, step: 0.25, value: 3 }, v => { torchPow = v; MU.uLightPow.value = v; placeTorch(); });
s4.toggle('darken boxed-in corners (ambient occlusion)', false, v => { MU.uAO.value = v ? 1 : 0; });
s4.toggle('add the sun, shadowed by the same numbers', true, v => { MU.uSun.value = v ? 1 : 0; });
s4.note('Hard shadows stop at the first hit. Soft ones also remember the closest near miss, so the shadow edge widens the further it is from the thing that casts it, with no extra rays.');

const s5 = sb.panel.section('05 · Sliding collision', 'The knight reads the number where he stands. If it drops below his radius, he is pushed out the way the number grows, and that is a slide along the wall for free.');
s5.segment('The knight', [{ value: 'still', label: 'stands still' }, { value: 'circle', label: 'walks a loop' }, { value: 'keys', label: 'arrow keys' }], 'circle', v => { kmode = v; keys.clear(); });
s5.slider('Walking speed', { min: 0.5, max: 4, step: 0.1, value: 1.6, unit: ' m/s' }, v => { speed = v; });
s5.toggle('push out of walls (collision)', true, v => { collide = v; });
s5.toggle('show the push direction (the gradient)', true, v => { showPush = v; });
const nearRead = s5.readout('distance to the nearest wall'), pushRead = s5.readout('pushes in the last second');
s5.note('Turn the push off and he walks straight through the pillar; the number under him goes negative.');

function hud() { sb.hud('view', view === 'march' ? 'marched: every pixel walks the stored numbers with sphere tracing, no triangles' : view === 'heat' ? 'heat: how many jumps each pixel needed, brighter is more' : 'triangles: the same yard drawn from meshes, the way the other chapters draw it'); }
hud();

// ---- build
buildDense(64); buildStorage(); placeSlice(); placeTorch();

// ---- dragging the torch
const el = renderer.domElement; const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hitP = new THREE.Vector3(); let drag = false;
const toNdc = e => { const r = el.getBoundingClientRect(); ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height * 2 - 1)); ray.setFromCamera(ndc, camera); };
el.addEventListener('pointerdown', e => { toNdc(e); if (ray.intersectObject(torchPick, false).length) { drag = true; sb.controls.enabled = false; el.setPointerCapture(e.pointerId); } });
el.addEventListener('pointermove', e => { if (!drag) return; toNdc(e); plane.constant = -torchH; if (ray.ray.intersectPlane(plane, hitP)) torch.position.set(Math.max(-9.5, Math.min(9.5, hitP.x)), 0, Math.max(-9.5, Math.min(9.5, hitP.z))); });
el.addEventListener('pointerup', () => { if (drag) { drag = false; sb.controls.enabled = true; } });
const keys = new Set(); const KEYS = ['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'w', 'a', 's', 'd'];
window.addEventListener('keydown', e => { if (kmode !== 'keys') return; const k = e.key.toLowerCase(); if (KEYS.includes(k)) { keys.add(k); e.preventDefault(); } });
window.addEventListener('keyup', e => keys.delete(e.key.toLowerCase())); window.addEventListener('blur', () => keys.clear());

// ---- per frame: move the knight, march the bolt on the CPU, refresh readouts
let kx = 0, kz = 5.5, krot = 0, pathT = 0, pushes = 0, pushWindow = 0, pushShown = 0, frameN = 0, lastCalls = 0, msAvg = 16, stepAvg = 0, stepMax = 0, boltJumps = 0, boltHit = false;
const size = new THREE.Vector2(); renderer.info.autoReset = false;
function stepKnight(dt, t) {

  else if (kmode === 'keys') { if (keys.has('arrowup') || keys.has('w')) vz -= 1; if (keys.has('arrowdown') || keys.has('s')) vz += 1; if (keys.has('arrowleft') || keys.has('a')) vx -= 1; if (keys.has('arrowright') || keys.has('d')) vx += 1; const l = Math.hypot(vx, vz); if (l > 0) { vx = vx / l * speed; vz = vz / l * speed; } }
  kx += vx * dt; kz += vz * dt;
  if (collide) for (let i = 0; i < 3; i++) { const d = fieldAt(kx, 0.9, kz); if (d >= KR) break; const g = gradAt(kx, 0.9, kz); let gl = Math.hypot(g.x, g.z); if (gl < 1e-4) { g.x = 1; gl = 1; } const push = KR - d; kx += g.x / gl * push; kz += g.z / gl * push; pushes++; }
  kx = Math.max(-9.5, Math.min(9.5, kx)); kz = Math.max(-9.5, Math.min(9.5, kz));
  knight.position.set(kx, 0, kz); if (vx || vz) { krot = Math.atan2(vx, vz); knight.rotation.y = krot; }
  MU.uKnight.value.set(kx, 0, kz); MU.uKnightRot.value = krot;
}
function marchBolt() {
  const a = boltDeg * Math.PI / 180, dx = Math.cos(a), dz = Math.sin(a); let px = kx + dx * 0.7, pz = kz + dz * 0.7; const py = 1.0; const x0 = px, z0 = pz; let n = 0; boltHit = false; tmpQ.identity();
  for (n = 0; n < JMAX; n++) {
    const d = fieldAt(px, py, pz); const r = Math.max(d, 0.02);
    tmpP.set(px, py, pz); tmpS.set(r, r, r); tmpM.compose(tmpP, tmpQ, tmpS); jumpBalls.setMatrixAt(n, tmpM); tmpS.set(1, 1, 1); tmpM.compose(tmpP, tmpQ, tmpS); jumpDots.setMatrixAt(n, tmpM);
    if (d < MU.uEps.value) { boltHit = true; n++; break; }
    px += dx * d; pz += dz * d; if (Math.abs(px) > 10 || Math.abs(pz) > 10) { n++; break; }
  }
  boltJumps = n; jumpBalls.count = n; jumpDots.count = n; jumpBalls.instanceMatrix.needsUpdate = true; jumpDots.instanceMatrix.needsUpdate = true;
  const pos = boltGeo.attributes.position; pos.setXYZ(0, x0, py, z0); pos.setXYZ(1, px, py, pz); pos.needsUpdate = true; boltTip.position.set(px, py, pz); boltTip.visible = boltHit;
}
sb.onFrame((dt, t) => {
  lastCalls = renderer.info.render.calls; renderer.info.reset(); msAvg += (dt * 1000 - msAvg) * 0.08;
  stepKnight(dt, t); marchBolt();
  const dUnder = fieldAt(kx, 0.9, kz); safeBall.visible = showBall; safeBall.position.set(kx, 0.9, kz); const r = Math.max(Math.abs(dUnder), 0.02); safeBall.scale.set(r, r, r);
  pushArrow.visible = showPush; if (showPush) { const g = gradAt(kx, 0.9, kz); g.y = 0; if (g.lengthSq() > 1e-8) { g.normalize(); pushArrow.setDirection(g); } pushArrow.position.set(kx, 1.0, kz); }
  slice.visible = showSlice; boxLines.visible = showSlice || showBricks;
  torchFlame.getWorldPosition(MU.uLight.value);
  pushWindow += dt; if (pushWindow >= 1) { pushShown = pushes; pushes = 0; pushWindow = 0; }
  if ((frameN++ % 6) === 0) {
    underRead(dUnder.toFixed(2) + ' m' + (dUnder < 0 ? ', inside' : '')); nearRead(dUnder.toFixed(2) + ' m'); pushRead(pushShown);
    jumpRead(boltHit ? boltJumps + ' jumps, hit' : boltJumps + ' jumps, left the yard'); callRead(lastCalls); msRead(msAvg.toFixed(1) + ' ms');

  }
});
sb.onRender(() => {
  if (view === 'tri') { world.visible = true; renderer.setRenderTarget(null); renderer.render(scene, camera); return; }
  world.visible = false; camera.updateMatrixWorld();
  renderer.getDrawingBufferSize(size); const w = Math.max(2, Math.round(size.x * scale)), h = Math.max(2, Math.round(size.y * scale));
  if (rtM.width !== w || rtM.height !== h) { rtM.depthTexture.dispose(); rtM.dispose(); rtM = makeTarget(w, h); }
  MU.uInvProj.value.copy(camera.projectionMatrixInverse); MU.uCamWorld.value.copy(camera.matrixWorld); MU.uViewProj.value.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse); camera.getWorldPosition(MU.uCamPos.value);

  renderer.setRenderTarget(rtM); renderer.render(marchScene, ortho);
  if ((frameN % 4) === 0) {
    MU.uOut.value = 2; renderer.setRenderTarget(rtP); renderer.render(marchScene, ortho); renderer.readRenderTargetPixels(rtP, 0, 0, PN, PN, probeBuf);
    let s = 0, m = 0; for (let i = 0; i < PN * PN; i++) { const v = probeBuf[i * 4]; s += v; if (v > m) m = v; } stepAvg = s / (PN * PN); stepMax = m;
  }
  compMat.uniforms.tCol.value = rtM.texture; compMat.uniforms.tDepth.value = rtM.depthTexture;
  renderer.setRenderTarget(null); renderer.render(compScene, ortho);
  renderer.autoClear = false; renderer.render(scene, camera); renderer.autoClear = true;
});
sb.start();
</script>
