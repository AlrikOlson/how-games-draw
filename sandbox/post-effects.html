<!doctype html>
<html lang="en">
<head>

<title>Post Effects · Sandbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">

<body>
<script type="module">
import { boot, THREE, PAL } from './_kit.js';

const sb = boot({
  slug: 'post-effects', title: 'Post Effects',
  blurb: 'A night street at the camp, drawn by a real GPU into a picture with real brightness, then run through the three passes games add last: a glow around the lamps, a lens blur that keeps only the knight sharp, and a smear on the passing car. Every slider changes a real pass, and the order of the passes is yours to break.',
  camera: { pos: [7.5, 3.2, 10.5], target: [0, 1.2, -2.5], near: 0.1, far: 300 }
});
const scene = sb.scene, camera = sb.camera, renderer = sb.renderer, world = sb.world;
scene.background = null; renderer.info.autoReset = false;

// ---- night: a dim blue sky light, the moon as the shadow caster, street lamps doing the real work
sb.lights.hemi.color.set(0x4a5f8f); sb.lights.hemi.groundColor.set(0x141a1a); sb.lights.hemi.intensity = 0.45;
const moonLight = sb.lights.sun; moonLight.color.set(0x9fb4ff); moonLight.intensity = 0.7; moonLight.position.set(-14, 24, -12);
const shc = moonLight.shadow.camera; shc.left = shc.bottom = -34; shc.right = shc.top = 34; shc.far = 100; shc.updateProjectionMatrix(); moonLight.shadow.bias = -0.0006;
const skyCol = new THREE.Color(0.006, 0.009, 0.022);
// a material that is brighter than white: real brightness, no ceiling, for the things that will glow
const hdr = (r, g, b, k) => new THREE.MeshBasicMaterial({ color: new THREE.Color(r * k, g * k, b * k) });

// ---- the street
world.ground(90, 0x24402f);
const road = sb.mesh(new THREE.BoxGeometry(90, 0.06, 4.8), sb.mat(0x3a3e46), 0, 0.03, -6); road.castShadow = false; scene.add(road);
for (const z of [-3.4, -8.6]) { const kerb = sb.mesh(new THREE.BoxGeometry(90, 0.16, 0.7), sb.mat(PAL.stoneLite), 0, 0.08, z); kerb.castShadow = false; scene.add(kerb); }
function streetLamp(x, z, h = 3.6) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.name = 'streetlamp';
  g.add(sb.mesh(new THREE.CylinderGeometry(0.06, 0.1, h, 8), sb.mat(PAL.metal), 0, h / 2, 0));
  const arm = sb.mesh(new THREE.BoxGeometry(0.16, 0.16, 0.9), sb.mat(PAL.metal), 0, h, -0.35); arm.castShadow = false; g.add(arm);
  const head = sb.mesh(new THREE.SphereGeometry(0.2, 12, 10), hdr(1, 0.86, 0.55, 40), 0, h - 0.12, -0.7); head.castShadow = false; head.name = 'lamphead'; g.add(head);
  const light = new THREE.PointLight(0xffd27a, 110, 26, 2); light.position.set(0, h - 0.2, -0.7); g.add(light);
  scene.add(g); return g;
}
const lamps = [streetLamp(-9, -3.1), streetLamp(0, -3.1), streetLamp(9, -3.1)];
const knight = world.knight(-0.6, 1.4, 1.8, 0.5);
const fire = world.fire(2.8, 2.9); fire.getObjectByName('flame').material = hdr(1, 0.55, 0.15, 6); fire.traverse(m => { if (m.isMesh) m.castShadow = false; });
world.crate(-3.6, 4.6, 0.9, 0.3); world.crate(4.2, 5.0, 0.7, -0.5);
world.rock(6.5, 1.5, 0.6); world.rock(-7, 2.5, 0.5);
[[-15, -11.5, 5], [-8, -13, 4.5, false], [-2, -13.5, 5.5], [5, -12.5, 4.2], [11, -14, 5, false], [19, -12, 4.6]].forEach(a => world.tree(...a));
const house = world.house(14, -11, 4.6, 3.2, 2.8, 0.3); house.children[3].material.emissiveIntensity = 4;
const moon = new THREE.Mesh(new THREE.SphereGeometry(2.6, 16, 12), hdr(0.9, 0.95, 1, 5)); moon.position.set(-60, 44, -95); scene.add(moon);
// the spark: one dot about a pixel wide and 400 times brighter than white, drifting across the sky
const spark = new THREE.Mesh(new THREE.SphereGeometry(0.035, 6, 4), hdr(1, 1, 1, 400)); spark.position.set(0, 9, -28); spark.visible = false; scene.add(spark);
// the car
function makeCar() {
  const g = new THREE.Group(); g.name = 'car';
  g.add(sb.mesh(new THREE.BoxGeometry(3.8, 0.8, 1.7), sb.mat(0xd8433a), 0, 0.75, 0));
  g.add(sb.mesh(new THREE.BoxGeometry(1.9, 0.7, 1.5), sb.mat(0x2f3a55), -0.2, 1.5, 0));
  const wheelG = new THREE.CylinderGeometry(0.36, 0.36, 0.3, 12), wheelM = sb.mat(0x14161a);
  for (const [x, z] of [[1.25, 0.8], [1.25, -0.8], [-1.25, 0.8], [-1.25, -0.8]]) { const w = sb.mesh(wheelG, wheelM, x, 0.36, z); w.rotation.x = Math.PI / 2; w.castShadow = false; g.add(w); }
  const bulb = new THREE.SphereGeometry(0.11, 8, 6), headM = hdr(1, 0.95, 0.8, 14), tailM = hdr(1, 0.12, 0.08, 6);
  for (const z of [0.55, -0.55]) { const a = sb.mesh(bulb, headM, 1.92, 0.75, z), b = sb.mesh(bulb, tailM, -1.92, 0.8, z); a.castShadow = b.castShadow = false; g.add(a, b); }
  const light = new THREE.PointLight(0xfff0d0, 18, 14, 2); light.position.set(2.3, 0.7, 0); g.add(light);
  g.position.set(-14, 0, -6.2); scene.add(g); return g;
}
const car = makeCar();
sb.label('the street lamp, 40 times brighter than white', lamps[1].getObjectByName('lamphead')).off.set(0, 0.5, 0);
sb.label('the knight, where the lens is focused', knight, 'blue').off.set(0, 2.1, 0);
sb.label('the car, passing behind', car, 'amber').off.set(0, 2.3, 0);

// ---- every mesh gets a second material that writes how far its pixels moved since last frame (motion vectors)
const uPrevVP = { value: new THREE.Matrix4() }, uRes = { value: new THREE.Vector2(1, 1) };
const velVS = 'uniform mat4 uPrevModel; uniform mat4 uPrevVP; out vec4 vCur; out vec4 vPrev; void main(){ vec4 wp = modelMatrix * vec4(position, 1.0); vCur = projectionMatrix * viewMatrix * wp; vPrev = uPrevVP * uPrevModel * vec4(position, 1.0); gl_Position = vCur; }';
const velFS = 'uniform vec2 uRes; in vec4 vCur; in vec4 vPrev; out vec4 o; void main(){ vec2 a = vCur.xy / vCur.w; vec2 b = vPrev.xy / vPrev.w; o = vec4((a - b) * 0.5 * uRes, 1.0, 1.0); }';
const meshes = []; scene.updateMatrixWorld(true);
scene.traverse(m => { if (!m.isMesh) return; meshes.push(m); m.userData.lit = m.material;
  m.userData.vel = new THREE.ShaderMaterial({ glslVersion: THREE.GLSL3, vertexShader: velVS, fragmentShader: velFS, uniforms: { uPrevModel: { value: m.matrixWorld.clone() }, uPrevVP, uRes } }); });
const carMeshes = []; car.traverse(m => { if (m.isMesh) carMeshes.push(m); });

// ---- the passes: every one is a full-screen quad with its own shader, drawing into a render target
const GL3 = THREE.GLSL3, VS = 'out vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';
const quadScene = new THREE.Scene(), quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1), quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2)); quadScene.add(quad);
const SM = (fs, uniforms) => new THREE.ShaderMaterial({ glslVersion: GL3, vertexShader: VS, fragmentShader: fs, uniforms, depthTest: false, depthWrite: false });
const U = { near: { value: camera.near }, far: { value: camera.far }, focus: { value: 8 }, fmm: { value: 50 }, fstop: { value: 1.4 }, T: { value: 1.0 }, K: { value: 0.5 }, I: { value: 0.35 } };
const LIN = 'uniform float uNear; uniform float uFar; float lin(float d){ return (uNear * uFar) / (uFar - d * (uFar - uNear)); }';
const COC = 'uniform float uFocus; uniform float uFmm; uniform float uFstop; float cocOf(float dist, float pxPerMm, float maxCoc){ float d = dist * 1000.0; float df = uFocus * 1000.0; float A = uFmm / uFstop; float c = A * (uFmm * (d - df)) / (d * (df - uFmm)); return clamp(c * pxPerMm, -maxCoc, maxCoc); }';
const HASH = 'float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }';
const TONE = 'vec3 tone(vec3 x){ return x / (1.0 + x); }';

// bloom 1: keep only what is brighter than the threshold, fading in around it (soft knee)
const preMat = SM(`uniform sampler2D tSrc; uniform float uT; uniform float uK; in vec2 vUv; out vec4 o;
void main(){ vec3 c = texture(tSrc, vUv).rgb; float br = max(c.r, max(c.g, c.b)); float soft = clamp(br - uT + uK, 0.0, 2.0 * uK); soft = soft * soft / (4.0 * uK + 1e-5);
  c *= max(soft, br - uT) / max(br, 1e-5); o = vec4(max(c, 0.0), 1.0); }`, { tSrc: { value: null }, uT: U.T, uK: U.K });
// bloom 2: shrink by half with 13 reads, and on the first shrink let dim reads outvote one very bright one
const downMat = SM(`uniform sampler2D tSrc; uniform vec2 uTexel; uniform float uKaris; in vec2 vUv; out vec4 o;
vec3 box(float x, float y){ return texture(tSrc, vUv + vec2(x, y) * uTexel).rgb; }
float luma(vec3 c){ return dot(c, vec3(0.2126, 0.7152, 0.0722)); }
vec3 grp(vec3 a, vec3 b, vec3 c, vec3 d){ if (uKaris < 0.5) return 0.25 * (a + b + c + d); float wa = 1.0 / (1.0 + luma(a)), wb = 1.0 / (1.0 + luma(b)), wc = 1.0 / (1.0 + luma(c)), wd = 1.0 / (1.0 + luma(d)); return (a * wa + b * wb + c * wc + d * wd) / (wa + wb + wc + wd); }
void main(){ vec3 a = box(-2.0, 2.0), b = box(0.0, 2.0), c = box(2.0, 2.0), d = box(-2.0, 0.0), e = box(0.0, 0.0), f = box(2.0, 0.0), g = box(-2.0, -2.0), h = box(0.0, -2.0), i = box(2.0, -2.0);
  vec3 j = box(-1.0, 1.0), k = box(1.0, 1.0), l = box(-1.0, -1.0), m = box(1.0, -1.0);
  vec3 down = 0.5 * grp(j, k, l, m) + 0.125 * (grp(a, b, d, e) + grp(b, c, e, f) + grp(d, e, g, h) + grp(e, f, h, i)); o = vec4(down, 1.0); }`,
  { tSrc: { value: null }, uTexel: { value: new THREE.Vector2() }, uKaris: { value: 1 } });
// bloom 3: grow the smaller copy back with a 3 by 3 tent and add it to this size
const upMat = SM(`uniform sampler2D tSmall; uniform sampler2D tHere; uniform vec2 uTexel; in vec2 vUv; out vec4 o;
vec3 t(float x, float y){ return texture(tSmall, vUv + vec2(x, y) * uTexel).rgb; }
void main(){ vec3 s = t(-1.0, 1.0) + 2.0 * t(0.0, 1.0) + t(1.0, 1.0) + 2.0 * t(-1.0, 0.0) + 4.0 * t(0.0, 0.0) + 2.0 * t(1.0, 0.0) + t(-1.0, -1.0) + 2.0 * t(0.0, -1.0) + t(1.0, -1.0);
  o = vec4(texture(tHere, vUv).rgb + s / 16.0, 1.0); }`, { tSmall: { value: null }, tHere: { value: null }, uTexel: { value: new THREE.Vector2() } });
// bloom 4: add the glow to the picture
const bloomCompMat = SM('uniform sampler2D tSrc; uniform sampler2D tBloom; uniform float uI; in vec2 vUv; out vec4 o; void main(){ o = vec4(texture(tSrc, vUv).rgb + uI * texture(tBloom, vUv).rgb, 1.0); }', { tSrc: { value: null }, tBloom: { value: null }, uI: U.I });
// the squeeze for the screen: real brightness to 0..1
const toneMat = SM(TONE + ' uniform sampler2D tSrc; in vec2 vUv; out vec4 o; void main(){ o = vec4(tone(texture(tSrc, vUv).rgb), 1.0); }', { tSrc: { value: null } });

// depth of field 1: a half-size copy of the picture, with each pixel's disc size worked out from the depth picture and the lens
const dofDownMat = SM(LIN + COC + ` uniform sampler2D tSrc; uniform sampler2D tDepth; uniform float uPxPerMm; uniform float uMaxCoc; in vec2 vUv; out vec4 o;
void main(){ float coc = cocOf(lin(texture(tDepth, vUv).r), uPxPerMm, uMaxCoc); o = vec4(texture(tSrc, vUv).rgb, coc); }`,
  { tSrc: { value: null }, tDepth: { value: null }, uNear: U.near, uFar: U.far, uFocus: U.focus, uFmm: U.fmm, uFstop: U.fstop, uPxPerMm: { value: 1 }, uMaxCoc: { value: 16 } });
// depth of field 2: the widest disc in each 8 by 8 block, behind the focus (red channel) and in front of it (green)
const cocTileMat = SM(`uniform sampler2D tDof; in vec2 vUv; out vec4 o;
void main(){ ivec2 sz = textureSize(tDof, 0); ivec2 base = ivec2(gl_FragCoord.xy) * 8; float f = 0.0, n = 0.0;
  for (int y = 0; y < 8; y++) for (int x = 0; x < 8; x++) { float c = texelFetch(tDof, min(base + ivec2(x, y), sz - 1), 0).a; f = max(f, c); n = max(n, -c); } o = vec4(f, n, 0.0, 1.0); }`, { tDof: { value: null } });
const cocNeighMat = SM(`uniform sampler2D tTile; in vec2 vUv; out vec4 o;
void main(){ ivec2 sz = textureSize(tTile, 0); ivec2 p = ivec2(gl_FragCoord.xy); vec2 m = vec2(0.0);
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) m = max(m, texelFetch(tTile, clamp(p + ivec2(x, y), ivec2(0), sz - 1), 0).rg); o = vec4(m, 0.0, 1.0); }`, { tTile: { value: null } });
// depth of field 3: gather. mode 0 blurs every pixel by its own disc; mode 1 is the far field with the disc check; mode 2 is the near field with its cover value
const gatherMat = SM(HASH + ` uniform sampler2D tDof; uniform sampler2D tNeigh; uniform int uMode; uniform int uN; uniform float uShape; uniform vec2 uTexel; in vec2 vUv; out vec4 o;
void main(){ vec4 P = texture(tDof, vUv); float cocP = P.a; vec2 nb = texture(tNeigh, vUv).rg;
  float R = uMode == 0 ? abs(cocP) : (uMode == 1 ? nb.r : nb.g);
  if (R < 0.5) { o = uMode == 2 ? vec4(0.0) : vec4(P.rgb, 1.0); return; }
  float jit = hash(gl_FragCoord.xy) * 6.2831853; vec3 sum = vec3(0.0); float wsum = 0.0;
  for (int i = 0; i < 64; i++) { if (i >= uN) break;
    float r = sqrt((float(i) + 0.5) / float(uN)); float th = float(i) * 2.39996 + jit; vec2 dir = vec2(cos(th), sin(th));
    float shape = 1.0; if (uShape > 0.5) { float a = mod(th, 1.0471976) - 0.5235988; shape = 0.8660254 / cos(a); }
    vec4 Q = texture(tDof, vUv + dir * r * shape * R * uTexel); float cocQ = Q.a; float w;
    if (uMode == 0) w = 1.0;
    else if (uMode == 1) { w = clamp(cocQ - r * R + 1.0, 0.0, 1.0); if (cocQ > cocP) w *= clamp(abs(cocP) / max(cocQ, 1e-3), 0.0, 1.0); }
    else w = clamp(-cocQ - r * R + 1.0, 0.0, 1.0);
    sum += w * Q.rgb; wsum += w; }
  vec3 c = wsum > 0.0 ? sum / wsum : P.rgb;
  o = uMode == 2 ? vec4(c, clamp(wsum / float(uN), 0.0, 1.0)) : vec4(c, 1.0); }`,
  { tDof: { value: null }, tNeigh: { value: null }, uMode: { value: 1 }, uN: { value: 32 }, uShape: { value: 0 }, uTexel: { value: new THREE.Vector2() } });
// depth of field 4: full size again. sharp where the disc is small, the far field where it is big, and the near field laid on top by its cover value
const dofCompMat = SM(LIN + COC + ` uniform sampler2D tSrc; uniform sampler2D tFar; uniform sampler2D tNear; uniform sampler2D tDepth; uniform int uMode; uniform float uPxPerMm; uniform float uMaxCoc; in vec2 vUv; out vec4 o;
void main(){ float coc = cocOf(lin(texture(tDepth, vUv).r), uPxPerMm, uMaxCoc); vec3 sharp = texture(tSrc, vUv).rgb; vec3 far = texture(tFar, vUv).rgb;
  float fb = uMode == 0 ? clamp(abs(coc) - 0.5, 0.0, 1.0) : clamp(coc - 0.5, 0.0, 1.0); vec3 c = mix(sharp, far, fb);
  if (uMode == 1) { vec4 n = texture(tNear, vUv); c = mix(c, n.rgb, n.a); } o = vec4(c, 1.0); }`,
  { tSrc: { value: null }, tFar: { value: null }, tNear: { value: null }, tDepth: { value: null }, uNear: U.near, uFar: U.far, uFocus: U.focus, uFmm: U.fmm, uFstop: U.fstop, uMode: { value: 1 }, uPxPerMm: { value: 1 }, uMaxCoc: { value: 32 } });

// motion blur 1: the longest move in each 16 by 16 block, then the longest in the 3 by 3 blocks around
const vTileMat = SM(`uniform sampler2D tVel; in vec2 vUv; out vec4 o;
void main(){ ivec2 sz = textureSize(tVel, 0); ivec2 base = ivec2(gl_FragCoord.xy) * 16; vec2 m = vec2(0.0);
  for (int y = 0; y < 16; y++) for (int x = 0; x < 16; x++) { vec2 v = texelFetch(tVel, min(base + ivec2(x, y), sz - 1), 0).xy; if (dot(v, v) > dot(m, m)) m = v; } o = vec4(m, 0.0, 1.0); }`, { tVel: { value: null } });
const vNeighMat = SM(`uniform sampler2D tTile; in vec2 vUv; out vec4 o;
void main(){ ivec2 sz = textureSize(tTile, 0); ivec2 p = ivec2(gl_FragCoord.xy); vec2 m = vec2(0.0);
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) { vec2 v = texelFetch(tTile, clamp(p + ivec2(x, y), ivec2(0), sz - 1), 0).xy; if (dot(v, v) > dot(m, m)) m = v; } o = vec4(m, 0.0, 1.0); }`, { tTile: { value: null } });
// motion blur 2: walk along the movement and weigh each read by whether it can reach this pixel (McGuire 2012). Depths here are distances, so f is 1 when the read is nearer than this pixel, b when it is farther.
const mbMat = SM(LIN + HASH + ` uniform sampler2D tSrc; uniform sampler2D tVel; uniform sampler2D tNeigh; uniform sampler2D tDepth; uniform int uN; uniform int uMode; uniform float uShutter; uniform float uMaxV; uniform float uSoftZ; uniform vec2 uTexel; in vec2 vUv; out vec4 o;
vec2 clampV(vec2 v){ float l = length(v); return l > uMaxV ? v * (uMaxV / l) : v; }
float cone(float d, float l){ return clamp(1.0 - d / max(l, 1e-3), 0.0, 1.0); }
float cyl(float d, float l){ return l < 1e-4 ? 0.0 : 1.0 - smoothstep(0.95 * l, 1.05 * l, d); }
void main(){ vec3 cX = texture(tSrc, vUv).rgb; vec2 vX = clampV(texture(tVel, vUv).xy * uShutter); float zX = lin(texture(tDepth, vUv).r);
  vec2 vN = uMode == 0 ? vX : clampV(texture(tNeigh, vUv).xy * uShutter); float lN = length(vN);
  if (lN < 0.5) { o = vec4(cX, 1.0); return; }
  float jitter = hash(gl_FragCoord.xy) - 0.5; float lX = length(vX);
  float wX = uMode == 0 ? 1.0 : 1.0 / max(lX, 0.5); vec3 sum = cX * wX; float wsum = wX;
  for (int i = 0; i < 16; i++) { if (i >= uN) break;
    float t = (float(i) + 0.5 + jitter) / float(uN) - 0.5; vec2 p = vUv + vN * t * uTexel; float d = abs(t) * lN; vec3 cY = texture(tSrc, p).rgb; float w = 1.0;
    if (uMode > 0) { vec2 vY = clampV(texture(tVel, p).xy * uShutter); float lY = length(vY); float f = 1.0, b = 1.0;
      if (uMode == 2) { float zY = lin(texture(tDepth, p).r); f = clamp(1.0 - (zY - zX) / uSoftZ, 0.0, 1.0); b = clamp(1.0 - (zX - zY) / uSoftZ, 0.0, 1.0); }
      w = f * cone(d, lY) + b * cone(d, lX) + 2.0 * cyl(d, lY) * cyl(d, lX); }
    sum += w * cY; wsum += w; }
  o = vec4(sum / max(wsum, 1e-4), 1.0); }`,
  { tSrc: { value: null }, tVel: { value: null }, tNeigh: { value: null }, tDepth: { value: null }, uN: { value: 8 }, uMode: { value: 2 }, uShutter: { value: 0.5 }, uMaxV: { value: 64 }, uSoftZ: { value: 0.6 }, uTexel: { value: new THREE.Vector2() }, uNear: U.near, uFar: U.far });

// the last pass: the finished picture to the screen, or one of the views, encoded for the screen
const showMat = SM(LIN + TONE + ` uniform sampler2D tSrc; uniform sampler2D tHdr; uniform sampler2D tAux; uniform sampler2D tDof; uniform sampler2D tVel; uniform sampler2D tNeigh; uniform sampler2D tDepth; uniform int uMode; uniform float uGain; uniform float uT; uniform float uK; uniform float uMaxCoc; in vec2 vUv; out vec4 o;
vec3 srgb(vec3 c){ c = clamp(c, 0.0, 1.0); return mix(12.92 * c, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(vec3(0.0031308), c)); }
vec3 dirCol(vec2 v, float scale){ float s = clamp(length(v) / scale, 0.0, 1.0); vec3 col = v.x >= 0.0 ? vec3(0.95, 0.64, 0.25) : vec3(0.29, 0.64, 1.0); return mix(vec3(0.04), col, sqrt(s)); }
void main(){ vec3 c;
  if (uMode == 0) c = texture(tSrc, vUv).rgb;
  else if (uMode == 1) c = tone(texture(tAux, vUv).rgb * uGain);
  else if (uMode == 2) { float coc = texture(tDof, vUv).a; float s = clamp(abs(coc) / uMaxCoc, 0.0, 1.0); c = mix(vec3(0.03), coc < 0.0 ? vec3(0.29, 0.64, 1.0) : vec3(0.95, 0.64, 0.25), sqrt(s)); }
  else if (uMode == 3) c = dirCol(texture(tVel, vUv).xy, 24.0);
  else if (uMode == 4) c = dirCol(texture(tNeigh, vUv).xy, 24.0);
  else if (uMode == 5) { vec3 h = texture(tHdr, vUv).rgb; float br = max(h.r, max(h.g, h.b)); float soft = clamp(br - uT + uK, 0.0, 2.0 * uK); soft = soft * soft / (4.0 * uK + 1e-5); float w = clamp(max(soft, br - uT) / max(br, 1e-5), 0.0, 1.0); c = mix(texture(tSrc, vUv).rgb * 0.3, vec3(0.95, 0.64, 0.25), w); }

  chainRead(bloomReads.toLocaleString()); if (T) perPxRead((bloomReads / (T.w * T.h)).toFixed(1) + ' reads');
});
