function pick(e) { toNdc(e); overlay.updateMatrixWorld(true); if (ray.intersectObject(startH, false).length) return { kind: 'start' }; if (ray.intersectObject(aimH, false).length) return { kind: 'aim' }; const h = ray.intersectObjects(pickMeshes, false); if (h.length) { const p = dragProps.find(q => q.meshes.includes(h[0].object)); return { kind: 'prop', p }; } return null; }
sb.stage.addEventListener('pointerdown', e => {
  if (e.button !== 0 || e.target !== renderer.domElement) return; const t = pick(e); if (!t) return;
  drag = t; sb.controls.enabled = false; sb.stage.style.cursor = 'grabbing'; e.stopPropagation(); e.preventDefault();
  const y = t.kind === 'start' ? rayStart.y : t.kind === 'aim' ? rayAim.y : 0; plane.constant = -y; if (ray.ray.intersectPlane(plane, hitP)) { const src = t.kind === 'start' ? rayStart : t.kind === 'aim' ? rayAim : t.p.obj.position; grabOff.copy(src).sub(hitP); }
}, true);
window.addEventListener('pointermove', e => {
  if (!drag) { if (e.target === renderer.domElement) sb.stage.style.cursor = pick(e) ? 'grab' : ''; return; }
  toNdc(e); if (!ray.ray.intersectPlane(plane, hitP)) return; hitP.add(grabOff);
  if (drag.kind === 'start') { rayStart.x = hitP.x; rayStart.z = hitP.z; clampRay(); }
  else if (drag.kind === 'aim') { rayAim.x = hitP.x; rayAim.z = hitP.z; clampRay(); }
  else { const o = drag.p.obj; o.position.x = THREE.MathUtils.clamp(hitP.x, -17, 17); o.position.z = THREE.MathUtils.clamp(hitP.z, -17, 17); propMoved(drag.p, drag.p.name); }
  e.stopPropagation();
});
window.addEventListener('pointerup', () => { if (drag) { drag = null; sb.controls.enabled = true; sb.stage.style.cursor = ''; } });

// ---- views
function applyView() {
  sb.hud('mode', view === 'raster' ? 'rasterized only: triangles painted to the screen, shadows from a shadow map' : view === 'split' ? 'left: rasterized · right of the line: ray traced in a shader, ' + (findBy === 'brute' ? 'camera rays checking every triangle' : 'walking the tree of boxes') : view === 'rt' ? 'ray traced: every pixel is one ray asking what it hits first' : 'boxes opened per pixel: dark blue is cheap, white is a hundred or more');
  pondLabel.hide(view === 'raster' || view === 'heat');
  const LAY = ['', 'sun light only, with its soft shadows', 'sky light only, brightened 4 times: bright where the sky is in view, dark in corners and under things', 'bounced light only, brightened 6 times: light that hit something else first', 'campfire light only, brightened 2 times, with its shadows', 'the mirror bounce only: the pond and the shield', 'white where the sun is visible, black where a shadow ray was blocked'];
  if (layer && view !== 'raster' && view !== 'heat') sb.hud('mode', LAY[layer]);
  dirty();
}
applyView();

// ---- first build, then the loop
rebuildAll(null); triTotal(total.toLocaleString());
let msAvg = 0, lastNow = 0;
const invPV = new THREE.Matrix4();
sb.onFrame((dt, t) => {
  if (wind) windStep(t); else windMs = 0;
  frameWorkRead(wind ? windMs.toFixed(2) + ' ms' : 'nothing, the camp is still');
  if (walkDirty) updateWalk(); if (levelDirty) updateLevel(); if (statsDirty) updateStats();
  const now = performance.now(); if (lastNow) msAvg += ((now - lastNow) - msAvg) * 0.1; lastNow = now; msRead(msAvg.toFixed(1) + ' ms');
  const frac = view === 'raster' ? 0 : view === 'split' ? 1 - splitF : 1; const heatOn = view === 'heat';
  const perHit = 2 + shadowN + (skyRays || diff > 0 ? 1 : 0) + diff * 2 + Math.max(diff - 1, 0);
  const rpp = heatOn ? 1 : perHit * (1 + bounces);
  const px = rt ? Math.round(rt.width * frac) * rt.height : 0;
  rtRead(rt && frac > 0 ? rtW + ' × ' + rtH + ' rays wide and tall' : 'off');
  rppRead(heatOn ? '1, the camera ray only' : perHit + ' per surface hit' + (bounces ? ', times ' + (1 + bounces) + ' at a mirror' : ''));
  accRead(heatOn ? 'not for this view' : !accumulate ? 'off, one frame at a time' : wind ? 'off while the wind blows' : accN + (accN === 1 ? ' frame' : ' frames'));
  rpfRead(frac > 0 ? (px * rpp).toLocaleString() : '0');
});
const lastCam = new THREE.Matrix4();
sb.onRender((scene, camera, renderer) => {
  camera.updateMatrixWorld(); invPV.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse).invert();
  if (!lastCam.equals(camera.matrixWorld)) { lastCam.copy(camera.matrixWorld); dirty(); }
  U.uInvPV.value.copy(invPV); U.uCamPos.value.copy(camera.position); skyU.uInvPV.value.copy(invPV); skyU.uCamPos.value.copy(camera.position);
  renderer.autoClear = false; renderer.setRenderTarget(null); renderer.setClearColor(PAL.sky, 1); renderer.clear();
  renderer.render(skyScene, quadCam);
  const split = view === 'split' ? splitF : view === 'raster' ? 1 : 0;
  if (split > 0) renderer.render(scene, camera);
  if (split < 1) {
    ensureRT(); const heatOn = view === 'heat'; U.uSplit.value = split; U.uHeat.value = heatOn ? 1 : 0; U.uShadowN.value = heatOn ? 0 : shadowN; U.uBounces.value = heatOn ? 0 : bounces; U.uFrame.value = frame++;
    const blending = accumulate && !heatOn && !wind; if (!blending) accN = 0; U.uBlend.value = blending ? 1 / (accN + 1) : 1; if (blending && accN < 4096) accN++;
    U.tPrev.value = rtPrev.texture; renderer.setRenderTarget(rt); renderer.clear(); renderer.render(traceScene, quadCam); renderer.setRenderTarget(null);
    compU.tRT.value = rt.texture; compU.uRaw.value = heatOn ? 1 : 0; compU.uSplit.value = split; compU.uRes.value.set(sb.stage.clientWidth, sb.stage.clientHeight); renderer.render(compScene, quadCam);
    const sw = rt; rt = rtPrev; rtPrev = sw;
  }
  renderer.render(overlay, camera);
});
sb.start();
</script>
