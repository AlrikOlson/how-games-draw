{ const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), P = new THREE.Vector3(), S = new THREE.Vector3();
  forest.forEach(([x, z, h], i) => { const s = h / 4.5; S.set(s, s, s); Q.setFromAxisAngle(P.set(0, 1, 0), i * 1.7);
    M.compose(P.set(x, h * 0.225, z), Q, S); trunks.setMatrixAt(i, M);

    float s = hash3(floor(rd * 260.0)); c += vec3(0.7, 0.75, 0.9) * step(0.9965, s) * smoothstep(0.05, 0.35, rd.y) * 0.5;

    float prof = smoothstep(0.0, 0.25, h) * smoothstep(1.0, 0.55, h);

      float sc = float(uSlices) * log(max(viewZ, uNearF) / uNearF) / log(uFogFar / uNearF);
      vec2 cells = vec2(float(uCellsX), float(uCellsY)); vec2 fr = fract(vUv * cells); vec2 px = fr * (uScreen / cells);
      if (mod(floor(min(sc, float(uSlices) - 1.0)), 2.0) < 1.0) c *= 0.8;
      if (min(px.x, px.y) < 1.0) c = mix(c, vec3(0.95, 0.64, 0.25), 0.3);
    }
    gl_FragColor = linearToOutputTexel(vec4(1.0 - exp(-1.4 * c), 1.0));  // a soft curve: bright glow rolls off instead of clipping
  }`;

const ortho = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const pass = frag => { const m = new THREE.ShaderMaterial({ uniforms: U, vertexShader: passVert, fragmentShader: frag, depthTest: false, depthWrite: false }); const s = new THREE.Scene(); const q = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), m); q.frustumCulled = false; s.add(q); return s; };
const fogPass = pass(fogFrag), injectPass = pass(injectFrag), integPass = pass(integFrag), histPass = pass(histFrag), compPass = pass(compFrag);
const depthTex = new THREE.DepthTexture(4, 4, THREE.UnsignedIntType); depthTex.format = THREE.DepthFormat; depthTex.minFilter = depthTex.magFilter = THREE.NearestFilter;
const rtScene = new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthTexture: depthTex, depthBuffer: true });
const half = () => new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false });
const rtFog = half(); let histA = half(), histB = half();
const atlas = () => new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType, minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: false });
const rtInject = atlas(), rtInteg = atlas();
U.tScene.value = rtScene.texture; U.tDepth.value = depthTex; U.tInject.value = rtInject.texture; U.tInteg.value = rtInteg.texture;
const maxTex = renderer.capabilities.maxTextureSize;
let cellsY = 24, histReset = true, calls = 0, msAvg = 16, fogW = 1, fogH = 1;
const size = new THREE.Vector2(), lastCam = new THREE.Matrix4();
function ensureAtlas() {
  const cy = Math.max(1, Math.round(S.cellsX * size.y / size.x)), perRow = Math.max(1, Math.min(S.slices, Math.floor(maxTex / S.cellsX))), rows = Math.ceil(S.slices / perRow);
  const w = perRow * S.cellsX, h = rows * cy; cellsY = cy;
  if (rtInject.width !== w || rtInject.height !== h) { rtInject.setSize(w, h); rtInteg.setSize(w, h); histReset = true; }
  U.uCellsX.value = S.cellsX; U.uCellsY.value = cy; U.uSlices.value = S.slices; U.uPerRow.value = perRow; U.uAtlasSize.value.set(w, h);
}
renderer.info.autoReset = false;
sb.onRender((scene, camera, renderer) => {
  renderer.info.reset();
  renderer.getDrawingBufferSize(size);
  if (rtScene.width !== size.x || rtScene.height !== size.y) { rtScene.setSize(size.x, size.y); U.uScreen.value.copy(size); }
  fogW = Math.max(1, Math.round(size.x * S.fogScale)); fogH = Math.max(1, Math.round(size.y * S.fogScale));
  if (rtFog.width !== fogW || rtFog.height !== fogH) { rtFog.setSize(fogW, fogH); histA.setSize(fogW, fogH); histB.setSize(fogW, fogH); histReset = true; U.uRes.value.set(fogW, fogH); }
  U.uInvProj.value.copy(camera.projectionMatrixInverse); U.uInvView.value.copy(camera.matrixWorld); camera.getWorldPosition(U.uCamPos.value);
  U.uJitter.value.set(Math.random(), Math.random(), Math.random());
  // 1: the scene itself, colour plus depth, into a buffer. This pass also refreshes the floodlight's shadow map.
  renderer.setRenderTarget(rtScene); renderer.render(scene, camera);
  U.tShadow.value = spot.shadow.map ? spot.shadow.map.depthTexture : null;
  // 2: in grid mode, fill every cell with lit fog, then sweep each column front to back
  if (S.mode === 1) { ensureAtlas(); renderer.setRenderTarget(rtInject); renderer.render(injectPass, ortho); renderer.setRenderTarget(rtInteg); renderer.render(integPass, ortho); }
  // 3: the fog pass, at the chosen size: glow in rgb, light getting through in alpha
  renderer.setRenderTarget(rtFog); renderer.render(fogPass, ortho);
  let fogTex = rtFog.texture;
  // 4: in wobble mode, average with the last frames while the camera holds still
  if (S.mode === 1 && S.froxRead === 2) {
    U.uAlpha.value = (histReset || !camera.matrixWorld.equals(lastCam)) ? 1 : 0.1; U.tFog.value = rtFog.texture; U.tHist.value = histA.texture;
    renderer.setRenderTarget(histB); renderer.render(histPass, ortho); const t = histA; histA = histB; histB = t; fogTex = histA.texture; histReset = false;
  }
  lastCam.copy(camera.matrixWorld);
  // 5: composite: scene colour times light getting through, plus the glow
  U.tFog.value = fogTex; renderer.setRenderTarget(null); renderer.render(compPass, ortho);
  calls = renderer.info.render.calls;
});

// ---- dragging the mast: grab any part of it, slide it over the ground
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit = new THREE.Vector3();
const el = renderer.domElement; let dragging = false;
const toNdc = e => { const r = el.getBoundingClientRect(); ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); };
const overMast = e => { toNdc(e); ray.setFromCamera(ndc, camera); const h = ray.intersectObjects(mastMeshes, false); if (h.length) groundPlane.constant = -h[0].point.y; return h.length > 0; };  // drag on a level plane through the grabbed point
el.addEventListener('pointerdown', e => { if (e.button !== 0 || !overMast(e)) return; dragging = true; controls.enabled = false; el.setPointerCapture(e.pointerId); e.stopImmediatePropagation(); }, { capture: true });
el.addEventListener('pointermove', e => {
  if (dragging) { toNdc(e); ray.setFromCamera(ndc, camera); if (ray.ray.intersectPlane(groundPlane, hit)) { const r = Math.hypot(hit.x, hit.z); if (r > 18) hit.multiplyScalar(18 / r); mast.position.set(hit.x, 0, hit.z); histReset = true; } e.stopImmediatePropagation(); }
  else el.style.cursor = overMast(e) ? 'grab' : '';
}, { capture: true });
const release = e => { if (!dragging) return; dragging = false; controls.enabled = true; try { el.releasePointerCapture(e.pointerId); } catch (_) {} };
el.addEventListener('pointerup', release, { capture: true }); el.addEventListener('pointercancel', release, { capture: true });

// ---- panel
const sizeName = () => S.fogScale === 1 ? 'full size' : S.fogScale === 0.5 ? 'half size' : 'quarter size';
const readName = () => S.froxRead === 0 ? 'one cell per pixel' : S.froxRead === 1 ? 'blending the neighbours' : 'wobbling and averaging';
function hud() {
  sb.hud('mode', S.mode === 0 ? 'marching: ' + S.steps + ' looks per pixel, ' + (S.shadow ? 'shadow map read at each' : 'no shadow test') + ', fog at ' + sizeName()
    : S.mode === 1 ? 'grid of cells: ' + S.cellsX + ' by ' + cellsY + ' by ' + S.slices + ', ' + readName()
    : S.mode === 2 ? 'one formula per pixel: ' + (S.plain ? 'plain distance fog' : 'ground mist') + (S.hMode ? ', stepped with ' + S.hSteps + ' looks' : ', exact') : 'no fog: the plain scene');
  sb.hud('view', S.fogView === 1 ? 'showing light getting through (transmittance): white = clear' : S.fogView === 2 ? 'showing the fog glow on its own' : S.mode === 1 && S.froxView ? ['', 'each cell: its own lit glow', 'each cell: glow added up from the player', 'each cell: light getting through'][S.froxView] : null);
}
let methodSeg;
const touch = m => { if (S.mode !== m) methodSeg.set(m); };
const dirty = () => { histReset = true; };

const s1 = sb.panel.section('01 · The fog and the floodlight', 'Fog has no colour of its own. What you see is lamp light bounced off specks in the air, so it is bright inside the floodlight\'s cone and dark behind a tree. Drag the mast around the camp and watch the glow move with it.');
s1.slider('Fog everywhere', { min: 0, max: 0.12, step: 0.005, value: 0.015, unit: ' per m' }, v => { U.uBase.value = v; dirty(); });
s1.slider('Drifting mist patches', { min: 0, max: 1, step: 0.05, value: 0.5 }, v => { U.uPatch.value = v; dirty(); });
s1.slider('Mast height', { min: 3, max: 12, step: 0.5, value: 7.5, unit: ' m' }, v => { S.mastH = v; dirty(); });
s1.slider('Cone width', { min: 12, max: 50, step: 1, value: 28, unit: ' degrees' }, v => { S.cone = v; spot.angle = v * Math.PI / 180; U.uCosOuter.value = Math.cos(spot.angle); U.uCosInner.value = Math.cos(spot.angle * (1 - spot.penumbra)); dirty(); });
s1.slider('Floodlight brightness', { min: 50, max: 800, step: 10, value: 400 }, v => { spot.intensity = v; U.uSpotI.value = v; dirty(); });
const posRead = s1.readout('floodlight stands at');

const s2 = sb.panel.section('02 · Marching one line of sight', 'For every pixel the shader walks from the eye out to whatever the pixel shows, in equal steps. At each step it takes the fog there, times the light reaching it, times how much survives the trip back. Fewer steps is cheaper and shows bands.');
methodSeg = s2.segment('How the fog is worked out', [{ value: 0, label: 'march every pixel' }, { value: 1, label: 'grid of cells (froxels)' }, { value: 2, label: 'one formula (height fog)' }, { value: 3, label: 'no fog' }], 0, v => { S.mode = +v; U.uMode.value = S.mode; dirty(); hud(); });
s2.slider('Steps along each line of sight', { min: 4, max: 128, step: 1, value: 48 }, v => { S.steps = v; U.uSteps.value = v; touch(0); hud(); });
s2.toggle('shadow test at every step (light shafts)', true, v => { S.shadow = v; U.uShadowOn.value = v ? 1 : 0; touch(0); dirty(); hud(); });
s2.toggle('start each pixel\'s walk at a random offset (dither)', false, v => { S.dither = v; U.uDither.value = v ? 1 : 0; touch(0); });
s2.segment('Fog picture size', [{ value: 1, label: 'full' }, { value: 0.5, label: 'half' }, { value: 0.25, label: 'quarter' }], 0.5, v => { S.fogScale = +v; hud(); });
s2.segment('Show', [{ value: 0, label: 'the picture' }, { value: 1, label: 'light getting through' }, { value: 2, label: 'the glow only' }], 0, v => { S.fogView = +v; U.uFogView.value = S.fogView; hud(); });
s2.note('Drop to 8 steps and the cone edge breaks into bands. Random offsets (dither) turn the bands into fine grain, which a blur or the next frame hides. Half size is what shipped games do: the fog is soft anyway, so a small picture scaled up looks the same for a quarter of the cost.');
const looksRead = s2.readout('looks per pixel'), pixRead = s2.readout('fog pixels this frame'), workRead = s2.readout('fog looks this frame'), msRead = s2.readout('time per frame'), callRead = s2.readout('draw calls');

const s3 = sb.panel.section('03 · Which way fog throws light', 'A fog particle throws most light onward, in the direction the light was already going. So the fog is brightest when you look toward the floodlight, and dim with the light behind you. The one knob (anisotropy, g) sets how strong that preference is.');
s3.slider('How strongly fog throws light forward (g)', { min: -0.9, max: 0.9, step: 0.05, value: 0.6, fmt: v => v.toFixed(2) + (v < -0.25 ? ', mostly back' : v < 0.25 ? ', evenly' : v < 0.65 ? ', forward' : ', mostly forward') }, v => { S.g = v; U.uG.value = v; dirty(); });
s3.toggle('add a small backward lobe (two lobes, the usual engine setup)', false, v => { S.twoLobe = v; U.uTwoLobe.value = v ? 1 : 0; dirty(); });
// the kit keeps the orbit above the horizon; looking up at a target needs that cap lifted, and the ground clamp below keeps the camera up
const lookUp = up => { controls.maxPolarAngle = up ? Math.PI * 0.98 : Math.PI * 0.49; };
s3.button('Look toward the floodlight', () => { lookUp(true); camera.position.set(mast.position.x + 7.5, 1.6, mast.position.z + 11.5); head.getWorldPosition(controls.target); });
s3.button('Stand under it, look away', () => { lookUp(false); camera.position.set(mast.position.x - 0.5, 1.7, mast.position.z + 2.8); controls.target.set(mast.position.x + 8, 1.2, mast.position.z + 10); });
s3.button('Back to the rise', () => { lookUp(false); camera.position.set(10, 4.5, 13); controls.target.set(0, 1.5, -2); });
s3.note('At 0.9 the cone glows hard when you face the light and nearly vanishes from behind. At 0 every direction gets the same share and the cone looks the same from everywhere.');

const s4 = sb.panel.section('04 · Fog in a grid of cells', 'Instead of walking every pixel, the engine chops the view into a fan of cells (froxels), works out the lit fog once per cell, sweeps each column front to back, and then every pixel reads one cell. Cheap, but the cone and the shadows come out blocky.');
s4.segment('Cells across the view', [16, 32, 64], 32, v => { S.cellsX = +v; touch(1); dirty(); hud(); });
s4.segment('Cells along the distance (slices)', [16, 32, 64, 128], 64, v => { S.slices = +v; touch(1); dirty(); hud(); });
s4.segment('When a pixel reads the grid', [{ value: 0, label: 'take one cell' }, { value: 1, label: 'blend the neighbours' }, { value: 2, label: 'wobble and average' }], 0, v => { S.froxRead = +v; U.uFroxRead.value = S.froxRead; touch(1); dirty(); hud(); });
s4.toggle('draw the cells', true, v => { S.grid = v; U.uGridOn.value = v ? 1 : 0; touch(1); });
s4.segment('Colour each cell by', [{ value: 0, label: 'the picture' }, { value: 1, label: 'its own lit glow' }, { value: 2, label: 'glow added up' }, { value: 3, label: 'light getting through' }], 0, v => { S.froxView = +v; U.uFroxView.value = S.froxView; touch(1); hud(); });
const cellRead = s4.readout('cells in the grid');
s4.note('Blending the neighbours smooths the blocks. Wobbling moves the sample point inside each cell every frame and averages with the last frames, so hold the camera still and watch the edges settle. Unreal at 1080p uses one cell per 8 by 8 pixel tile and 64 slices: about 2 million cells, as many as pixels, but each one is written once and read by every pixel along its column.');

const s5 = sb.panel.section('05 · Ground mist with no loop', 'When the fog only depends on height, how much a line of sight crosses is one formula: no steps at all. The price is that the fog can only be one flat colour. No cone, no light shafts, no dark air behind a tree.');
s5.slider('Ground mist thickness', { min: 0, max: 0.3, step: 0.01, value: 0.06, unit: ' per m' }, v => { U.uGround.value = v; dirty(); });
s5.slider('Thinning height', { min: 1, max: 15, step: 0.5, value: 5, unit: ' m' }, v => { U.uH.value = v; dirty(); });
s5.toggle('same thickness at every height (plain distance fog)', false, v => { S.plain = v; U.uPlain.value = v ? 1 : 0; touch(2); hud(); });
const hSeg = s5.segment('Work it out by', [{ value: 0, label: 'the formula, one calculation' }, { value: 1, label: 'stepping' }], 0, v => { S.hMode = +v; U.uHMode.value = S.hMode; touch(2); hud(); });
s5.slider('Steps, if stepping', { min: 2, max: 48, step: 1, value: 12 }, v => { S.hSteps = v; U.uHSteps.value = v; if (S.hMode !== 1) hSeg.set(1); else { touch(2); hud(); } });
s5.note('Switch to stepping with a few steps and look at the ground near the camp: the steps miss the thick layer at the bottom and the mist comes out wrong. The formula gets it exact for free.');

const s6 = sb.panel.section('06 · Clouds that shade themselves', 'A cloud bank sits above the forest. Each step up through it takes a few more short steps toward the moon to find how much cloud is in the way, so a cloud pixel costs the steps along the line times one plus the steps toward the moon.');
s6.toggle('draw the cloud bank', true, v => { S.clouds = v; U.uCloudOn.value = v ? 1 : 0; });
s6.slider('Steps up through the cloud', { min: 4, max: 96, step: 1, value: 32 }, v => { S.cN = v; U.uCN.value = v; cloudReads(); });
s6.slider('Steps toward the moon, at each one', { min: 0, max: 16, step: 1, value: 6 }, v => { S.cM = v; U.uCM.value = v; cloudReads(); });
s6.slider('How much sky the cloud covers', { min: 0, max: 1, step: 0.05, value: 0.55 }, v => { U.uCover.value = v; });
s6.segment('Dimming rule', [{ value: 0, label: 'plain dimming (Beer)' }, { value: 1, label: 'dark edges (Beer-Powder)' }], 1, v => { U.uPowder.value = +v; });
s6.slider('Moon height', { min: 8, max: 80, step: 1, value: 24, unit: ' degrees' }, v => { S.moonEl = v; placeMoon(); });
s6.slider('Moon side', { min: -180, max: 180, step: 5, value: -35, unit: ' degrees' }, v => { S.moonAz = v; placeMoon(); });
s6.button('Look up at the clouds', () => { lookUp(true); camera.position.set(4, 2.5, 6); controls.target.set(-2, 24, -12); });
const cloudRead = s6.readout('looks per cloud pixel');
const cloudReads = () => cloudRead(S.cN + ' times (1 + ' + S.cM + ') = ' + (S.cN * (1 + S.cM)));
cloudReads();
s6.note('Plain dimming makes cloud edges brightest, since the least cloud sits between them and the moon. Real clouds have dark edges and a bright middle; the dark-edges rule fakes that with no extra steps. With 0 steps toward the moon the cloud is a flat grey lump.');

function placeMoon() {
  const el = S.moonEl * Math.PI / 180, az = S.moonAz * Math.PI / 180;
  U.uMoonDir.value.set(Math.sin(az) * Math.cos(el), Math.sin(el), -Math.cos(az) * Math.cos(el));
  moon.position.copy(U.uMoonDir.value).multiplyScalar(60); dirty();
}
placeMoon(); hud();

// ---- per frame: the mast, the light's uniforms, the readouts
const aimW = new THREE.Vector3(); let frameN = 0;
sb.onFrame((dt, t) => {
  msAvg += (dt * 1000 - msAvg) * 0.1; U.uTime.value = t;
  if (camera.position.y < 0.6) camera.position.y = 0.6;
  pole.scale.y = S.mastH; pole.position.y = S.mastH / 2; head.position.y = S.mastH;
  aim.getWorldPosition(aimW); head.lookAt(aimW);
  head.getWorldPosition(U.uSpotPos.value); U.uSpotDir.value.copy(aimW).sub(U.uSpotPos.value).normalize();
  if ((frameN++ & 7) === 0) {
    posRead(mast.position.x.toFixed(1) + ' m, ' + mast.position.z.toFixed(1) + ' m, ' + S.mastH.toFixed(1) + ' m up');
    const looks = S.mode === 0 ? S.steps : S.mode === 1 ? 1 : S.mode === 2 ? (S.hMode ? S.hSteps : 1) : 0;
    looksRead(S.mode === 0 ? S.steps + ' steps, each with a shadow read' : S.mode === 1 ? (S.froxRead ? '8 cell reads, blended' : '1 cell read') : S.mode === 2 ? (S.hMode ? S.hSteps + ' steps' : '1 formula') : '0');
    pixRead(fogW + ' by ' + fogH + ' = ' + (fogW * fogH).toLocaleString());
    const cells = S.cellsX * cellsY * S.slices;
    workRead(S.mode === 1 ? (cells).toLocaleString() + ' cells filled, then 1 read per pixel' : (looks * fogW * fogH / 1e6).toFixed(1) + ' million');
    msRead(msAvg.toFixed(1) + ' ms'); callRead(calls);
    cellRead(S.cellsX + ' by ' + cellsY + ' by ' + S.slices + ' = ' + cells.toLocaleString());
  }
});
sb.start();
</script>
</body>
