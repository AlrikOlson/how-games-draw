<body>
<script type="module">
import { boot, THREE, PAL } from './_kit.js';

const sb = boot({
  slug: 'virtual-texturing', title: 'Virtual Texturing',
  blurb: 'The knight\'s camp sits on a painted one kilometre world, and the graphics card never holds the whole painting. Fly about and watch which small squares of it get loaded, how the one real texture (the cache) fills up and throws pages out, and what goes wrong at the edge of a page.',
  camera: { pos: [14, 7, 16], target: [0.5, 1, -1], near: 0.1, far: 2500 }
});
const scene = sb.scene, camera = sb.camera, R = sb.renderer;
scene.background = null; R.setClearColor(PAL.sky, 1);
R.shadowMap.autoUpdate = false;

// ---- the numbers of this virtual texture
const VT = 32768;        // the painting: texels per side (4 GiB if it were all loaded)
const WORLD = 1024;      // metres per side of the map, so 32 texels per metre
const CACHE = 2048;      // the one real texture in graphics memory: texels per side
let P = 128, B = 4;      // page size and border, in texels
let S = 16, NSLOT = 256, MAXMIP = 8, PPS0 = 256, usableSlots = 256;

// ---- the world: the camp, with its 40 m lawn swapped for the 1 km painted map
const camp = sb.world.camp();
scene.remove(camp.ground); camp.ground.geometry.dispose(); camp.ground.material.dispose();
for (const [x, z, h] of [[-48, -28, 5], [-54, -40, 4.2], [-62, -52, 5.5], [-70, -34, 4.6], [-84, -60, 5], [-96, -46, 4.4], [-24, -70, 4.8], [-36, -84, 5.2]]) sb.world.tree(x, z, h, (x + z) % 2 === 0);
sb.world.rock(-34, -12, 0.8); sb.world.rock(-44, 8, 0.6);

// colours of the painting, written as linear values for the shader
const lin = h => { const c = new THREE.Color(h); return `vec3(${c.r.toFixed(4)}, ${c.g.toFixed(4)}, ${c.b.toFixed(4)})`; };
const C = {
  GRASS_A: lin(0x2b5236), GRASS_B: lin(0x4f8244), FLOOR: lin(0x1f3a26), LEAF: lin(0x3f8f4a), LEAF_LITE: lin(0x6cc06e),
  WATER: lin(0x24568f), WATER_LITE: lin(0x4a8fd0), SAND: lin(0xc2b083), DIRT: lin(0x5a4632), DIRT_LITE: lin(0x8a6c4a),
  COBBLE: lin(0x8a90a0), COBBLE_D: lin(0x545b6a), MORTAR: lin(0x3a3f4a), CHALK: lin(0xf0eadc), STONE_RIM: lin(0x6b7585), FLOORBOARD: lin(0x8a5f36),
  WHEAT: lin(0xd1a94b), PLOUGH: lin(0x5c4030), HEDGE: lin(0x244a2a), WOOD: lin(0x7a4f2a), WOOD_LITE: lin(0xa06a38), NOTHING: lin(0xff2ee6)
};
const CONSTS = Object.entries(C).map(([k, v]) => `const vec3 ${k} = ${v};`).join('\n') + '\nconst vec2 FIRE_P = vec2(513.2, 509.8);\n';

// ---- the painter: draws any square of the painting at any level of detail, on demand
const PAINT_FRAG = `
precision highp float;
varying vec2 vUv;
uniform vec3 uRect;      // where this slot's square sits on the painting: u0, v0, size (0 to 1)
uniform float uTexel;    // how many metres one texel of this page covers
${CONSTS}
float hash(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f); return mix(mix(hash(i), hash(i+vec2(1.0,0.0)), f.x), mix(hash(i+vec2(0.0,1.0)), hash(i+vec2(1.0,1.0)), f.x), f.y); }
// detail smaller than a texel fades to its average, so a blurry page is a fair blurry copy and not a noisy one
float fade(float L, float ts){ return 1.0 - smoothstep(0.2*L, 0.8*L, ts); }
float oct(vec2 p, float L, float ts){ return (vnoise(p / L) - 0.5) * fade(L, ts); }
float riverX(float y){ return 452.0 + 40.0*sin(y*0.0123 + 1.0) + 14.0*sin(y*0.031 + 2.0); }
float riverSlope(float y){ return 40.0*0.0123*cos(y*0.0123 + 1.0) + 14.0*0.031*cos(y*0.031 + 2.0); }
float roadY(float x){ return 512.0 + 6.0*sin(x*0.015); }
float roadX(float y){ return 512.0 + 6.0*sin(y*0.017 + 1.0); }
vec2 blobs(vec2 p, float spacing, float jitter, float rmin, float rmax) {
  vec2 g = p / spacing, gi = floor(g); float best = 9.0, id = 0.0;
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    vec2 cell = gi + vec2(float(i), float(j));
    vec2 ctr = cell + 0.5 + (vec2(hash(cell), hash(cell + 7.1)) - 0.5) * jitter;
    float rad = mix(rmin, rmax, hash(cell + 3.3)) / spacing;
    float d = length(g - ctr) / rad;
    if (d < best) { best = d; id = hash(cell + 9.7); }
  }
  return vec2(best, id);
}
vec3 paint(vec2 p, float ts) {
  vec2 c = p - vec2(512.0);
  float r = length(c);
  float aa = max(ts, 0.05);
  float g = 0.5 + 0.7*oct(p, 180.0, ts) + 0.5*oct(p, 45.0, ts) + 0.35*oct(p, 12.0, ts) + 0.25*oct(p, 3.0, ts) + 0.2*oct(p, 0.8, ts);
  vec3 col = mix(GRASS_A, GRASS_B, clamp(g, 0.0, 1.0));
  float big = vnoise(p / 300.0 + 3.7), mid = vnoise(p / 90.0 + 1.3);
  float sl = riverSlope(p.y);
  float dRiver = abs(p.x - riverX(p.y)) / sqrt(1.0 + sl*sl);
  float dRoadEW = abs(p.y - roadY(p.x));
  float dRoadN = c.y > 0.0 ? abs(p.x - roadX(p.y)) : 1e4;
  float dRoad = min(dRoadEW, dRoadN);
  float forest = smoothstep(0.42, 0.55, big + 0.3*(mid - 0.5) + 0.3*clamp((-c.x + c.y) / 350.0, -1.0, 1.0));
  forest *= smoothstep(48.0, 75.0, r) * smoothstep(12.0, 24.0, dRiver) * smoothstep(3.0, 7.0, dRoad);
  float fields = smoothstep(0.42, 0.55, vnoise(p / 160.0 + 8.1) + 0.35*clamp((c.x - c.y) / 350.0, -1.0, 1.0));
  fields *= smoothstep(55.0, 90.0, r) * (1.0 - forest) * smoothstep(14.0, 26.0, dRiver) * smoothstep(3.0, 7.0, dRoad);
  if (fields > 0.001) {
    vec2 plot = floor(p / 48.0); vec2 pf = fract(p / 48.0) * 48.0;
    float hedge = 1.0 - smoothstep(0.6, 0.6 + aa, min(min(pf.x, pf.y), min(48.0 - pf.x, 48.0 - pf.y)));
    float kind = hash(plot + 2.2);
    vec3 crop = kind < 0.35 ? WHEAT : kind < 0.65 ? PLOUGH : GRASS_B;
    crop = mix(crop, crop * 0.7, (0.5 + 0.5*sin(p.x * 7.85)) * fade(0.8, ts) * 0.6);
    crop *= 0.85 + 0.3*vnoise(p / 6.0) * fade(6.0, ts);
    col = mix(col, mix(crop, HEDGE, hedge), fields);
  }
  if (forest > 0.001) {
    vec2 b = blobs(p, 3.6, 0.9, 1.1, 1.9);
    vec3 canopy = mix(LEAF_LITE, LEAF, clamp(b.x*b.x, 0.0, 1.0)) * (0.8 + 0.4*b.y);
    float inside = 1.0 - smoothstep(1.0 - aa*0.6, 1.0 + aa*0.6, b.x);
    vec3 treeCol = mix(FLOOR, canopy, inside);
    vec3 flatCol = mix(FLOOR, LEAF, 0.55) * (0.9 + 0.2*vnoise(p / 9.0));
    col = mix(col, mix(flatCol, treeCol, fade(3.6, ts)), forest);
  }
  {
    float road = 1.0 - smoothstep(1.6, 1.6 + aa, dRoad);
    float rut = (1.0 - smoothstep(0.25, 0.25 + aa, abs(dRoad - 0.9))) * fade(0.5, ts);
    vec3 roadCol = mix(DIRT, DIRT_LITE, 0.3 + 0.4*oct(p, 2.0, ts) + rut*0.5);
    col = mix(col, roadCol, road);
  }
  if (r < 60.0) {
    vec2 cb = blobs(p, 0.42, 0.5, 0.17, 0.24);
    vec3 stone = mix(COBBLE_D, COBBLE, 0.4 + 0.6*cb.y);
    float mortar = smoothstep(0.8, 0.8 + aa*4.0, cb.x);
    vec3 cobbles = mix(mix(stone, MORTAR, mortar), mix(COBBLE_D, COBBLE, 0.5), 1.0 - fade(0.42, ts));
    float square = 1.0 - smoothstep(15.0, 15.0 + aa, r);
    float path = 1e4;
    for (int k = 0; k < 6; k++) { float a = float(k) * 1.0472 + 0.4; vec2 dir = vec2(cos(a), sin(a)); float along = dot(c, dir); float across = abs(dot(c, vec2(-dir.y, dir.x))); if (along > 0.0 && along < 30.0) path = min(path, across); }
    float paths = 1.0 - smoothstep(1.2, 1.2 + aa, path);
    float trodden = 1.0 - smoothstep(20.0, 50.0, r);
    col = mix(col, mix(col, DIRT, 0.35), trodden * (0.6 + 0.4*vnoise(p / 3.0)));
    col = mix(col, cobbles, max(square, paths));
    for (int k = 0; k < 6; k++) { float a = float(k) * 1.0472 + 0.4; vec2 ctr = vec2(cos(a), sin(a)) * 27.0; vec2 q = abs(c - ctr); float inside = 1.0 - smoothstep(0.0, aa, max(q.x - 4.5, q.y - 3.5)); float rim = 1.0 - smoothstep(0.0, aa, max(q.x - 5.1, q.y - 4.1)); col = mix(col, STONE_RIM, rim); col = mix(col, FLOORBOARD, inside); }
    float ring = 1.0 - smoothstep(0.12, 0.12 + aa, abs(length(p - FIRE_P) - 3.5));
    col = mix(col, CHALK, ring * fade(0.3, ts));
  }
  {
    float wobble = 1.5 * oct(p, 9.0, 0.0);
    float water = 1.0 - smoothstep(6.5 + wobble, 6.5 + wobble + aa, dRiver);
    float sand = 1.0 - smoothstep(9.5 + wobble, 9.5 + wobble + aa*2.0, dRiver);
    vec3 waterCol = mix(WATER, WATER_LITE, 0.5 + 0.8*oct(p, 6.0, ts) + 0.6*oct(p, 1.5, ts));
    col = mix(col, SAND, sand);
    col = mix(col, waterCol, water);
    float bridge = (1.0 - smoothstep(2.2, 2.2 + aa, dRoadEW)) * (1.0 - smoothstep(11.0, 11.0 + aa, dRiver));
    float plank = (0.5 + 0.5*sin(p.x * 20.9)) * fade(0.3, ts);
    vec3 bridgeCol = mix(WOOD, WOOD_LITE, 0.3 + 0.4*plank + 0.3*hash(vec2(floor(p.x / 0.3), 1.0)) * fade(0.3, ts));
    col = mix(col, bridgeCol, bridge);
  }
  return col;
}
void main() {
  vec2 uv0 = uRect.xy + vUv * uRect.z;
  float tsUV = uTexel / ${WORLD}.0;
  vec3 acc = vec3(0.0);
  for (int j = 0; j < 2; j++) for (int i = 0; i < 2; i++) {
    vec2 off = (vec2(float(i), float(j)) - 0.5) * 0.5 * tsUV;
    acc += paint((uv0 + off) * ${WORLD}.0, uTexel);
  }
  gl_FragColor = vec4(acc * 0.25, 1.0);
}`;
const QUAD_VERT = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';
const painterMat = new THREE.ShaderMaterial({ uniforms: { uRect: { value: new THREE.Vector3() }, uTexel: { value: 1 } }, vertexShader: QUAD_VERT, fragmentShader: PAINT_FRAG, depthTest: false, depthWrite: false });
const quadGeo = new THREE.PlaneGeometry(2, 2);
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const painterScene = new THREE.Scene(); painterScene.add(new THREE.Mesh(quadGeo, painterMat));

// ---- the physical cache: one 2048² texture, no mip chain, filled one slot at a time
const cacheRT = new THREE.WebGLRenderTarget(CACHE, CACHE, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false, generateMipmaps: false, type: THREE.UnsignedByteType });
cacheRT.texture.wrapS = cacheRT.texture.wrapT = THREE.ClampToEdgeWrapping;
function clearCache() { cacheRT.scissorTest = false; cacheRT.viewport.set(0, 0, CACHE, CACHE); R.setRenderTarget(cacheRT); R.setClearColor(0x000000, 1); R.clear(); R.setRenderTarget(null); }
function setCacheAniso(n) {
  const gl = R.getContext(), ext = R.extensions.get('EXT_texture_filter_anisotropic');
  const tex = R.properties.get(cacheRT.texture).__webglTexture; if (!ext || !tex) return;
  R.state.bindTexture(gl.TEXTURE_2D, tex); gl.texParameterf(gl.TEXTURE_2D, ext.TEXTURE_MAX_ANISOTROPY_EXT, Math.min(n, R.capabilities.getMaxAnisotropy() || 1));
}

// ---- the lookup every ground pixel does: page table read, then one cache read
const U = {
  uPageTable: { value: null }, uPageP: { value: P }, uBorder: { value: B }, uMaxMip: { value: MAXMIP }, uPagesAt0: { value: PPS0 },
  uBias: { value: 0 }, uAniso: { value: 4 }, uCacheSize: { value: CACHE }, uVTSize: { value: VT },
  uView: { value: 0 }, uLines: { value: 0 }, uSeamView: { value: 0 }
};
const VT_GLSL = `
uniform sampler2D uPageTable;
uniform float uPageP, uBorder, uMaxMip, uPagesAt0, uBias, uAniso, uCacheSize, uVTSize;
// how many texels one screen pixel covers decides the mip; with anisotropy the thin axis of the footprint decides, capped
float vtLod(vec2 dx, vec2 dy) {
  dx *= uVTSize; dy *= uVTSize;
  float lx = length(dx), ly = length(dy);
  float rmax = max(lx, ly), rmin = max(min(lx, ly), 1e-6);
  return log2(max(rmax / uAniso, rmin)) + uBias;
}`;
const SAMPLE_GLSL = `
uniform float uView, uLines, uSeamView;
const vec3 NOTHING_L = ${C.NOTHING};
struct VTS { vec3 color; float mReq; float mRes; vec2 slot; float has; float seam; float edge; };
VTS vtSample(vec2 uv, vec2 dx, vec2 dy) {
  VTS s;
  s.mReq = clamp(floor(vtLod(dx, dy)), 0.0, uMaxMip);
  vec4 e = textureLod(uPageTable, uv, s.mReq);          // one table read at the mip the pixel wants
  s.has = e.a > 0.5 ? 1.0 : 0.0;
  s.mRes = floor(e.b * 255.0 + 0.5);                     // the mip that is really there
  s.slot = floor(e.rg * 255.0 + 0.5);
  float scale = uPagesAt0 / exp2(s.mRes);
  float inner = uPageP - 2.0 * uBorder;
  vec2 inPage = fract(uv * scale);
  vec2 t = uBorder + inPage * inner;                     // texels from the slot's edge
  vec2 uvPhys = (s.slot * uPageP + t) / uCacheSize;
  float g = scale * inner / uCacheSize;                  // the derivatives must be scaled the same way
  vec2 pdx = dx * g, pdy = dy * g;
  s.color = s.has > 0.5 ? textureGrad(map, uvPhys, pdx, pdy).rgb : NOTHING_L;
  float px = length(pdx) * uCacheSize, py = length(pdy) * uCacheSize;
  float pmax = max(px, py), pmin = max(min(px, py), 1e-6);
  float reach = 0.5 + 0.5 * min(pmax, uAniso * pmin);   // half a texel for bilinear, up to half the capped long axis for aniso taps
  s.seam = (any(lessThan(t - vec2(reach), vec2(0.0))) || any(greaterThan(t + vec2(reach), vec2(uPageP)))) ? 1.0 : 0.0;
  vec2 q = uv * (uPagesAt0 / exp2(s.mReq)); vec2 fq = fract(q); vec2 fw = fwidth(q);
  vec2 dEdge = min(fq, 1.0 - fq);
  s.edge = 1.0 - smoothstep(0.0, 1.0, min(dEdge.x / max(fw.x * 1.2, 1e-5), dEdge.y / max(fw.y * 1.2, 1e-5)));
  return s;
}
vec3 hsv(float h, float s, float v) { vec3 p = abs(fract(vec3(h) + vec3(0.0, 2.0/3.0, 1.0/3.0)) * 6.0 - 3.0); return v * mix(vec3(1.0), clamp(p - 1.0, 0.0, 1.0), s); }
vec3 mipColor(float m) { return hsv(0.68 - 0.68 * m / uMaxMip, 0.8, 0.95); }
vec3 slotColor(vec2 sl) { return hsv(fract(dot(sl, vec2(0.618, 0.387)) * 3.1), 0.65, 0.9); }
vec3 blurColor(VTS s) { if (s.has < 0.5) return vec3(1.0, 0.18, 0.9); float d = s.mRes - s.mReq; return d < 0.5 ? vec3(0.35, 0.83, 0.54) : d < 1.5 ? vec3(0.95, 0.83, 0.25) : d < 2.5 ? vec3(0.95, 0.64, 0.25) : vec3(0.94, 0.36, 0.36); }`;
const MAP_INJECT = `
vec2 vtdx = dFdx(vMapUv), vtdy = dFdy(vMapUv);
VTS vs = vtSample(vMapUv, vtdx, vtdy);
diffuseColor.rgb *= vs.color;`;
const VIEW_INJECT = `
#include <colorspace_fragment>
if (uView > 0.5) {
  vec3 vc = uView < 1.5 ? mipColor(vs.mReq) : uView < 2.5 ? slotColor(vs.slot) : blurColor(vs);
  if (vs.has < 0.5 && uView < 2.5) vc = vec3(1.0, 0.18, 0.9);
  gl_FragColor.rgb = mix(gl_FragColor.rgb, vc, 0.72);
  if (uView < 2.5) gl_FragColor.rgb = mix(gl_FragColor.rgb, vec3(1.0), vs.edge * 0.6);
}
if (uLines > 0.5) gl_FragColor.rgb = mix(gl_FragColor.rgb, vec3(1.0), vs.edge * 0.85);
if (uSeamView > 0.5 && vs.seam > 0.5) gl_FragColor.rgb = mix(gl_FragColor.rgb, vec3(1.0, 0.15, 0.15), 0.9);`;

const groundMat = new THREE.MeshLambertMaterial({ color: 0xffffff, map: cacheRT.texture });
groundMat.onBeforeCompile = shader => {
  Object.assign(shader.uniforms, U);
  shader.fragmentShader = shader.fragmentShader
    .replace('#include <clipping_planes_pars_fragment>', '#include <clipping_planes_pars_fragment>\n' + VT_GLSL + SAMPLE_GLSL)
    .replace('#include <map_fragment>', MAP_INJECT)
    .replace('#include <colorspace_fragment>', VIEW_INJECT);
};
groundMat.customProgramCacheKey = () => 'vt-ground';
const ground = new THREE.Mesh(new THREE.PlaneGeometry(WORLD, WORLD, 1, 1), groundMat);
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; ground.name = 'ground'; scene.add(ground);

// ---- the feedback pass: the ground writes the page id it wants, everything else writes nothing
const fbMat = new THREE.ShaderMaterial({ uniforms: U, vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: VT_GLSL + `
varying vec2 vUv;
void main() {
  float lod = vtLod(dFdx(vUv), dFdy(vUv)) - 3.0;       // this picture is 1/8 of the screen, so the derivatives are 8 times too big
  float m = clamp(floor(lod), 0.0, uMaxMip);
  float pa = uPagesAt0 / exp2(m);
  vec2 pg = min(floor(vUv * pa), vec2(pa - 1.0));
  gl_FragColor = vec4(pg / 255.0, m / 255.0, 1.0);      // page x, page y, mip; alpha 1 means a page was asked for
}` });
const blankMat = new THREE.ShaderMaterial({ vertexShader: 'void main(){ gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }', fragmentShader: 'void main(){ gl_FragColor = vec4(0.0); }' });
const matList = []; scene.traverse(o => { if (o.isMesh) matList.push([o, o.material, o === ground ? fbMat : blankMat]); });
function swapMats(fb) { for (const [m, real, f] of matList) m.material = fb ? f : real; }
let fbRT = null, fbW = 0, fbH = 0, fbBuf = null, fbInFlight = false, fbReady = false, fbStart = 0, fbAge = 0;
function ensureFeedbackTarget() {
  const gl = R.getContext(); const w = Math.max(1, gl.drawingBufferWidth >> 3), h = Math.max(1, gl.drawingBufferHeight >> 3);
  if (fbRT && fbW === w && fbH === h) return;
  if (fbRT) fbRT.dispose();
  fbRT = new THREE.WebGLRenderTarget(w, h, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true, generateMipmaps: false, type: THREE.UnsignedByteType });
  fbW = w; fbH = h; fbBuf = new Uint8Array(w * h * 4); fbReady = false; fbInFlight = false;
}
function startReadback() {
  if (fbInFlight) return; fbInFlight = true; fbStart = frame; const buf = fbBuf, w = fbW, h = fbH;
  const done = () => { fbInFlight = false; if (buf === fbBuf) { fbReady = true; fbAge = frame - fbStart; } };
  try {
    if (R.readRenderTargetPixelsAsync) R.readRenderTargetPixelsAsync(fbRT, 0, 0, w, h, buf).then(done, () => { fbInFlight = false; });
    else { R.readRenderTargetPixels(fbRT, 0, 0, w, h, buf); done(); }
  } catch (e) { try { R.readRenderTargetPixels(fbRT, 0, 0, w, h, buf); done(); } catch (e2) { fbInFlight = false; } }
}

// ---- the page table and the loader, on the CPU
let ptMips = [], ptTex = null, offsets = [], totalPages = 0, pageM, pageX, pageY, pageState, pageSlot, touch;
let slotPage, slotUsed, slotPin, slotArrived, slotTex, slotData;
let queue = [], pending = [], pendingPos = 0, ptDirty = false;
let frame = 0, budget = 8, latency = 3, pinOn = true, lastFeedbackFrame = -1;
let stat = { wanted: 0, hits: 0, blur: 0, groundTexels: 0, loads: 0, evictions: 0, thrash: 0, resident: 0 };
const pidx = (m, x, y) => offsets[m] + y * (PPS0 >> m) + x;
function buildVT(pageSize) {
  P = pageSize; S = CACHE / P; NSLOT = S * S; PPS0 = VT / P; MAXMIP = Math.round(Math.log2(PPS0));
  ptMips = []; offsets = []; totalPages = 0;
  for (let m = 0; m <= MAXMIP; m++) { const n = PPS0 >> m; offsets.push(totalPages); totalPages += n * n; ptMips.push({ data: new Uint8Array(n * n * 4), width: n, height: n }); }
  pageM = new Uint8Array(totalPages); pageX = new Uint8Array(totalPages); pageY = new Uint8Array(totalPages);

  sb.hud('view', viewName === 'page' ? 'colour = the mip each pixel asks for, blue sharp to red blurry, lines = page edges' : viewName === 'slot' ? 'colour = the cache slot each pixel reads: map neighbours are cache strangers' : viewName === 'blur' ? 'green = got the page it asked for, yellow to red = a blurrier stand-in, pink = nothing loaded' : 'the painting, read through the page table and the cache');
}

// ---- labels and go
sb.label('the village square', camp.fire).off.set(0, 1.6, 0);
sb.label('the river', new THREE.Vector3(-37.6, 0, 6), 'blue').off.set(0, 1.5, 0);
sb.label('the forest', new THREE.Vector3(-150, 0, -160), 'amber').off.set(0, 6, 0);
sb.label('the fields', new THREE.Vector3(180, 0, 160), 'amber').off.set(0, 6, 0);
buildVT(128); hud();
sb.start();
