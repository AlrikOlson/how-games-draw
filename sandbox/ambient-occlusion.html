      'vec2 aoUv = gl_FragCoord.xy * uScreenInv; float saoG = clamp(texture2D(tAO, aoUv).r, 0.0, 1.0); float saoT = clamp(texture2D(tTruth, aoUv).r, 0.0, 1.0); float useT = uTracedOn * step(uSplitPx, gl_FragCoord.x); float sao = pow(mix(saoG, saoT, useT), uAOPow); if (uAOMode >= 1) reflectedLight.indirectDiffuse *= sao; if (uAOMode == 2) reflectedLight.directDiffuse *= sao; reflectedLight.indirectDiffuse += vec3(1.0, 0.08, 0.04) * (smoothstep(0.06, 0.3, abs(saoG - saoT)) * uDiffOn * 0.8);'); };

// ---- render targets
const mkRT = (w, h, linear) => new THREE.WebGLRenderTarget(w, h, { type: THREE.HalfFloatType, minFilter: linear ? THREE.LinearFilter : THREE.NearestFilter, magFilter: linear ? THREE.LinearFilter : THREE.NearestFilter, depthBuffer: false });
let gbuf = null, rtRaw = null, rtBlur = null, hist = [null, null], truth = [null, null], curH = 0, curT = 0, rtErr = new THREE.WebGLRenderTarget(48, 48, { depthBuffer: false });
const errPx = new Uint8Array(48 * 48 * 4); const size = new THREE.Vector2();
function ensureTargets() {
  renderer.getDrawingBufferSize(size); const w = Math.max(2, size.x | 0), h = Math.max(2, size.y | 0); const aw = Math.max(2, Math.round(w * aoScale)), ah = Math.max(2, Math.round(h * aoScale)); const tw = w, th = h;

// ---- state
let view = 'picture', stage = 'final', aoScale = 1, method = 'ssao', sliding = false, histValid = false, truthDirty = true, truthFrames = 0, frame = 0, sunOn = true;
let compare = 'split', splitF = 0.5, timeOfDay = 'day';
// the sky, and three kinds of daylight: the same numbers go to the kit's lights and to the sky
const SRGBFN = `vec3 srgb3(vec3 c) { c = clamp(c, 0.0, 1.0); return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c)); }`;
const skyU = { uInvPV: { value: new THREE.Matrix4() }, uCamPos: { value: new THREE.Vector3() }, uSunDir: { value: new THREE.Vector3() }, uSunCol: { value: new THREE.Vector3() }, uSkyScale: { value: new THREE.Vector3(7, 8, 11) } };
const skyMat = new THREE.ShaderMaterial({ glslVersion: GL3, uniforms: skyU, vertexShader: VS, depthTest: false, depthWrite: false, fragmentShader: `precision highp float; in vec2 vUv; out vec4 o; uniform mat4 uInvPV; uniform vec3 uCamPos, uSunDir, uSunCol, uSkyScale; ${SRGBFN}

const skyScene = new THREE.Scene(); skyScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), skyMat)); const invPV = new THREE.Matrix4();
const TIMES = {
  day: { sunPos: [14, 18, 8], sunCol: 0xffe2b0, sunI: 3.2, hemiSky: 0x8fa8c8, hemiGnd: 0x2a3a2a, hemiI: 0.9, sky: [7, 8, 11] },
  overcast: { sunPos: [14, 18, 8], sunCol: 0xffe2b0, sunI: 0, hemiSky: 0xc4cad2, hemiGnd: 0x3a3f3a, hemiI: 1.5, sky: [12, 11.5, 11] },
  sunset: { sunPos: [22, 4.5, -8], sunCol: 0xffa050, sunI: 2.8, hemiSky: 0x7a86ad, hemiGnd: 0x3a2e24, hemiI: 0.55, sky: [7, 3.2, 1.6] }
};
function setTime(name) {
  const t = TIMES[name]; timeOfDay = name; const sun = sb.lights.sun, hemi = sb.lights.hemi;
  sun.position.set(...t.sunPos); sun.color.setHex(t.sunCol); sun.intensity = t.sunI; hemi.color.setHex(t.hemiSky); hemi.groundColor.setHex(t.hemiGnd); hemi.intensity = t.hemiI;

setTime('day');
const splitLine = document.createElement('div'); splitLine.style.cssText = 'position:absolute;top:0;bottom:0;width:2px;background:rgba(242,217,153,0.9);pointer-events:none;display:none;'; sb.stage.appendChild(splitLine);
const prevView = new THREE.Matrix4(), prevProj = new THREE.Matrix4(), lastView = new THREE.Matrix4(), lastProj = new THREE.Matrix4();
const flame = scene.getObjectByName('flame'); const sliderHome = slider.position.x;

// ---- 1 the true answer
const s1 = sb.panel.section('01 · The true answer', 'From every point on every surface, fire rays up and count how many get away. That share of open sky is the answer every trick below is chasing. It is traced against the real shapes here, not the depth photo, and it adds up over frames while the camera holds still.');
s1.segment('Compare', [{ value: 'game', label: 'the guess' }, { value: 'split', label: 'split' }, { value: 'truth', label: 'the true answer' }, { value: 'diff', label: 'where they differ' }], 'split', v => { compare = v; apply(); });
s1.slider('Where the true answer begins', { min: 0, max: 100, step: 1, value: 50, unit: ' %' }, x => { splitF = x / 100; });
s1.segment('Daylight', [{ value: 'day', label: 'sunny' }, { value: 'overcast', label: 'overcast' }, { value: 'sunset', label: 'sunset' }], 'day', x => { setTime(x); sb.lights.sun.visible = sunOn; apply(); });
const showSeg = s1.segment('Show', [{ value: 'picture', label: 'the picture' }, { value: 'depth', label: 'the depth photo' }, { value: 'ao', label: 'the AO term' }, { value: 'truth', label: 'the true answer' }, { value: 'error', label: 'error against the truth' }], 'picture', v => { view = v; apply(); });
s1.slider('Rays per point, each frame', { min: 4, max: 64, step: 4, value: 16 }, v => { truthMat.uniforms.uRays.value = v; truthDirty = true; });
s1.slider('How far a ray, a dot or a march goes (radius)', { min: 0.3, max: 3, step: 0.1, value: 1.5, unit: ' m' }, v => { aoMat.uniforms.uRadius.value = v; truthDirty = true; histValid = false; });
s1.note('Overcast is the honest test: no sun, only sky light, so all the grounding in the picture comes from AO. Pick "where they differ" and every pixel where the guess is off turns red: under the shelf, at the frame edge, wherever the depth photo cannot see.');
const raysRead = s1.readout('rays per point so far');
const errRead = s1.readout('average error, whole screen');

// ---- 2 ssao
const s2 = sb.panel.section('02 · SSAO: guessing from the depth photo', 'The GPU keeps a photo of how far away every pixel is. Scatter test dots around a point and ask the photo whether each dot is buried inside something. No rays, no shapes, only lookups.');
const dotsS = s2.slider('Test dots per pixel', { min: 4, max: 64, step: 4, value: 16 }, v => { aoMat.uniforms.uN.value = v; useMethod('ssao'); });
s2.segment('Where the dots go', [{ value: 'hemi', label: 'a half dome, facing out' }, { value: 'sphere', label: 'a full ball' }], 'hemi', v => { aoMat.uniforms.uSphere.value = v === 'sphere' ? 1 : 0; useMethod('ssao'); });
s2.toggle('ignore a blocker far in front of the point (range check)', true, v => { aoMat.uniforms.uRange.value = v ? 1 : 0; useMethod('ssao'); });
s2.slider('Lift on each dot so a surface cannot block itself (bias)', { min: 0, max: 0.2, step: 0.005, value: 0.03, unit: ' m' }, v => { aoMat.uniforms.uBias.value = v; useMethod('ssao'); });
s2.note('A full ball puts half the dots under the floor, so open ground reads half dark. Turn the range check off and the far wall darkens the knight standing in front of it. Drop the bias to zero and flat floors go speckled.');
const lookRead = s2.readout('photo lookups per pixel');

// ---- 3 skylines
const s3 = sb.panel.section('03 · Skylines: march out, keep the steepest angle', 'Instead of scattered dots, walk away from the point along the photo in a few directions and remember the highest thing seen. Everything under that skyline is blocked. Smoother for the same number of lookups.');
const methodSeg = s3.segment('How the AO term is made', [{ value: 'ssao', label: 'test dots (SSAO)' }, { value: 'gtao', label: 'skyline march (GTAO)' }], 'ssao', v => { method = v; aoMat.uniforms.uMethod.value = v === 'gtao' ? 1 : 0; histValid = false; apply(); });
const stepsS = s3.slider('Steps each way', { min: 2, max: 16, step: 1, value: 8 }, v => { aoMat.uniforms.uSteps.value = v; useMethod('gtao'); });
const dirsS = s3.slider('Directions per pixel', { min: 1, max: 4, step: 1, value: 2 }, v => { aoMat.uniforms.uDirs.value = v; useMethod('gtao'); });
s3.note('Compare the AO term view with the same lookups in both methods: 16 dots against 2 directions of 4 steps. The march is less speckled and its creases stay sharp.');

// ---- 4 noise, blur, history
const s4 = sb.panel.section('04 · Noise, blur, history', 'Few lookups means noise. Make the noise a known 4 by 4 pattern, blur it away without crossing edges, then average with the last frames, and a dozen dots do the work of hundreds.');
s4.segment('Stage of the AO term to show', [{ value: 'raw', label: 'raw' }, { value: 'blur', label: 'blurred' }, { value: 'final', label: 'after history' }], 'final', v => { stage = v; view = 'ao'; showSeg.set('ao', false); apply(); });
s4.segment('Noise pattern', [{ value: 'none', label: 'same dots every pixel' }, { value: 'tile', label: '4 by 4 random turn' }], 'tile', v => { aoMat.uniforms.uNoiseOn.value = v === 'tile' ? 1 : 0; histValid = false; });
s4.segment('Blur', [{ value: 0, label: 'none' }, { value: 1, label: 'plain 4 by 4' }, { value: 2, label: 'stops at edges (bilateral)' }], 2, v => { blurMat.uniforms.uMode.value = +v; });
s4.slider('Depth jump that counts as an edge', { min: 0.02, max: 1, step: 0.02, value: 0.2, unit: ' m' }, v => { blurMat.uniforms.uSigma.value = v; });
s4.toggle('average with the last frames (temporal accumulation)', true, v => { histMat.uniforms.uOn.value = v ? 1 : 0; histValid = false; apply(); });
s4.slider('Share of each new frame that goes into the history', { min: 0.02, max: 1, step: 0.02, value: 0.1, fmt: v => (+v).toFixed(2) }, v => { histMat.uniforms.uAlpha.value = v; });
s4.toggle('throw the history away where the depth changed', true, v => { histMat.uniforms.uReject.value = v ? 1 : 0; });
s4.toggle('slide a crate back and forth', false, v => { sliding = v; if (!v) { slider.position.x = sliderHome; rebuildPrims(); } });
s4.note('Slide the crate with the throw-away switch off and a ghost of its shadow trails behind it. Switch it back on and the trail vanishes, at the cost of fresh noise where it moved.');

// ---- 5 beyond the photo
const s5 = sb.panel.section('05 · What the depth photo cannot see', 'The photo stores one surface per pixel, the nearest, and nothing outside the frame. Under a shelf the photo thinks it is solid; a wall just past the edge of the screen does not exist.');
s5.toggle('a shelf over the steps', true, v => { shelf.visible = v; for (const l of shelfLegs) l.visible = v; shelfLabel.hide(!v); rebuildPrims(); histValid = false; });
s5.button('Look straight down, the right wall just off screen', () => { camera.position.set(-0.8, 9, -1); sb.controls.target.set(-0.8, 0, -1.4); truthDirty = true; });
s5.button('Back to the overview', () => { camera.position.set(3.5, 7.5, 12); sb.controls.target.set(0.2, 0.6, -1.2); truthDirty = true; });
s5.note('Pick the error view. Looking straight down, the floor and steps under the shelf light up as wrong, and so does the strip of floor along the right edge: the wall next to it is outside the photo, so the floor stays bright. Orbit a little and the error moves with the frame. The true answer traces the real shapes, so it has no blind spots.');

// ---- 6 where the darkening goes
const s6 = sb.panel.section('06 · Where the darkening goes', 'AO estimates how much of the soft, from-everywhere light a point misses. The sun already casts its own shadows, so darkening it again is a mistake many games still make.');
s6.segment('Apply the AO term to', [{ value: 1, label: 'only the soft light' }, { value: 2, label: 'everything (the common mistake)' }, { value: 0, label: 'nothing' }], 1, v => { aoMode.value = +v; view = 'picture'; showSeg.set('picture', false); apply(); });
s6.slider('How strong', { min: 0.5, max: 4, step: 0.1, value: 2 }, v => { aoPow.value = v; });
s6.toggle('the sun', true, v => { sunOn = v; sb.lights.sun.visible = v; });
s6.toggle('compute AO at half the pixels', false, v => { aoScale = v ? 0.5 : 1; });
s6.note('Turn the sun off and the cellar is lit only by the soft sky light, so AO does all the grounding. Turn it back on with everything darkened and a sunlit corner goes dark twice.');
const msRead = s6.readout('milliseconds per frame');

function useMethod(m) { if (method !== m) methodSeg.set(m); }
function apply() {

  sb.hud('mode', view === 'picture' ? (aoMode.value === 0 ? 'the picture with no AO at all' : 'the picture, ' + dark + ' · ' + cmp)
    : view === 'depth' ? 'the depth photo the guesses read: bright is near, dark is far' : view === 'ao' ? 'the AO term from the ' + (method === 'ssao' ? 'test dots' : 'skyline march') + ', ' + (stage === 'raw' ? 'raw and noisy' : stage === 'blur' ? 'after the blur' : 'after the blur and the last frames') + ': white is open sky, dark is buried' + (compare === 'split' ? ' · right of the line: the true answer' : '')
    : view === 'truth' ? 'the true answer, traced against the real shapes, adding up over frames' : 'error of the AO term against the truth: blue is small, amber is wrong, white is very wrong');
  errRead(view === 'error' ? '…' : 'pick the error view');

rebuildPrims(); apply();

// ---- the frame
let msAvg = 0, lastNow = 0;
const drift = (a, b) => { let s = 0; for (let i = 0; i < 16; i++) s += Math.abs(a.elements[i] - b.elements[i]); return s; };
sb.onFrame((dt, t) => {
  if (sliding) { slider.position.x = sliderHome + Math.sin(t * 1.3) * 1.6; slider.updateMatrixWorld(); const i = primOf.get(slider); if (i != null) primA[i].set(slider.position.x, slider.position.y, slider.position.z, 0); truthDirty = true; }
  flame.visible = view === 'picture';
  const now = performance.now(); if (lastNow) msAvg += ((now - lastNow) - msAvg) * 0.08; lastNow = now; msRead(msAvg.toFixed(1) + ' ms');

});
sb.onRender((scene, camera, renderer) => {

  quad.material = histMat; renderer.setRenderTarget(nextH); renderer.render(quadScene, quadCam); curH = 1 - curH;
  prevView.copy(camera.matrixWorldInverse); prevProj.copy(camera.projectionMatrix); lastView.copy(camera.matrixWorldInverse); lastProj.copy(camera.projectionMatrix);

    }

    aoTex.value = nextH.texture; truthTex.value = truth[curT].texture; splitPx.value = split * gbuf.width; tracedOn.value = compare === 'split' || compare === 'truth' ? 1 : 0; diffOn.value = compare === 'diff' ? 1 : 0;
    renderer.shadowMap.needsUpdate = true; renderer.render(scene, camera);
  } else { showMat.uniforms.tG.value = gbuf.texture; showMat.uniforms.tAO.value = term.texture; showMat.uniforms.tTruth.value = truth[curT].texture; showMat.uniforms.uMode.value = view === 'depth' ? 1 : view === 'ao' ? 2 : view === 'truth' ? 3 : 4; showMat.uniforms.uSplit.value = view === 'ao' && compare !== 'diff' ? split : 2; quad.material = showMat; renderer.render(quadScene, quadCam); }
  const lineOn = compare === 'split' && (view === 'picture' || view === 'ao'); splitLine.style.display = lineOn ? 'block' : 'none'; splitLine.style.left = (split * 100) + '%';
});
sb.start();
</script>
