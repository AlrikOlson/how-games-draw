<script type="module">
import { boot, THREE, PAL } from './_kit.js';

// The road at night, drawn through the real depth buffer of this graphics card. The scene is rendered into a
// texture whose depth attachment is 16-bit, 24-bit or 32-bit float (the reader's pick), and the direction of the
// buffer (standard, reversed, logarithmic) is a renderer option, so changing it rebuilds the page in place.

const CODES = { '16': 65535, '24': 16777215 };
const FMT_NAME = { '16': '16-bit whole numbers', '24': '24-bit whole numbers', 'float': '32-bit float' };
const DIR_NAME = { std: 'standard, 0 near and 1 far', rev: 'reversed, 1 near and 0 far', log: 'logarithmic' };
const DIR_IDX = { std: 0, rev: 1, log: 2 };
const FOV = 55;

// ---- state that survives a rebuild
const S = { fmt: '24', dir: 'std', bands: false, near: 0.1, far: 2000, wallLog: Math.log10(60), gapLog: 0, bias: 0, slope: 0, flip: false,
  turn: 0, zoom: 1, view: 'picture', cam: { pos: [-16, 5, 3], target: [10, 2, 7] } };
let gen = 0, prev = null;

// ---- the maths of the chapter: what the buffer stores at a distance, and the smallest step it can tell apart there
function stored(z, dir, n, f) {
  if (dir === 'rev') return n * (f - z) / (z * (f - n));
  if (dir === 'log') return Math.log2(1 + z) / Math.log2(1 + f);
  return 0.5 + 0.5 * ((f + n) / (f - n) - 2 * f * n / (z * (f - n)));
}
function slopePerMetre(z, dir, n, f) { // how much the stored number moves per metre at z
  if (dir === 'log') return 1 / ((1 + z) * Math.LN2 * Math.log2(1 + f));
  return f * n / (z * z * (f - n));
}
function ulp(x) { x = Math.abs(x); if (x < 1e-30) return 2 ** -149; return 2 ** (Math.floor(Math.log2(x)) - 23); }
function stepAt(z, fmt, dir, n, f) { const q = fmt === 'float' ? ulp(stored(z, dir, n, f)) : 1 / CODES[fmt]; return q / slopePerMetre(z, dir, n, f); }
function flickerAt(gap, fmt, dir, n, f) { // the distance where the step first grows past the gap
  if (stepAt(f, fmt, dir, n, f) < gap) return Infinity;
  if (stepAt(n, fmt, dir, n, f) >= gap) return n;
  let lo = n, hi = f; for (let i = 0; i < 60; i++) { const m = Math.sqrt(lo * hi); if (stepAt(m, fmt, dir, n, f) < gap) lo = m; else hi = m; }
  return hi;
}
function nearFor(z, want, fmt, dir, f) { // the near plane that holds a step of `want` at z, or null when the near plane does not matter
  if (stepAt(z, fmt, dir, 0.0001, f) <= want) return 0;
  if (stepAt(z, fmt, dir, 50, f) > want) return Infinity;
  let lo = 0.0001, hi = 50; for (let i = 0; i < 60; i++) { const m = Math.sqrt(lo * hi); if (stepAt(z, fmt, dir, m, f) > want) lo = m; else hi = m; }
  return hi;
}
function toMetres(d, dir, n, f) {
  if (dir === 'rev') return n * f / (n + d * (f - n));
  if (dir === 'log') return 2 ** (d * Math.log2(1 + f)) - 1;
  return 2 * n * f / (f + n - (2 * d - 1) * (f - n));
}
const fmtLen = m => !isFinite(m) ? 'beyond the far plane' : m >= 1000 ? (m / 1000).toFixed(1) + ' km' : m >= 10 ? m.toFixed(1) + ' m' : m >= 1 ? m.toFixed(2) + ' m'
  : m * 1000 >= 10 ? (m * 1000).toFixed(1) + ' mm' : m * 1000 >= 1 ? (m * 1000).toFixed(2) + ' mm' : m * 1000 >= 0.0000001 ? (m * 1000).toPrecision(2) + ' mm' : 'under 0.0000001 mm';
const fmtSigned = m => (m < 0 ? '-' : '') + fmtLen(Math.abs(m));

function build() {
  const myGen = ++gen;
  if (prev) { prev.dead = true; prev.rt && prev.rt.dispose(); prev.probeRT && prev.probeRT.dispose(); prev.sb.renderer.dispose(); prev.sb.renderer.forceContextLoss(); const old = document.querySelector('.sb-app'); if (old) old.remove(); }
  const ctx = { dead: false, rt: null, probeRT: null }; prev = ctx;
  const rendererOpts = S.dir === 'rev' ? { reversedDepthBuffer: true } : S.dir === 'log' ? { logarithmicDepthBuffer: true } : {};

  const sb = boot({
    slug: 'depth-precision', title: 'Depth Precision & Reverse-Z',
    blurb: 'One road at night with lamps at 1, 10, 100 and 1000 metres, drawn through the real depth buffer of your graphics card. Pick how the depth number is stored, flip the buffer around, push a poster down the road until it flickers through its wall, and turn the stored numbers back into metres.',
    camera: { pos: S.cam.pos, target: S.cam.target, near: S.near, far: S.far, fov: FOV },
    renderer: rendererOpts
  });
  ctx.sb = sb;
  const renderer = sb.renderer, camera = sb.camera, scene = sb.scene;
  const reversedOn = renderer.state.buffers.depth.getReversed();
  const gl = renderer.getContext(); const screenBits = gl.getParameter(gl.DEPTH_BITS);

  // ---- the world: the camp beside a road that runs east for 1100 m
  const camp = sb.world.camp(); scene.remove(camp.ground);
  const grassN = sb.world.ground(1); grassN.scale.set(1200, 1200, 1); grassN.position.set(500, 0, 6.5 - 600);
  const grassS = sb.world.ground(1); grassS.scale.set(1200, 1200, 1); grassS.position.set(500, 0, 12.5 + 600);
  const road = sb.world.ground(1, PAL.stone); road.scale.set(1200, 6, 1); road.position.set(540, 0, 9.5);
  for (const zk of [6.35, 12.65]) { const kerb = sb.mesh(new THREE.BoxGeometry(1200, 0.16, 0.3), sb.mat(PAL.stoneLite), 540, 0.08, zk); scene.add(kerb); }
  const lampDist = [1, 10, 100, 1000]; const lamps = lampDist.map(d => sb.world.lamp(d, 13, 3.2, 22));
  const sign = new THREE.Group(); sign.position.set(0, 0, 6.0); scene.add(sign);
  sign.add(sb.mesh(new THREE.CylinderGeometry(0.05, 0.06, 1.6, 6), sb.mat(PAL.wood), 0, 0.8, 0));
  sign.add(sb.mesh(new THREE.BoxGeometry(0.06, 0.5, 1.2), sb.mat(PAL.wall), 0, 1.5, 0));

  // the billboard: a wall on two posts, and a poster glued a hair in front of it. This is the chapter's z-fight, on real hardware.
  const W = 12, H = 7, T = 0.3;
  const board = new THREE.Group(); board.name = 'billboard'; scene.add(board);
  board.add(sb.mesh(new THREE.BoxGeometry(T, H, W), sb.mat(PAL.wall), 0, 1.5 + H / 2, 0));
  for (const zp of [-W / 2 + 1, W / 2 - 1]) board.add(sb.mesh(new THREE.CylinderGeometry(0.15, 0.18, 1.6, 8), sb.mat(PAL.metal), 0, 0.8, zp));
  const posterMat = new THREE.MeshLambertMaterial({ color: PAL.blue, polygonOffset: true, polygonOffsetFactor: 0, polygonOffsetUnits: 0, depthFunc: THREE.LessDepth });
  const poster = new THREE.Mesh(new THREE.PlaneGeometry(9, 5), posterMat); poster.rotation.y = -Math.PI / 2; poster.position.set(-T / 2, 1.5 + H / 2, 0); poster.renderOrder = 1; board.add(poster);

  const posterLabel = sb.label('poster, 1 mm in front of the wall', poster, 'blue'); posterLabel.off.set(0, 3.0, 0);
  const lampLabels = lamps.map((l, i) => { const it = sb.label((i ? '' : 'lamp at ') + lampDist[i] + ' m', l, 'amber'); it.off.set(0, 3.8, 0); return it; });
  const signLabel = sb.label('start of the road, 0 m', sign); signLabel.off.set(0, 2.0, 0);
  const allLabels = [posterLabel, signLabel, ...lampLabels];
  const meshes = []; scene.traverse(o => { if (o.isMesh) meshes.push(o); });

  // ---- the render path: scene into a texture with the chosen depth attachment, then that texture (or its depth) to the screen
  const quadVS = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';
  const blitMat = new THREE.ShaderMaterial({
    uniforms: { tColor: { value: null }, tDepth: { value: null }, uMode: { value: 0 }, uBands: { value: 0 }, uFloat: { value: 0 }, uStripe: { value: 4096 }, uDir: { value: 0 }, uNear: { value: S.near }, uFar: { value: S.far } },
    vertexShader: quadVS,
    fragmentShader: `
      uniform sampler2D tColor; uniform sampler2D tDepth; uniform int uMode; uniform int uDir; uniform int uFloat;
      uniform float uBands; uniform float uStripe; uniform float uNear; uniform float uFar; varying vec2 vUv;
      float toMetres(float d, int dir) {
        if (dir == 1) return uNear * uFar / (uNear + d * (uFar - uNear));
        if (dir == 2) return exp2(d * log2(1.0 + uFar)) - 1.0;
        return 2.0 * uNear * uFar / (uFar + uNear - (2.0 * d - 1.0) * (uFar - uNear));
      }
      float shade(float z) { return 1.0 - clamp(log(max(z, uNear) / uNear) / log(uFar / uNear), 0.0, 1.0); }
      void main() {
        float d = texture2D(tDepth, vUv).r; vec4 col;
        if (uMode == 0) col = linearToOutputTexel(texture2D(tColor, vUv));
        else if (uMode == 1) col = vec4(vec3(pow(d, 0.25)), 1.0);
        else if (uMode == 2) col = vec4(vec3(shade(toMetres(d, uDir))), 1.0);
        else { int wrong = uDir == 1 ? 0 : 1; col = vec4(vec3(shade(toMetres(d, wrong))), 1.0); }
        if (uBands > 0.5 && d > 0.0 && d < 1.0) {
          float band = uFloat == 1 ? floor(log2(max(d, 1e-30))) : floor(d * uStripe);
          float odd = mod(band, 2.0);
          col.rgb = mix(col.rgb, odd > 0.5 ? vec3(0.95, 0.64, 0.25) : vec3(0.29, 0.64, 1.0), 0.55);
        }
        gl_FragColor = col;
      }`,
    depthTest: false, depthWrite: false });
  const quadScene = new THREE.Scene(); quadScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), blitMat));
  const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const probeMat = new THREE.ShaderMaterial({ uniforms: { tDepth: { value: null }, uMouse: { value: new THREE.Vector2() } }, vertexShader: quadVS,
    fragmentShader: 'uniform sampler2D tDepth; uniform vec2 uMouse; void main(){ gl_FragColor = vec4(texture2D(tDepth, uMouse).r, 0.0, 0.0, 1.0); }', depthTest: false, depthWrite: false });
  const probeScene = new THREE.Scene(); probeScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), probeMat));
  ctx.probeRT = new THREE.WebGLRenderTarget(1, 1, { type: THREE.FloatType, depthBuffer: false, minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter });
  const probeOut = new Float32Array(4);
  let rtFmt = null; const size = new THREE.Vector2();
  function ensureTarget() {
    renderer.getDrawingBufferSize(size); const w = Math.max(1, size.x), h = Math.max(1, size.y);
    if (ctx.rt && ctx.rt.width === w && ctx.rt.height === h && rtFmt === S.fmt) return;
    if (ctx.rt) ctx.rt.dispose();
    const type = S.fmt === 'float' ? THREE.FloatType : S.fmt === '16' ? THREE.UnsignedShortType : THREE.UnsignedIntType;
    const depthTex = new THREE.DepthTexture(w, h, type); depthTex.format = THREE.DepthFormat;
    ctx.rt = new THREE.WebGLRenderTarget(w, h, { depthTexture: depthTex, depthBuffer: true, stencilBuffer: false, minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter });
    rtFmt = S.fmt; blitMat.uniforms.tColor.value = ctx.rt.texture; blitMat.uniforms.tDepth.value = depthTex; probeMat.uniforms.tDepth.value = depthTex;
  }
  const stats = { calls: 0, tris: 0, fps: 0 };
  const hover = { on: false, uv: new THREE.Vector2(), ndc: new THREE.Vector2(), d: 0, fresh: false };
  const orig = renderer.render.bind(renderer);
  function frame() {
    ensureTarget();
    renderer.setRenderTarget(ctx.rt); orig(scene, camera);
    stats.calls = renderer.info.render.calls; stats.tris = renderer.info.render.triangles;
    if (hover.on) { probeMat.uniforms.uMouse.value.copy(hover.uv); renderer.setRenderTarget(ctx.probeRT); orig(probeScene, quadCam); renderer.readRenderTargetPixels(ctx.probeRT, 0, 0, 1, 1, probeOut); hover.d = probeOut[0]; hover.fresh = true; }

  }
  renderer.render = (sc, cam) => { if (ctx.dead) return; if (sc === scene && cam === camera && renderer.getRenderTarget() === null) frame(); else orig(sc, cam); };

  // a texture of each type, read it back, and check the values sit on that format's grid. A format that is not honoured gets the
  // rounding done in the pixel shader instead, so the pick stays honest.
  function formatHonoured(type, codes) {

    const rs = new THREE.Scene(); rs.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), rampMat));
    renderer.setRenderTarget(ramp); orig(rs, quadCam);
    const row = new THREE.WebGLRenderTarget(w, 1, { type: THREE.FloatType, depthBuffer: false });
    const rowMat = new THREE.ShaderMaterial({ uniforms: { tDepth: { value: dt } }, vertexShader: quadVS, fragmentShader: 'uniform sampler2D tDepth; varying vec2 vUv; void main(){ gl_FragColor = vec4(texture2D(tDepth, vUv).r, 0.0, 0.0, 1.0); }', depthTest: false, depthWrite: false });
    const qs = new THREE.Scene(); qs.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), rowMat));
    renderer.setRenderTarget(row); orig(qs, quadCam);
    const px = new Float32Array(w * 4); renderer.readRenderTargetPixels(row, 0, 0, w, 1, px); renderer.setRenderTarget(null);
    let off = 0; for (let x = 0; x < w; x++) { const v = px[x * 4]; off = Math.max(off, Math.abs(v * codes - Math.round(v * codes))); }
    ramp.dispose(); row.dispose(); rampMat.dispose(); rowMat.dispose();
    probeLog.push({ codes, off, sample: Array.from({ length: 8 }, (_, i) => px[i * 32 * 4]) });
    return off < 0.01;
  }
  const probeLog = [];
  const honoured = { '16': formatHonoured(THREE.UnsignedShortType, 65535), '24': formatHonoured(THREE.UnsignedIntType, 16777215), 'float': true };
  const quantU = { value: 0 }, signU = { value: reversedOn ? 1 : -1 }, biasU = { value: new THREE.Vector2(0, 0) }, noBiasU = { value: new THREE.Vector2(0, 0) };
  const QUANT = `
    #ifdef SB_QUANT
      #if defined( USE_LOGARITHMIC_DEPTH_BUFFER )
        float sbz = vIsPerspective == 0.0 ? gl_FragCoord.z : log2( vFragDepth ) * logDepthBufFC * 0.5;
      #else
        float sbz = gl_FragCoord.z;
      #endif
      float sbm = max( abs( dFdx( sbz ) ), abs( dFdy( sbz ) ) );
      sbz += uSbSign * ( uSbBias.y * sbm + uSbBias.x / uSbQuant );
      gl_FragDepth = floor( sbz * uSbQuant + 0.5 ) / uSbQuant;
    #endif`;
  const sceneMats = new Set(); scene.traverse(o => { if (o.isMesh) sceneMats.add(o.material); });
  for (const m of sceneMats) {
    m.onBeforeCompile = shader => {
      shader.uniforms.uSbQuant = quantU; shader.uniforms.uSbSign = signU; shader.uniforms.uSbBias = m === posterMat ? biasU : noBiasU;
      shader.fragmentShader = 'uniform float uSbQuant; uniform float uSbSign; uniform vec2 uSbBias;\n' + shader.fragmentShader.replace('#include <logdepthbuf_fragment>', '#include <logdepthbuf_fragment>' + QUANT);
    };
  }
  let emulating = false;
  sb.debug = { probeLog, honoured, quantU, signU, biasU, reversedOn, get emulating() { return emulating; }, posterMat };
  function setEmulation(on) {
    if (on === emulating) return; emulating = on;
    for (const m of sceneMats) { m.defines = m.defines || {}; if (on) m.defines.SB_QUANT = 1; else delete m.defines.SB_QUANT; m.needsUpdate = true; }
  }

  // ---- 01 where the buffer spends its values
  const s1 = sb.panel.section('01 · Where the buffer spends its values', 'The depth number is squashed so most of the buffer\'s accuracy lands in the first metre in front of the camera. Pick how each number is stored and read the smallest step it can tell apart at each lamp.');
  const fmtSeg = s1.segment('How each number is stored', [{ value: '16', label: '16-bit' }, { value: '24', label: '24-bit' }, { value: 'float', label: '32-bit float' }], S.fmt, v => { S.fmt = v; applyBuffer(); });
  s1.toggle('paint the value bands on the picture', S.bands, v => { S.bands = v; applyBuffer(); });
  s1.note('Whole numbers: one stripe per 4096 values (per 16 values for 16-bit). Float: one stripe per power-of-two band. Where the stripes are thin the buffer is spending values fast.');
  const lampReads = lampDist.map(d => s1.readout('step at the ' + d + ' m lamp'));
  const screenRead = s1.readout('this browser\'s screen buffer'); screenRead(screenBits + '-bit whole numbers');

  // ---- 02 the near plane
  const s2 = sb.panel.section('02 · The near plane sets everything', 'Push the near plane out and every step shrinks. Pull the far plane in and almost nothing changes. Watch the poster down the road while you drag.');
  s2.slider('Near plane, the closest distance drawn', { min: 0.01, max: 2, step: 0.01, value: S.near, unit: ' m' }, v => { S.near = v; applyCamera(); });
  s2.slider('Far plane, the farthest distance drawn', { min: 100, max: 5000, step: 50, value: S.far, unit: ' m' }, v => { S.far = v; applyCamera(); });
  const shareRead = s2.readout('share of the range spent inside 1 m');
  const needRead = s2.readout('near plane for a 1 mm step at 100 m');

  // ---- 03 reverse-Z
  const s3 = sb.panel.section('03 · Reverse-Z: flip it and use floats', 'Flipping the buffer so 1 is near and 0 is far only pays off when the number is a float. Switching the direction rebuilds the scene with a different depth buffer; your camera and settings stay.');
  s3.segment('Direction of the buffer', [{ value: 'std', label: 'standard' }, { value: 'rev', label: 'reversed' }, { value: 'log', label: 'logarithmic' }], S.dir, v => { if (myGen !== gen || v === S.dir) return; S.dir = v; saveCam(); build(); });
  const cmpReads = [['24', 'std', '24-bit standard'], ['24', 'rev', '24-bit reversed'], ['float', 'std', 'float standard'], ['float', 'rev', 'float reversed'], ['24', 'log', 'logarithmic, 24-bit']].map(([f, d, name]) => [f, d, s3.readout(name + ': step at the poster')]);
  s3.note(reversedOn ? 'The flipped buffer is real: the projection is swapped, the test is "greater", the buffer clears to 0.' : S.dir === 'rev' ? 'This browser cannot flip the depth buffer (it lacks the clip control extension), so the standard buffer is shown.' : S.dir === 'log' ? 'Logarithmic depth is written by the pixel shader, so the early depth test is off and bias has no effect.' : 'Standard: 0 at the near plane, 1 at the far plane, and half the values are gone by twice the near distance.');

  // ---- 04 z-fighting
  const s4 = sb.panel.section('04 · Z-fighting: the flickering poster', 'A poster is glued to a billboard down the road, a millimetre in front of it. The wall is drawn first and the poster second, and a tie goes to the wall. Push the billboard away until the buffer can no longer tell the two apart.');
  s4.slider('Billboard distance down the road', { min: 0.7, max: 3, step: 0.01, value: S.wallLog, fmt: v => Math.round(10 ** v) + ' m' }, v => { S.wallLog = v; applyBoard(); });
  s4.slider('Poster in front of the wall by', { min: -1, max: 1.7, step: 0.02, value: S.gapLog, fmt: v => +(10 ** v).toPrecision(2) + ' mm' }, v => { S.gapLog = v; applyBoard(); });
  s4.slider('Bias: test the poster this many steps nearer', { min: 0, max: 8, step: 1, value: S.bias }, v => { S.bias = v; applyBoard(); });
  s4.slider('Extra bias for a tilted wall (slope bias)', { min: 0, max: 4, step: 0.25, value: S.slope }, v => { S.slope = v; applyBoard(); });
  s4.toggle('flip the bias sign (the reverse-Z bug: the poster sinks into the wall)', S.flip, v => { S.flip = v; applyBoard(); });
  s4.slider('How far the wall is turned away', { min: 0, max: 80, step: 1, value: S.turn, unit: ' degrees' }, v => { S.turn = v; applyBoard(); });
  s4.slider('Zoom in on the road (narrower view)', { min: 1, max: 12, step: 0.5, value: S.zoom, fmt: v => v + ' times' }, v => { S.zoom = v; applyCamera(); });
  s4.button('Aim the camera at the poster', () => { poster.getWorldPosition(sb.controls.target); });
  const distRead = s4.readout('camera to poster');
  const stepRead = s4.readout('smallest step at the poster');
  const losRead = s4.readout('gap along the line of sight');
  const flickRead = s4.readout('flicker starts at');

  // ---- 05 readback
  const s5 = sb.panel.section('05 · Turning the number back into metres', 'Hover the picture to read one pixel\'s stored number and turn it back into a distance, with the formula that matches how the buffer was written and with the wrong one.');
  s5.segment('Show', [{ value: 'picture', label: 'the picture' }, { value: 'stored', label: 'stored number' }, { value: 'metres', label: 'metres, right formula' }, { value: 'wrong', label: 'metres, wrong formula' }], S.view, v => { S.view = v; applyBuffer(); });
  const storedRead = s5.readout('stored number');
  const rightRead = s5.readout('distance, right formula');
  const wrongRead = s5.readout('distance, wrong formula');
  const trueRead = s5.readout('true distance (geometry)');
  const errRead = s5.readout('rounding error')

  // ---- 06 tradeoffs
  const s6 = sb.panel.section('06 · Tradeoffs', 'Each pick is one row of the chapter\'s table. Memory is for the depth picture at this window\'s size; 24-bit is padded to 4 bytes on most hardware.');
  s6.segment('Pick a setup', [{ value: '16|std', label: '16-bit' }, { value: '24|std', label: '24-bit' }, { value: '24|rev', label: '24-bit reversed' }, { value: 'float|std', label: 'float' }, { value: 'float|rev', label: 'float reversed' }, { value: '24|log', label: 'logarithmic' }], S.fmt + '|' + S.dir, v => {
    if (myGen !== gen) return; const [f, d] = v.split('|'); if (f !== S.fmt) fmtSeg.set(f); if (d !== S.dir) { S.dir = d; saveCam(); build(); } });
  const bytesRead = s6.readout('bytes per pixel');
  const memRead = s6.readout('memory at this size');
  const safeRead = s6.readout('no flicker out to (1 mm gap)');
  const callRead = s6.readout('draw calls');
  const fpsRead = s6.readout('frames per second');

  // ---- apply state to the scene
  function saveCam() { S.cam = { pos: camera.position.toArray(), target: sb.controls.target.toArray() }; }
  function applyBuffer() {
    const u = blitMat.uniforms; u.uFloat.value = S.fmt === 'float' ? 1 : 0; u.uStripe.value = 4096; u.uBands.value = S.bands ? 1 : 0;
    u.uDir.value = reversedOn ? 1 : S.dir === 'log' ? 2 : 0; u.uMode.value = { picture: 0, stored: 1, metres: 2, wrong: 3 }[S.view];
    const emu = !honoured[S.fmt]; quantU.value = emu ? CODES[S.fmt] : 0; setEmulation(emu); applyBoard();
    sb.hud('emu', emu ? S.fmt + '-bit is kept as a float on this card, so the page rounds it to ' + S.fmt + ' bits' : null);
    sb.hud('buf', FMT_NAME[S.fmt] + ', ' + DIR_NAME[reversedOn ? 'rev' : S.dir === 'rev' ? 'std' : S.dir]);
    sb.hud('mode', S.view === 'picture' ? (S.bands ? 'value bands' : null) : S.view === 'stored' ? 'stored number: white is 1, black is 0' : S.view === 'metres' ? 'metres, right formula: white near, black far' : 'metres, wrong formula: it all piles up at the near plane');

  }
  applyBuffer(); applyCamera(); applyBoard();

  // ---- pointer for the readback section
  const canvas = renderer.domElement;
  canvas.addEventListener('pointermove', e => { const r = canvas.getBoundingClientRect(); const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height; hover.uv.set(px, 1 - py); hover.ndc.set(px * 2 - 1, 1 - py * 2); hover.on = true; });

  const ray = new THREE.Raycaster();

  // ---- readouts
  const camPos = new THREE.Vector3(), pPos = new THREE.Vector3(), wallN = new THREE.Vector3(), dir = new THREE.Vector3(), tmp = new THREE.Vector3();
  const activeDir = reversedOn ? 'rev' : S.dir === 'rev' ? 'std' : S.dir;
  let frames = 0;
  function refresh() {
    const n = S.near, f = S.far, fmt = S.fmt, d = activeDir;
    lampDist.forEach((z, i) => lampReads[i](fmtLen(stepAt(z, fmt, d, n, f))));
    shareRead(n < 1 ? Math.round(Math.abs(stored(1, d, n, f) - stored(n, d, n, f)) * 100) + ' %' : 'the near plane is past 1 m');
    const nn = nearFor(100, 0.001, fmt, d, f); needRead(nn === 0 ? 'any: this setup does not depend on it' : !isFinite(nn) ? 'more than 50 m' : fmtLen(nn));
    camera.getWorldPosition(camPos); poster.getWorldPosition(pPos); const z = pPos.distanceTo(camPos);
    for (const [cf, cd, r] of cmpReads) r(fmtLen(stepAt(z, cf, cd, n, f)) + (cf === fmt && cd === d ? ' (now)' : ''));
    distRead(fmtLen(z)); const st = stepAt(z, fmt, d, n, f); stepRead(fmtLen(st));
    const gap = 10 ** S.gapLog / 1000; wallN.set(-1, 0, 0).applyQuaternion(board.quaternion); dir.copy(pPos).sub(camPos).normalize();
    const cosT = Math.max(0.02, Math.abs(dir.dot(wallN))); const los = gap / cosT; losRead(fmtLen(los));
    flickRead(S.flip && (S.bias > 0 || S.slope > 0) && d !== 'log' ? 'the poster is pushed behind the wall' : S.bias >= 1 && d !== 'log' ? 'never: the bias keeps it one step ahead' : fmtLen(flickerAt(los, fmt, d, n, f)));
    for (let i = 0; i < lamps.length; i++) { const l = lampLabels[i]; if (l.el.style.display === 'none') continue; lamps[i].getWorldPosition(tmp).y += 3.2; dir.copy(tmp).sub(camPos); const far = dir.length(); ray.set(camPos, dir.normalize()); ray.far = far - 0.5; const hit = ray.intersectObjects(meshes, false); l.hide(hit.length > 0 && !lamps[i].children.includes(hit[0].object)); }
    ray.far = Infinity;
    const bytes = fmt === '16' ? 2 : 4; bytesRead(bytes + (fmt === '24' ? ' (24 bits, padded)' : '')); renderer.getDrawingBufferSize(size);
    memRead((size.x * size.y * bytes / 1e6).toFixed(1) + ' MB for ' + size.x + ' by ' + size.y + ' pixels');
    safeRead(fmtLen(flickerAt(0.001, fmt, d, n, f))); callRead(stats.calls); fpsRead(Math.round(stats.fps));
    if (hover.on && hover.fresh) {
      const dv = hover.d; const codes = fmt === 'float' ? null : Math.round(dv * CODES[fmt]);
      storedRead(dv.toPrecision(7) + (codes == null ? '' : ' (value ' + codes.toLocaleString() + ' of ' + CODES[fmt].toLocaleString() + ')'));
      const right = toMetres(dv, d, n, f), wrong = toMetres(dv, d === 'rev' ? 'std' : 'rev', n, f);
      rightRead(right > f * 1.001 || !isFinite(right) ? 'past the far plane (sky)' : fmtLen(right)); wrongRead(!isFinite(wrong) || wrong < 0 ? 'no distance at all' : wrong > f * 1.001 ? 'past the far plane' : fmtLen(wrong));
      ray.setFromCamera(hover.ndc, camera); const hits = ray.intersectObjects(meshes, false);
      if (hits.length) { tmp.copy(hits[0].point).applyMatrix4(camera.matrixWorldInverse); const tz = -tmp.z; trueRead(fmtLen(tz)); errRead(fmtSigned(tz - right)); }
      else { trueRead('sky, nothing drawn'); errRead(null); }
    } else if (!hover.on) { storedRead('hover the picture'); rightRead(null); wrongRead(null); trueRead(null); errRead(null); }
  }
  sb.onFrame(dt => {
    if (ctx.dead) return;
    stats.fps = stats.fps ? stats.fps * 0.9 + (1 / Math.max(dt, 1e-3)) * 0.1 : 1 / Math.max(dt, 1e-3);
    for (const l of allLabels) { l.target.getWorldPosition(tmp).applyMatrix4(camera.matrixWorldInverse); l.hide(tmp.z > -camera.near); }
    // far lamps sit near the vanishing point: hide a lamp label that would land on the poster label or on a nearer lamp's label
    const w = sb.stage.clientWidth, h = sb.stage.clientHeight; const shown = [];
    for (const l of [posterLabel, ...lampLabels]) {
      if (l.el.style.display === 'none') continue;
      l.target.getWorldPosition(tmp).add(l.off).project(camera); const x = (tmp.x + 1) / 2 * w, y = (1 - tmp.y) / 2 * h, lw = l.el.offsetWidth || 80;
      const clash = shown.some(o => Math.abs(o.x - x) < (o.lw + lw) / 2 + 6 && Math.abs(o.y - y) < 24);
      if (clash) l.hide(true); else shown.push({ x, y, lw });
    }
    if (frames++ % 4 === 0) refresh();
  });
  refresh();
  sb.start();
}
build();
