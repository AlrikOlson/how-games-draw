<script type="module">

// ---- the camp, rearranged around a long road
W.ground(400);
[[-7, -6, 4.5, true], [6, -30, 5, true], [-6, -22, 4, false], [9, 2, 3.6, false], [-6, -50, 5, true], [7, -70, 4.5, false], [-7, -95, 5, true], [8, -120, 4.5, true], [-8, -150, 5, false]].forEach(a => W.tree(...a));

const wallBox = W.wall(3.25, 4, 3.25, -8, 2.4, 0.4);

// ---- the three textured surfaces

  { mesh: road, draw: drawCobbles, repeat: () => [5 / TEX.tile, ROAD_LEN / TEX.tile], offset: () => [0, -6 / TEX.tile], lambert: new THREE.MeshLambertMaterial(), tex: null, ctex: null },
  { mesh: wall, draw: drawBricks, repeat: () => [12, 2.4], offset: () => [0, 0], lambert: new THREE.MeshLambertMaterial(), tex: null, ctex: null },
  { mesh: fence, draw: drawPickets, repeat: () => [FENCE_LEN, 1], offset: () => [0, 0], lambert: new THREE.MeshLambertMaterial({ side: THREE.DoubleSide, alphaTest: 0.5 }), tex: null, ctex: null }

const bandCols = LEVEL_COLS.map(c => new THREE.Color(c));
const viewVert = `varying vec2 vUv; varying vec3 vN;
#include <fog_pars_vertex>
void main(){ vUv = uv; vN = normalize(mat3(modelMatrix) * normal); vec4 mvPosition = modelViewMatrix * vec4(position, 1.0); gl_Position = projectionMatrix * mvPosition;
#include <fog_vertex>

const stack = new THREE.Group(); stack.visible = false; sb.scene.add(stack);

  while (stack.children.length) { const m = stack.children.pop(); m.material.map.dispose(); m.geometry.dispose(); }

// ---- panel
const s1 = sb.panel.section('01 · Up close', 'Stand nose to the wall. Every screen pixel lands between texels, and the card either grabs the nearest one (blocky) or blends the four around it (soft).');
const magSeg = s1.segment('Between texels, up close', [{ value: 'nearest', label: 'nearest texel' }, { value: 'bilinear', label: 'blend the four (bilinear)' }], 'bilinear', v => { S.mag = v; applyFilter(); });
s1.segment('Past the edge of the tile', [{ value: 'repeat', label: 'continue from the other side (repeat)' }, { value: 'clamp', label: 'repeat the edge texel (clamp)' }], 'repeat', v => { S.wrap = v; applyFilter(); });
s1.button('Stand nose to the brick wall', () => { sb.camera.position.set(2.6, 1.5, -1.6); sb.controls.target.set(3.03, 1.45, -1.8); });
s1.button('Back onto the road', () => { sb.camera.position.set(0.9, 1.7, 11); sb.controls.target.set(0, 0.8, -14); });
s1.note('With clamp, only the first road tile in front of you keeps its picture. Past its edge the last row of texels is stretched into streaks.');

const s2 = sb.panel.section('02 · Far away, textures shimmer', 'Down the road one pixel covers dozens of texels. Blending four of them and ignoring the rest makes bands that crawl when the camera moves. The shrunk copies fix it, and anisotropic reads sharpen the blur that is left.');
const filterSeg = s2.segment('Filter', [{ value: 'nearest', label: 'nearest texel' }, { value: 'bilinear', label: 'bilinear, full size only' }, { value: 'bimips', label: 'bilinear with copies' }, { value: 'trilinear', label: 'trilinear' }, { value: 'aniso4', label: 'anisotropic 4x' }, { value: 'aniso16', label: 'anisotropic 16x' }], 'bilinear', v => { S.filter = v; if (v === 'nearest') { S.mag = 'nearest'; magSeg.set('nearest', false); } applyFilter(); refreshNumbers(); });

s2.slider('Nudge the copy: sharper (minus) or blurrier (plus)', { min: -2, max: 2, step: 0.25, value: 0 }, v => { biasU.value = v; });
s2.toggle('drift the camera slowly (shows the crawl)', false, v => { S.drift = v; });
s2.segment('Screen width in pixels', [{ value: 0, label: 'full' }, { value: 640, label: '640' }, { value: 320, label: '320' }], 0, v => { S.pix = +v; sb.view.pixelate(S.pix); refreshNumbers(); });
const texRead = s2.readout('texels read per pixel, worst case');
const msRead = s2.readout('ms per frame in this browser');
s2.readout('anisotropic reads your card offers', maxAniso ? 'up to ' + maxAniso + 'x' : 'none');

const s3 = sb.panel.section('03 · The stack of shrunk copies', 'The road picture and its half-size copies, down to one texel. The card reads the copy where one texel is about one pixel wide, so its four texels already hold the average of everything the pixel covers.');
s3.toggle('show the stack beside the road', false, v => { stack.visible = v; stackLabel.hide(!v); });
const viewSeg3 = s3.segment('View', [{ value: 'picture', label: 'the picture' }, { value: 'real', label: 'which copy is read' }, { value: 'onecopy', label: 'one copy only' }], 'picture', v => setView(v));
const levelSlider = s3.slider('Which copy to read (0 = full size)', { min: 0, max: 8, step: 0.25, value: 0 }, v => { S.level = v; setView('onecopy'); });
s3.key(LEVEL_COLS.slice(0, 6).map((c, k) => [c, k === 0 ? 'copy 0, full size' : k === 1 ? 'copy 1, half size' : 'copy ' + k + ', 1/' + Math.pow(2, k) + ' size']));
const baseRead = s3.readout('the road picture, full size');
const chainRead = s3.readout('with all its copies');

const s4 = sb.panel.section('04 · How the GPU picks the copy', 'Hover the road, wall or fence. The card measures how far the picture moves for one pixel step across and one down, takes the longer step in texels, and halves until it is about one texel: that many halvings is the copy.');
const viewSeg4 = s4.segment('View', [{ value: 'picture', label: 'the picture' }, { value: 'formula', label: 'copy by the formula' }, { value: 'stretch', label: 'stretch of the patch' }], 'picture', v => setView(v));
s4.toggle('show the hovered pixel\'s patch, drawn 32 times bigger', true, v => { S.patch = v; patch.visible = false; });
const stepXRead = s4.readout('pixel step across, in texels');
const stepYRead = s4.readout('pixel step down, in texels');
const ratioRead = s4.readout('patch long : short');
const lodRead = s4.readout('copy level (lambda)');
const tapsRead = s4.readout('anisotropic reads (N) and their level');
const readsRead = s4.readout('texels read for this pixel');

const s5 = sb.panel.section('05 · What textures cost in memory', 'Bigger pictures look sharper up close and cost four times the bytes per doubling. The copies add a third. Block compression cuts the bytes eight times and the card decodes on the way in.');
s5.segment('Texels per tile', [{ value: 64, label: '64 x 64' }, { value: 256, label: '256 x 256' }, { value: 1024, label: '1024 x 1024' }], 256, v => { TEX.size = +v; levelSlider.set(Math.min(S.level, Math.log2(TEX.size)), false); S.level = levelSlider.get(); rebuildTextures(); setView(S.view); });
s5.segment('Stored as', [{ value: 'rgba', label: 'full colour (RGBA8)' }, { value: 'bc1', label: 'block compressed (BC1)' }], 'rgba', v => { TEX.bc1 = v === 'bc1'; rebuildTextures(); });
s5.toggle('keep the shrunk copies (mipmaps)', true, v => { TEX.mips = v; applyFilter(); refreshNumbers(); });
const roadBytes = s5.readout('road picture on the card');
const allBytes = s5.readout('all three pictures with copies');
const linesRead = s5.readout('cache lines per pixel, worst case');
const bwRead = s5.readout('memory traffic, rough (9 in 10 reads hit the cache)');

// ---- readouts
const fmtB = b => b >= 1048576 ? (b / 1048576).toFixed(2) + ' MB' : b >= 1024 ? (b / 1024).toFixed(1) + ' KB' : b + ' B';
function bytesOf(n, chain) { const per = TEX.bc1 ? 0.5 : 4; let sum = 0; for (let s = n; s >= 1; s >>= 1) { sum += Math.ceil(s / (TEX.bc1 ? 4 : 1)) * Math.ceil(s / (TEX.bc1 ? 4 : 1)) * (TEX.bc1 ? 8 : 4); if (!chain) break; } return sum; }
function refreshNumbers() {
  const f = FILTERS[effectiveFilter()], n = TEX.size;
  texRead(f.texels); baseRead(fmtB(bytesOf(n, false))); chainRead(fmtB(bytesOf(n, true)) + ' (x' + (bytesOf(n, true) / bytesOf(n, false)).toFixed(3) + ')');
  roadBytes(fmtB(bytesOf(n, TEX.mips))); allBytes(fmtB(3 * bytesOf(n, TEX.mips))); linesRead(f.lines);
  const w = sb.stage.clientWidth, h = sb.stage.clientHeight, pr = sb.renderer.getPixelRatio(); const pixels = S.pix ? S.pix * Math.round(S.pix * h / w) : w * h * pr * pr;
  bwRead((pixels * f.lines * 64 * 0.1 * 60 / 1e9).toFixed(2) + ' GB/s at 60 frames');
}

// ---- the hovered pixel: three rays (this pixel, one step right, one step down) hit the same surface, and the picture coordinates they land on give the pixel steps in texels
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), pointer = { x: -1, y: -1, moved: false };
sb.stage.addEventListener('pointermove', e => { const r = sb.stage.getBoundingClientRect(); pointer.x = e.clientX - r.left; pointer.y = e.clientY - r.top; pointer.moved = true; });
sb.stage.addEventListener('pointerleave', () => { pointer.moved = true; pointer.x = -1; });
const patch = new THREE.Mesh(new THREE.BufferGeometry(), new THREE.MeshBasicMaterial({ color: PAL.amber, transparent: true, opacity: 0.75, depthTest: false, side: THREE.DoubleSide }));
patch.geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(12), 3)); patch.geometry.setIndex([0, 1, 2, 0, 2, 3]); patch.renderOrder = 20; patch.visible = false; patch.frustumCulled = false; sb.scene.add(patch);
const hitP = [new V3(), new V3(), new V3()], hitUV = [new THREE.Vector2(), new THREE.Vector2(), new THREE.Vector2()], ea = new V3(), eb = new V3(), nrm = new V3();
const patchLabel = sb.label('the pixel\'s patch, 32 times bigger', patch, 'amber'); patchLabel.hide(true);
function probe() {
  pointer.moved = false; let ok = false;
  if (pointer.x >= 0) {
    const w = sb.stage.clientWidth, h = sb.stage.clientHeight, pr = sb.renderer.getPixelRatio();
    const stepX = S.pix ? 2 / S.pix : 2 / (w * pr), stepY = S.pix ? 2 / Math.round(S.pix * h / w) : 2 / (h * pr);
    const meshes = surfaces.map(s => s.mesh); let surf = null;
    for (let k = 0; k < 3 && (k === 0 || surf); k++) {
      ndc.set((pointer.x / w) * 2 - 1 + (k === 1 ? stepX : 0), -(pointer.y / h) * 2 + 1 - (k === 2 ? stepY : 0)); ray.setFromCamera(ndc, sb.camera);
      const hits = k === 0 ? ray.intersectObjects(meshes, false) : ray.intersectObject(surf.mesh, false);
      if (!hits.length || !hits[0].uv) { surf = null; break; }
      if (k === 0) surf = surfaces.find(s => s.mesh === hits[0].object);
      hitP[k].copy(hits[0].point); hitUV[k].copy(hits[0].uv);
    }
    if (surf) {
      ok = true; const rep = surf.repeat(), n = TEX.size;
      const dx = Math.hypot((hitUV[1].x - hitUV[0].x) * rep[0], (hitUV[1].y - hitUV[0].y) * rep[1]) * n, dy = Math.hypot((hitUV[2].x - hitUV[0].x) * rep[0], (hitUV[2].y - hitUV[0].y) * rep[1]) * n;
      const rho = Math.max(dx, dy), rmin = Math.max(Math.min(dx, dy), 1e-6), levels = Math.log2(n) + 1, f = FILTERS[effectiveFilter()];
      const lam = Math.min(levels - 1, Math.max(0, Math.log2(rho) + biasU.value));
      const N = f.aniso > 1 ? Math.min(Math.ceil(rho / rmin), Math.min(f.aniso, Math.max(1, maxAniso))) : 1, lamA = Math.min(levels - 1, Math.max(0, Math.log2(rho / N) + biasU.value));
      stepXRead(dx.toFixed(2)); stepYRead(dy.toFixed(2)); ratioRead((rho / rmin).toFixed(1) + ' : 1');
      lodRead(lam.toFixed(2) + (lam <= 0 ? ' (full size, up close)' : ''));
      tapsRead(f.aniso > 1 ? N + ' reads at level ' + lamA.toFixed(2) : 'none, one read');
      readsRead(f.min === THREE.NearestFilter ? 1 : f.min === THREE.LinearMipmapLinearFilter ? 8 * N : 4);
      // the patch: the parallelogram the pixel covers on the surface, scaled up so it can be seen
      ea.subVectors(hitP[1], hitP[0]).multiplyScalar(16); eb.subVectors(hitP[2], hitP[0]).multiplyScalar(16);
      nrm.set(0, 0, 1).applyQuaternion(surf.mesh.quaternion).multiplyScalar(0.02); if (surf.mesh === fence) nrm.multiplyScalar(0);
      const p = patch.geometry.attributes.position.array;
      const put = (i, sx, sy) => { p[i * 3] = hitP[0].x + ea.x * sx + eb.x * sy + nrm.x; p[i * 3 + 1] = hitP[0].y + ea.y * sx + eb.y * sy + nrm.y; p[i * 3 + 2] = hitP[0].z + ea.z * sx + eb.z * sy + nrm.z; };
      put(0, -1, -1); put(1, 1, -1); put(2, 1, 1); put(3, -1, 1); patch.geometry.attributes.position.needsUpdate = true;
      patchLabel.off.copy(hitP[0]).add(nrm); patchLabel.off.y += 0.12;
    }
  }
  patch.visible = ok && S.patch; patchLabel.hide(!(ok && S.patch));
  if (!ok) { stepXRead(null); stepYRead(null); ratioRead(null); lodRead(null); tapsRead(null); readsRead(null); }
}

// ---- labels, loop
sb.label('the road, cobbles', new V3(0, 0.05, -5)).off.set(0, 0.3, 0);
sb.label('brick wall', new V3(3.0, 2.4, -2), 'blue');
sb.label('picket fence', new V3(-3.0, 1.0, -8), 'blue');
const stackLabel = sb.label('the stack: each copy half the size, down to one texel', new V3(-3.6, 3.35, 0.6), 'amber'); stackLabel.hide(true);
sb.label('the knight', knight).off.set(0, 2.0, 0);
rebuildTextures(); setView('picture');
let prevOff = 0, msAvg = 16, lastT = performance.now(), frames = 0;
sb.onFrame((dt, t) => {
  const now = performance.now(); msAvg += (now - lastT - msAvg) * 0.08; lastT = now; if ((frames++ & 15) === 0) msRead(msAvg.toFixed(1));
  const off = S.drift ? Math.sin(t * 0.8) * 0.45 : 0; const d = off - prevOff; if (d) { sb.camera.position.z += d; sb.controls.target.z += d; } prevOff = off;
  if (pointer.moved || S.drift) probe();
});
sb.start();
</script>
</body>
</html>
