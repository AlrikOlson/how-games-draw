<body>
<script type="module">
import { boot, THREE, PAL } from './_kit.js';

const sb = boot({
  slug: 'screen-space-reflections', title: 'Screen-Space Reflections',
  blurb: 'A still lake beside the camp, reflecting the house and the knight with a real screen-space reflection pass: the picture, its depth, and a walk along the bounced line for every lake pixel. Watch the walk for one pixel, change how it steps, lift the house out of the picture to make it fail, ripple the water, then compare with a true mirror and a snapshot probe.',
  camera: { pos: [1.5, 5.6, 19], target: [0.4, 1.4, 0], near: 0.1, far: 300 }
});
const scene = sb.scene, camera = sb.camera, renderer = sb.renderer, world = sb.world;
scene.background = null; renderer.info.autoReset = false;
sb.lights.hemi.intensity = 0.7;

// ---- the camp on the far shore of a lake. Same props as every other sandbox, moved so the water sits between the camera and the camp.
world.ground(70);
const LAKE_Y = 0.03;
const lake = new THREE.Mesh(new THREE.PlaneGeometry(28, 13.5), new THREE.MeshLambertMaterial({ color: 0x0c1826 }));
lake.rotation.x = -Math.PI / 2; lake.position.set(0, LAKE_Y, 8.6); lake.receiveShadow = true; lake.name = 'lake'; scene.add(lake);
const house = world.house(2.8, -3.3, 4, 3, 2.6, -0.25); const HOUSE_X = 2.8;
const knight = world.knight(-2.6, 0.9, 1.8, 0.3);
world.fire(0.6, 1.1);
world.lamp(6.2, 0.4, 3, 20);
world.crate(-5.3, 1.2, 0.9, 0.3); world.crate(-6.0, 2.0, 0.7, -0.4);
world.tree(-7.5, -4, 4.5); world.tree(6.5, -7.5, 5); world.tree(-3.5, -9.5, 4, false); world.tree(9, -1.5, 3.8, false); world.tree(-10, 0.5, 4.2);
world.rock(7.5, 1.3, 0.6); world.rock(-9, 1.0, 0.5);
// a crate hanging from a rope over the water: something in front of the house that hides part of what the lake should reflect
const hang = new THREE.Group(); hang.position.set(1.1, 0, 6.6); hang.visible = false; scene.add(hang);
const hangCrate = sb.mesh(new THREE.BoxGeometry(0.9, 0.9, 0.9), sb.mat(PAL.wood), 0, 3.4, 0); hangCrate.rotation.y = 0.5; hang.add(hangCrate);
hang.add(sb.mesh(new THREE.CylinderGeometry(0.03, 0.03, 12, 6), sb.mat(PAL.stone), 0, 3.85 + 6, 0));
// the night sky: a dome with a gentle gradient so the water has a sky to reflect and the probe has one to store
const skyMat = new THREE.ShaderMaterial({ side: THREE.BackSide, uniforms: {},
  vertexShader: 'varying vec3 vW; void main(){ vW = (modelMatrix * vec4(position, 1.0)).xyz; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: 'varying vec3 vW; void main(){ float u = clamp(normalize(vW).y, 0.0, 1.0); gl_FragColor = vec4(mix(vec3(0.014, 0.020, 0.034), vec3(0.002, 0.003, 0.006), sqrt(u)), 1.0); }' });
const sky = new THREE.Mesh(new THREE.SphereGeometry(140, 24, 12), skyMat); sky.name = 'sky'; scene.add(sky);

sb.label('the lake', new THREE.Vector3(-4.5, LAKE_Y, 9.5));
sb.label('the house', house, 'amber').off.set(0, 4.4, 0);
sb.label('the knight', knight).off.set(0, 2.2, 0);
const hangLabel = sb.label('a crate in the way', hangCrate, 'blue'); hangLabel.off.set(0, 0.7, 0); hangLabel.hide(true);

// ---- render targets: the colour picture, the depth and normal picture (alpha is minus depth on the lake), a depth pyramid, the reflection result and its history
const GL3 = THREE.GLSL3;
const quadScene = new THREE.Scene(), quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1), quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2)); quadScene.add(quad);
const VS = 'out vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';
const gMat = new THREE.ShaderMaterial({ glslVersion: GL3, side: THREE.FrontSide,
  vertexShader: 'out vec3 vN; out float vD; void main(){ vec4 mv = modelViewMatrix * vec4(position, 1.0); vN = normalMatrix * normal; vD = -mv.z; gl_Position = projectionMatrix * mv; }',
  fragmentShader: 'precision highp float; in vec3 vN; in float vD; out vec4 o; void main(){ o = vec4(normalize(vN), vD); }' });
const gLakeMat = new THREE.ShaderMaterial({ glslVersion: GL3, side: THREE.FrontSide,
  vertexShader: 'out vec3 vN; out float vD; void main(){ vec4 mv = modelViewMatrix * vec4(position, 1.0); vN = normalMatrix * normal; vD = -mv.z; gl_Position = projectionMatrix * mv; }',
  fragmentShader: 'precision highp float; in vec3 vN; in float vD; out vec4 o; void main(){ o = vec4(normalize(vN), -vD); }' });
const gBack = new THREE.ShaderMaterial({ glslVersion: GL3, side: THREE.BackSide, vertexShader: gMat.vertexShader, fragmentShader: gMat.fragmentShader });

// everything the walk needs: where a pixel is in space, what depth the picture stored there, the depth pyramid, and the walk itself
const COMMON = `precision highp float; precision highp int; in vec2 vUv; out vec4 o;
uniform sampler2D tG; uniform sampler2D tH1; uniform sampler2D tH2; uniform sampler2D tH3; uniform sampler2D tH4; uniform sampler2D tH5; uniform sampler2D tH6; uniform sampler2D tH7;
uniform vec2 uLvl[8]; uniform int uTop; uniform mat4 uProj, uInvProj; uniform vec2 uRes; uniform float uNear;
uniform float uStepPx, uThick, uThickMin, uMaxDist, uFade, uRough, uSeed; uniform int uMaxSteps, uRefine, uMethod, uThickRule, uRays;
vec3 viewPos(vec2 uv, float d) { vec4 c = uInvProj * vec4(uv * 2.0 - 1.0, 1.0, 1.0); vec3 ray = c.xyz / c.w; return ray * (d / -ray.z); }
float fixZ(float a) { a = abs(a); return a <= 0.0 ? 1e9 : a; }
float zAt(vec2 uv) { return fixZ(texture(tG, uv).a); }
float zCellAt(int L, vec2 cell) { ivec2 c = ivec2(cell);
  if (L == 0) return fixZ(texelFetch(tG, c, 0).a); if (L == 1) return texelFetch(tH1, c, 0).r; if (L == 2) return texelFetch(tH2, c, 0).r; if (L == 3) return texelFetch(tH3, c, 0).r;
  if (L == 4) return texelFetch(tH4, c, 0).r; if (L == 5) return texelFetch(tH5, c, 0).r; if (L == 6) return texelFetch(tH6, c, 0).r; return texelFetch(tH7, c, 0).r; }
bool inside(vec2 uv) { return uv.x > 0.0 && uv.x < 1.0 && uv.y > 0.0 && uv.y < 1.0; }
float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
vec3 jitterDir(vec3 d, vec3 n, float rough, vec2 xi) {
  float a = max(rough * rough, 1e-4); float cosT = sqrt((1.0 - xi.x) / (1.0 + (a * a - 1.0) * xi.x)); float sinT = sqrt(max(0.0, 1.0 - cosT * cosT)); float phi = 6.2831853 * xi.y;
  vec3 t = normalize(abs(n.y) < 0.99 ? cross(n, vec3(0.0, 1.0, 0.0)) : cross(n, vec3(1.0, 0.0, 0.0))); vec3 b = cross(n, t);
  vec3 h = normalize(t * (sinT * cos(phi)) + b * (sinT * sin(phi)) + n * cosT); vec3 r = reflect(d, h); if (dot(r, n) < 0.0) r = r - 2.0 * dot(r, n) * n; return normalize(r); }
struct Samp { vec2 uv; float zRay; float zBuf; float thick; int level; int state; };
struct Res { vec2 uv; float hit; int reads; int cls; float dist; vec2 uv0; vec2 uv1; };
float thickAt(vec2 uv, float zBuf, float zRay, float zPrev, vec2 dirTx, float stepPx) {
  if (uThickRule == 0) return uThick;
  if (uThickRule == 1) return uThickMin + abs(zRay - zPrev);
  float zp = zAt(uv + dirTx), zm = zAt(uv - dirTx); float sl = min(abs(zp - zBuf), abs(zBuf - zm)); return min(uThickMin + sl * stepPx, 6.0); }
#define RAYZ(s) (1.0 / mix(iz0, iz1, (s)))
#define EMIT(UV, ZR, ZB, TH, LV, ST) { n++; if (n == record) { rec.uv = UV; rec.zRay = ZR; rec.zBuf = ZB; rec.thick = TH; rec.level = LV; rec.state = ST; R.cls = -1; return R; } }
// the walk. cls: 1 hit, 2 ran off the screen, 3 ran out of reads, 4 reached the end of the line, 5 no line to walk. record > 0 stops at that read and reports it.
Res march(vec3 p0, vec3 r, int record, out Samp rec) {
  Res R; R.uv = vec2(0.0); R.hit = 0.0; R.reads = 0; R.cls = 5; R.dist = 0.0; R.uv0 = vec2(0.0); R.uv1 = vec2(0.0);
  rec.state = -1; rec.level = 0; rec.uv = vec2(0.0); rec.zRay = 0.0; rec.zBuf = 0.0; rec.thick = 0.0;
  float tMax = uMaxDist; if (r.z > 0.0) tMax = min(tMax, (-uNear * 1.5 - p0.z) / r.z); if (tMax <= 0.01) return R;
  vec3 p1 = p0 + r * tMax;
  vec4 c0 = uProj * vec4(p0, 1.0), c1 = uProj * vec4(p1, 1.0);
  vec2 uv0 = c0.xy / c0.w * 0.5 + 0.5, uv1 = c1.xy / c1.w * 0.5 + 0.5; R.uv0 = uv0; R.uv1 = uv1;
  float iz0 = 1.0 / -p0.z, iz1 = 1.0 / -p1.z;
  vec2 dUv = uv1 - uv0; vec2 dPx = dUv * uRes; float D = length(dPx); if (D < 0.5) return R;
  vec2 dirTx = dPx / D / uRes; int n = 0;
  if (uMethod < 2) {
    float ds = uStepPx / D; float sPrev = 0.0, zPrev = -p0.z;
    for (int i = 1; i <= 512; i++) { if (i > uMaxSteps) { R.cls = 3; break; }
      float s = float(i) * ds; if (s > 1.0) { R.cls = 4; break; }
      vec2 uv = uv0 + dUv * s; if (!inside(uv)) { R.reads++; EMIT(uv, RAYZ(s), 0.0, 0.0, 0, 3); R.cls = 2; break; }
      float zRay = RAYZ(s), zBuf = zAt(uv); R.reads++;
      float th = thickAt(uv, zBuf, zRay, zPrev, dirTx, uStepPx);
      if (zRay > zBuf) {
        if (zRay - zBuf < th) {
          EMIT(uv, zRay, zBuf, th, 0, 2);
          float lo = sPrev, hi = s;
          if (uMethod == 1) for (int k = 0; k < 8; k++) { if (k >= uRefine) break; float m = 0.5 * (lo + hi); vec2 muv = uv0 + dUv * m; float mz = RAYZ(m), mb = zAt(muv); R.reads++; EMIT(muv, mz, mb, th, 0, 4); if (mz > mb) hi = m; else lo = m; }
          vec2 huv = uv0 + dUv * hi; float hz = RAYZ(hi); R.uv = huv; R.hit = 1.0; R.cls = 1; R.dist = abs(r.z) > 1e-4 ? (-hz - p0.z) / r.z : hi * tMax;
          EMIT(huv, hz, zBuf, th, 0, 6); break;
        } else EMIT(uv, zRay, zBuf, th, 0, 1);
      } else EMIT(uv, zRay, zBuf, th, 0, 0);
      sPrev = s; zPrev = zRay;
    }
  } else {
    int L = min(1, uTop); float s = 0.25 / D;
    for (int i = 0; i < 512; i++) { if (i >= uMaxSteps) { R.cls = 3; break; }
      vec2 uv = uv0 + dUv * s; if (!inside(uv)) { EMIT(uv, RAYZ(s), 0.0, 0.0, L, 3); R.cls = 2; break; }
      vec2 lvl = uLvl[L]; vec2 cell = floor(uv * lvl);
      vec2 edge = (cell + step(vec2(0.0), dUv)) / lvl;
      vec2 tE = vec2(abs(dUv.x) > 1e-7 ? (edge.x - uv0.x) / dUv.x : 1e9, abs(dUv.y) > 1e-7 ? (edge.y - uv0.y) / dUv.y : 1e9);
      float sExit = min(min(tE.x, tE.y), 1.0);
      float zCell = zCellAt(L, cell); R.reads++;
      float zA = RAYZ(s), zB = RAYZ(sExit);
      if (max(zA, zB) < zCell) { EMIT(uv, zA, zCell, 0.0, L, 0); if (sExit >= 1.0) { R.cls = 4; break; } s = sExit + 0.25 / D; L = min(L + 1, uTop); }
      else if (L > 0) { EMIT(uv, zA, zCell, 0.0, L, 5); L--; }
      else {
        float th = thickAt(uv, zCell, zB, zA, dirTx, 1.0);
        if (zB - zCell < th) {
          float sh = abs(iz1 - iz0) > 1e-9 ? clamp((1.0 / zCell - iz0) / (iz1 - iz0), s, sExit) : s; vec2 huv = uv0 + dUv * sh; float hz = RAYZ(sh);
          R.uv = huv; R.hit = 1.0; R.cls = 1; R.dist = abs(r.z) > 1e-4 ? (-hz - p0.z) / r.z : sh * tMax; EMIT(huv, hz, zCell, th, 0, 6); break; }
        else { EMIT(uv, zB, zCell, th, 0, 1); if (sExit >= 1.0) { R.cls = 4; break; } s = sExit + 0.25 / D; L = min(L + 1, uTop); }
      }
    }
  }
  return R; }
vec2 xiFor(vec2 px, int k) { return vec2(hash(px + uSeed + float(k) * 17.0), hash(px.yx * 1.3 + uSeed * 0.7 + float(k) * 31.0)); }
`;

// the depth pyramid: each level keeps the nearer of the cells below it, so a whole cell can be skipped if the line stays in front of its nearest depth
const reduceMat = new THREE.ShaderMaterial({ glslVersion: GL3, vertexShader: VS, uniforms: { tSrc: { value: null }, uSrcRes: { value: new THREE.Vector2() }, uSrcG: { value: 0 } }, fragmentShader: `precision highp float; in vec2 vUv; out vec4 o; uniform sampler2D tSrc; uniform vec2 uSrcRes; uniform int uSrcG;
float rd(ivec2 c) { c = clamp(c, ivec2(0), ivec2(uSrcRes) - 1); vec4 t = texelFetch(tSrc, c, 0); if (uSrcG == 1) { float a = abs(t.a); return a <= 0.0 ? 1e9 : a; } return t.r; }
void main() { ivec2 c = ivec2(gl_FragCoord.xy) * 2; float m = min(min(rd(c), rd(c + ivec2(1, 0))), min(rd(c + ivec2(0, 1)), rd(c + ivec2(1, 1))));
  if ((int(uSrcRes.x) & 1) == 1) m = min(m, min(rd(c + ivec2(2, 0)), rd(c + ivec2(2, 1)))); if ((int(uSrcRes.y) & 1) == 1) m = min(m, min(rd(c + ivec2(0, 2)), rd(c + ivec2(1, 2)))); o = vec4(m, 0.0, 0.0, 1.0); }` });

const marchUniforms = () => ({ tG: { value: null }, tH1: { value: null }, tH2: { value: null }, tH3: { value: null }, tH4: { value: null }, tH5: { value: null }, tH6: { value: null }, tH7: { value: null },
  uLvl: { value: Array.from({ length: 8 }, () => new THREE.Vector2(1, 1)) }, uTop: { value: 0 }, uProj: { value: new THREE.Matrix4() }, uInvProj: { value: new THREE.Matrix4() }, uRes: { value: new THREE.Vector2(1, 1) }, uNear: { value: 0.1 },
  uStepPx: { value: 8 }, uThick: { value: 0.4 }, uThickMin: { value: 0.05 }, uMaxDist: { value: 40 }, uFade: { value: 0.1 }, uRough: { value: 0 }, uSeed: { value: 0 }, uMaxSteps: { value: 128 }, uRefine: { value: 4 }, uMethod: { value: 1 }, uThickRule: { value: 0 }, uRays: { value: 1 } });

// the reflection pass: one lake pixel in, the colour found along its bounced line out (rgb weighted by confidence, a = confidence)
const ssrMat = new THREE.ShaderMaterial({ glslVersion: GL3, vertexShader: VS, uniforms: Object.assign(marchUniforms(), { tScene: { value: null } }), fragmentShader: COMMON + `uniform sampler2D tScene;
void main() { vec4 g = texture(tG, vUv); if (g.a >= 0.0) { o = vec4(0.0); return; }
  float d = -g.a; vec3 n = normalize(g.rgb); vec3 p = viewPos(vUv, d); vec3 v = normalize(p); vec3 r0 = reflect(v, n); vec3 p0 = p + n * 0.02;
  vec3 col = vec3(0.0); float w = 0.0; Samp rec;
  for (int k = 0; k < 4; k++) { if (k >= uRays) break;
    vec3 r = uRough > 0.001 ? jitterDir(v, n, uRough, xiFor(gl_FragCoord.xy, k)) : r0;
    Res R = march(p0, r, -1, rec);
    if (R.hit > 0.5) { float e = min(min(R.uv.x, 1.0 - R.uv.x), min(R.uv.y, 1.0 - R.uv.y)); float f = smoothstep(0.0, max(uFade, 1e-4), e); col += texture(tScene, R.uv).rgb * f; w += f; } }
  float K = float(uRays); o = vec4(col / K, w / K); }` });
// last frames averaged in: each new frame is blended into the running picture by 1 / frames, up to 48
const histMat = new THREE.ShaderMaterial({ glslVersion: GL3, vertexShader: VS, uniforms: { tCur: { value: null }, tHist: { value: null }, uBlend: { value: 1 } }, fragmentShader: `precision highp float; in vec2 vUv; out vec4 o; uniform sampler2D tCur, tHist; uniform float uBlend;
void main() { o = mix(texture(tHist, vUv), texture(tCur, vUv), uBlend); }` });
// per-pixel bookkeeping at a low size, read back to the panel: how each lake pixel's walk ended and how many depth reads it took
const statsMat = new THREE.ShaderMaterial({ glslVersion: GL3, vertexShader: VS, uniforms: marchUniforms(), fragmentShader: COMMON + `
void main() { vec4 g = texture(tG, vUv); if (g.a >= 0.0) { o = vec4(0.0, 0.0, 0.0, 1.0); return; }
  float d = -g.a; vec3 n = normalize(g.rgb); vec3 p = viewPos(vUv, d); vec3 v = normalize(p); vec3 r = reflect(v, n); Samp rec; Res R = march(p + n * 0.02, r, -1, rec);
  float e = min(min(R.uv.x, 1.0 - R.uv.x), min(R.uv.y, 1.0 - R.uv.y)); float f = R.hit * smoothstep(0.0, max(uFade, 1e-4), e);
  o = vec4(float(R.cls) / 5.0, min(float(R.reads) / 255.0, 1.0), f, 1.0); }` });
// the walk for one picked pixel: column i reports depth read number i, row 2 the result, row 3 the two ends of the line
const traceMat = new THREE.ShaderMaterial({ glslVersion: GL3, vertexShader: VS, uniforms: Object.assign(marchUniforms(), { uPick: { value: new THREE.Vector2(0.5, 0.3) } }), fragmentShader: COMMON + `uniform vec2 uPick;
void main() { int i = int(gl_FragCoord.x), row = int(gl_FragCoord.y); vec4 g = texture(tG, uPick); if (g.a >= 0.0) { o = vec4(-2.0); return; }
  float d = -g.a; vec3 n = normalize(g.rgb); vec3 p = viewPos(uPick, d); vec3 v = normalize(p); vec3 p0 = p + n * 0.02;
  vec3 r = uRough > 0.001 ? jitterDir(v, n, uRough, xiFor(uPick * uRes, 0)) : reflect(v, n); Samp rec;
  if (row >= 2) { Res R = march(p0, r, -1, rec); o = row == 2 ? vec4(float(R.cls), float(R.reads), R.uv) : vec4(R.uv0, R.uv1); return; }
  Res R = march(p0, r, i + 1, rec);
  o = row == 0 ? vec4(rec.uv, rec.zRay, rec.zBuf) : vec4(rec.thick, float(rec.state), float(rec.level), R.cls == -1 ? 1.0 : 0.0); }` });
// the final picture: the colour picture everywhere, and on the lake a mix of water and reflection, from the walk, a true mirror render or the probe
const compMat = new THREE.ShaderMaterial({ glslVersion: GL3, vertexShader: VS, uniforms: Object.assign(marchUniforms(), { tScene: { value: null }, tSSR: { value: null }, tMirror: { value: null }, tProbe: { value: null }, uInvView: { value: new THREE.Matrix4() }, uMirrorMat: { value: new THREE.Matrix4() },
  uProbePos: { value: new THREE.Vector3() }, uBoxMin: { value: new THREE.Vector3(-14, 0, -12) }, uBoxMax: { value: new THREE.Vector3(14, 12, 16) }, uView: { value: 0 }, uReflMode: { value: 0 }, uFill: { value: 1 }, uF0: { value: 0.5 }, uDepthFar: { value: 40 } }), fragmentShader: COMMON + `
uniform sampler2D tScene, tSSR, tMirror; uniform samplerCube tProbe; uniform mat4 uInvView, uMirrorMat; uniform vec3 uProbePos, uBoxMin, uBoxMax; uniform int uView, uReflMode, uFill; uniform float uF0, uDepthFar;
vec3 skyCol(vec3 d) { float u = clamp(d.y, 0.0, 1.0); return mix(vec3(0.014, 0.020, 0.034), vec3(0.002, 0.003, 0.006), sqrt(u)); }
vec3 probe(vec3 pW, vec3 rW, float lod) { vec3 f = (uBoxMax - pW) / rW, s = (uBoxMin - pW) / rW; vec3 fa = max(f, s); float dist = min(min(fa.x, fa.y), fa.z); vec3 hit = pW + rW * dist; return textureLod(tProbe, hit - uProbePos, lod).rgb; }
vec3 heat(float h) { return h < 0.5 ? mix(vec3(0.03, 0.08, 0.30), vec3(0.95, 0.64, 0.25), h * 2.0) : mix(vec3(0.95, 0.64, 0.25), vec3(1.0), (h - 0.5) * 2.0); }
vec3 toSRGB(vec3 c) { c = clamp(c, 0.0, 1.0); return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c)); }
void main() { vec4 g = texture(tG, vUv); vec3 sc = texture(tScene, vUv).rgb; bool lake = g.a < 0.0; float d = abs(g.a);
  if (uView == 1) { float k = 1.0 - clamp((d - uNear) / (uDepthFar - uNear), 0.0, 1.0); if (g.a == 0.0) k = 0.0; o = vec4(vec3(k), 1.0); return; }
  if (!lake) { o = vec4(uView == 0 ? toSRGB(sc) : uView == 2 ? toSRGB(sc * 0.3) : vec3(0.09), 1.0); return; }
  vec3 n = normalize(g.rgb); vec3 p = viewPos(vUv, d); vec3 v = normalize(p); vec3 r = reflect(v, n);
  vec3 pW = (uInvView * vec4(p, 1.0)).xyz; vec3 rW = normalize((uInvView * vec4(r, 0.0)).xyz);
  if (uView == 3 || uView == 4) { Samp rec; Res R = march(p + n * 0.02, r, -1, rec);
    if (uView == 3) { vec3 c = R.cls == 1 ? vec3(0.35, 0.83, 0.54) : R.cls == 2 ? vec3(0.94, 0.36, 0.36) : R.cls == 3 ? vec3(0.95, 0.64, 0.25) : vec3(0.55, 0.58, 0.64); o = vec4(c, 1.0); return; }
    o = vec4(heat(float(R.reads) / float(uMaxSteps)), 1.0); return; }
  vec3 fall = uFill == 1 ? skyCol(rW) : uFill == 2 ? probe(pW, rW, uRough * 6.0) : sc;
  vec3 refl;

    hitRead(n ? pc(hitN) : 'no lake on screen'); readsRead(n ? (reads / n).toFixed(1) + (ssrMat.uniforms.uRays.value > 1 ? ' × ' + ssrMat.uniforms.uRays.value + ' rays' : '') : 'none'); endRead(pc(hitN) + ' · ' + pc(offN) + ' · ' + pc(outN)); fillRead(n ? pc(fillW) + ' · ' + pc(n - fillW) : 'none');
